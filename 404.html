<style>

  p{color:var(--dim);margin:14px 0 22px;}
  a.b{display:inline-block;padding:10px 18px;border-radius:12px;background:linear-gradient(135deg,var(--fry),var(--fry2));color:#1a1206;font-weight:700;text-decoration:none;}
  footer{text-align:center;color:var(--dim);font-size:13px;padding:18px 16px;}
