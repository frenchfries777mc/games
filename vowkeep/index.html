const FEAT=[['f1','ft1','fight'],['f2','ft2','boss'],['f3','ft3','frost'],['f4','ft4','lift'],['f5','ft5','abyss'],['f6','ft6','forest']];
const fg=document.getElementById('fgrid');
FEAT.forEach(([b,h,s])=>{const c=document.createElement('div');c.className='fc box';c.innerHTML='<div class="im"><img src="shot-'+s+'.jpg" alt="" loading="lazy"></div><div class="tx"><h3 data-i="'+h+'"></h3><p data-i="'+b+'"></p></div>';fg.appendChild(c);});
const gcats=document.getElementById('gcats'),gtips=document.getElementById('gtips');let GI=0;
const GUIDE=[['gc1',['gt1a','gt1b','gt1c']],['gc2',['gt2a','gt2b','gt2c']],['gc3',['gt3a','gt3b','gt3c']],['gc4',['gt4a','gt4b','gt4c']]];
GUIDE.forEach((g,i)=>{const b=document.createElement('button');b.className='pb sm';b.onclick=()=>{GI=i;guide();};gcats.appendChild(b);});
function guide(){gcats.querySelectorAll('button').forEach((b,i)=>{b.textContent=t(GUIDE[i][0]);b.classList.toggle('gold',i===GI);});
 gtips.innerHTML=GUIDE[GI][1].map(k=>'<li class="box">'+esc(t(k))+'</li>').join('');}
const vt=(v,f)=>LANG==='ko'?v[f]:((v.tr&&v.tr[f]&&(v.tr[f][LANG]||v.tr[f].en))||v[f]);
function render(d){
 DATA=d;const list=Array.isArray(d.versions)?d.versions:[],box=document.getElementById('vbox');
 if(!list.length){box.innerHTML='<div class="err">'+t('v_none')+'</div>';return;}
 const latest=list.find(v=>v.latest)||list[0],ver='v'+latest.version+(latest.build?' · b'+latest.build:'');
 [document.getElementById('playBtn'),document.getElementById('playBtn2')].forEach(a=>a.href=d.latestFile||latest.file);
  document.getElementById('footVer').textContent=t('foot_v',{v:ver,d:d.updated||latest.date});
 box.innerHTML=list.map(v=>'<div class="tv box"><div class="vn"><b class="v">v'+esc(v.version)+'</b>'+(v===latest?'<span class="badge">'+esc(t('v_latest'))+'</span>':'')+'<small>'+esc(t('v_build',{b:v.build?'b'+v.build:'—',d:v.date}))+'</small></div><p><b style="color:var(--gold)">'+esc(vt(v,'title'))+'</b> — '+esc(vt(v,'summary'))+'</p><div class="go"><a class="pb sm gold" href="'+esc(v.file)+'" target="_blank" rel="noopener">'+t('b_play')+'</a></div></div>').join('');
}
const SHOWN=5;
function renderNotes(d){
 NDATA=d;const raw=(d&&Array.isArray(d.notes))?d.notes:[],list=window.FFPN?FFPN.filter(raw):raw,box=document.getElementById('notesBox'),more=document.getElementById('notesMore');
 if(window.FFPN){FFPN.mount('notesBox',()=>renderNotes(NDATA));FFPN.count(list.length);}
 if(!list.length){box.innerHTML=(raw.length&&window.FFPN)?FFPN.none():'<div class="sub2">'+t('nt_none')+'</div>';more.style.display='none';return;}
 const all=box.dataset.all==='1'||!!(window.FFPN&&FFPN.q()),sh=all?list:list.slice(0,SHOWN);
 box.innerHTML=sh.map((n,ni)=>{const e=LANG==='ko'?null:n.tr&&(n.tr[LANG]||n.tr.en);
  const title=(e&&e.title)||n.title,items=(e&&e.items&&e.items.length===(n.items||[]).length)?e.items:(n.items||[]);
  return '<details class="box"'+(ni&&!(window.FFPN&&FFPN.q())?'':' open')+'><summary><b>'+esc(title)+'</b><small>'+esc(n.date)+(n.build?' · '+esc(n.build):'')+'</small></summary><ul>'+items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul></details>';}).join('');
 more.style.display=(!all&&list.length>SHOWN)?'':'none';
 more.onclick=()=>{box.dataset.all='1';renderNotes(d);};
}
const lg=document.getElementById('lg');
const lgv=document.createElement('optgroup');
I.L.concat(['au','sg','em']).forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=NAMES[l]||l;(VIRT[l]?lgv:lg).appendChild(o);});lg.appendChild(lgv);
lg.onchange=()=>{const v=lg.value,was=auOn();LANG=(v==='au'||v==='sg'||v==='em')?'en':v;try{localStorage.setItem(KEY,LANG);if(window.FFLang)FFLang.set(v);}catch(e){}if((v==='au'||v==='sg'||v==='em')||was){location.reload();return;}applyLang();};   // Aurebesh 등은 영어를 다른 글자로 보여 줘요 (ff-lang.js가 처리)
function applyLang(){
 document.documentElement.lang=LANG;lg.value=auOn()?FFLang.script():LANG;lgv.label=VLABEL[LANG]||VLABEL.en;
 document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.dataset.i);});
 const m=document.querySelector('meta[name=description]');if(m)m.content=t('desc');
 guide();render(DATA);renderNotes(NDATA);
}
applyLang();
fetch('patchnotes.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(renderNotes).catch(()=>{});
fetch('versions.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(render).catch(()=>{});
window.addEventListener('scroll',()=>document.getElementById('topbar').classList.toggle('solid',scrollY>window.innerHeight*.6),{passive:true});
</script>
<script src="https://frenchfries777mc.github.io/games/ff-auth.js"></script>
</body>
</html>
