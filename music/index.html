var lang='ko'; try{ if(window.FFLang){ var l=FFLang.get(); if(TR[l]) lang=l; } }catch(e){}
document.documentElement.lang=lang;
function t(s){ return lang!=='ko'&&TR[lang][s]||s; }
document.querySelectorAll('[data-u]').forEach(function(el){ var k=el.getAttribute('data-u'); if(lang!=='ko'&&TR[lang][k]) el.textContent=TR[lang][k]; });
if(lang!=='ko') document.title='Frenchfries777 Music';
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
var all=[], box=document.getElementById('games'), h='';
GAMES.forEach(function(g){
  h+='<h2><img src="'+g.img+'" alt="">'+esc(g.name)+'<a href="'+g.url+'">'+esc(t('게임 사이트'))+' →</a></h2><div class="list">';
  g.tracks.forEach(function(tk){ var i=all.length; all.push({f:tk.f,n:g.name+' · '+t(tk.n)});
    h+='<div class="tr" id="tr'+i+'"><button class="pb" data-i="'+i+'" aria-label="'+esc(t('play'))+'">▶</button><div><div class="nm">'+esc(t(tk.n))+'</div><div class="ds">'+esc(t(tk.d))+'</div></div><span class="tm" id="tm'+i+'">–:––</span></div>'; });
  h+='</div>';
});
box.innerHTML=h;
var au=new Audio(), cur=-1, loop=false; au.preload='none';
var bar=document.getElementById('bar'), seek=document.getElementById('seek'), barT=document.getElementById('barT'), barTm=document.getElementById('barTm'), loopBtn=document.getElementById('loopBtn');
function fmt(s){ if(!isFinite(s)) return '–:––'; s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function mark(){ all.forEach(function(_,i){ var r=document.getElementById('tr'+i); r.classList.toggle('on',i===cur); r.querySelector('.pb').textContent=(i===cur&&!au.paused)?'❚❚':'▶'; }); }
function play(i){
  if(i===cur){ if(au.paused) au.play().catch(function(){}); else au.pause(); return; }
  cur=i; au.src=all[i].f; au.loop=loop; au.play().catch(function(){}); barT.textContent=all[i].n; bar.classList.add('show'); mark();
}
box.addEventListener('click',function(e){ var b=e.target.closest('.pb'); if(b) play(+b.getAttribute('data-i')); });
au.addEventListener('play',mark); au.addEventListener('pause',mark);
au.addEventListener('loadedmetadata',function(){ var el=document.getElementById('tm'+cur); if(el) el.textContent=fmt(au.duration); });
au.addEventListener('timeupdate',function(){ if(au.duration){ seek.value=Math.round(au.currentTime/au.duration*1000); barTm.textContent=fmt(au.currentTime)+' / '+fmt(au.duration); } });
/* 재생 시간은 처음부터 보이게: 곡마다 길이(메타데이터)만 미리 읽는다 */
(function(){ var dur={}, q=all.map(function(_,i){ return i; });
  function show(i){ var el=document.getElementById('tm'+i); if(el&&dur[all[i].f]) el.textContent=fmt(dur[all[i].f]); }
  function next(){ if(!q.length) return; var i=q.shift(), f=all[i].f;
    if(dur[f]){ show(i); return next(); }
    var a=new Audio(), done=false; a.preload='metadata';
    function fin(){ if(done) return; done=true; clearTimeout(tm); if(isFinite(a.duration)&&a.duration>0){ dur[f]=a.duration; show(i); } a.removeAttribute('src'); a.load(); next(); }
    var tm=setTimeout(fin,8000); a.addEventListener('loadedmetadata',fin); a.addEventListener('error',fin); a.src=f; }
  next(); next(); })();
au.addEventListener('ended',function(){ if(!loop) play((cur+1)%all.length); });
seek.addEventListener('input',function(){ if(au.duration) au.currentTime=seek.value/1000*au.duration; });
loopBtn.addEventListener('click',function(){ loop=!loop; au.loop=loop; loopBtn.classList.toggle('on',loop); });
document.getElementById('nextBtn').addEventListener('click',function(){ play((cur+1)%all.length); });
})();
</script>
