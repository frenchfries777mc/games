a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left,0px))}

.box{background:var(--panel);box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),0 8px 0 3px rgba(0,0,0,.35)}

.logo{font:700 18px Galmuri,monospace;color:var(--gold);text-decoration:none;text-shadow:2px 2px 0 #000;margin-right:auto;letter-spacing:.04em}
.nav{display:flex;gap:2px;flex-wrap:wrap}

.lang{background:var(--panel);color:var(--tx);border:2px solid var(--line);font:13px Galmuri,monospace;padding:3px 6px}

.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:200px;background:linear-gradient(180deg,transparent,var(--bg));z-index:1}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,30,.25),rgba(8,12,30,0) 35%);z-index:1}
.hero .wrap{position:relative;z-index:2;width:100%;color:#f6efd8}
.hero .pb.gold{background:#f2c75a;border-color:#c79a30}
.hero .pb.dark{background:#4a3a24;color:#f6efd8;border-color:#6a5434}

 text-shadow:0 1px 0 #6b4318,0 2px 0 #6b4318,0 3px 0 #6b4318,0 4px 0 #6b4318,0 5px 0 #6b4318,0 6px 0 #6b4318,0 7px 0 #6b4318,0 8px 0 #4a2e14,0 14px 24px rgba(0,0,0,.5)}
.hero .sub{margin:14px 0 26px;font-size:clamp(15px,2.2vw,20px);max-width:28em;text-shadow:2px 2px 0 #000,0 0 14px #000a}

.pb{display:inline-block;font:700 17px Galmuri,monospace;text-decoration:none;cursor:pointer;padding:12px 22px;background:var(--btn);color:var(--btnink);border:2px solid var(--btn2);border-bottom-width:6px;border-radius:5px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.pb:hover{filter:brightness(1.08)}
.pb:active{transform:translateY(3px);border-bottom-width:3px}
.pb.gold{background:var(--gold);border-color:var(--gold2);color:#1a1203}
.pb.dark{background:var(--dark);color:var(--tx);border-color:var(--dark2)}

.meta{margin-top:16px;font-size:13px;color:inherit;text-shadow:2px 2px 0 #000}

section{padding:64px 0 0}
h2{display:inline-block;margin:0 0 14px;padding:4px 18px;font:700 26px Galmuri,monospace;color:var(--gold);letter-spacing:.03em;background:var(--panel);box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line)}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.fc{display:flex;flex-direction:column}

/* 갤러리 */

.tv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;align-items:center;padding:14px 18px}
.tv b.v{font:700 20px Galmuri,monospace;color:var(--gold)}
.tv small{color:var(--mu);margin-left:10px}
.badge{background:var(--gold);color:#1a1203;font:700 11px Galmuri,monospace;padding:0 7px;margin-left:8px}
.tv p{grid-column:1;margin:0;color:var(--tx);font-size:14px}
.tv .go{grid-column:2;grid-row:1/3;display:flex;gap:10px}
/* 패치노트 */
.nl{display:grid;gap:18px}
.nl details{}
.nl summary{cursor:pointer;list-style:none;padding:12px 18px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.nl summary::-webkit-details-marker{display:none}
.nl summary b{color:var(--gold);font-size:16px}
.nl summary small{color:var(--mu)}
.nl summary::after{content:"▼";margin-left:auto;color:var(--line);font-size:12px}
.nl details[open] summary::after{content:"▲"}
.nl ul{margin:0;padding:0 18px 16px 38px;font-size:14px}
.nl li{margin:4px 0}
.more{margin-top:18px}
/* 도움말 */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px}
ol.st{margin:0;padding:16px 18px 16px 38px;display:grid;gap:10px;font-size:14.5px}
details.q{margin-bottom:16px}
details.q summary{cursor:pointer;padding:10px 16px;font-weight:700;color:var(--gold)}
details.q p{margin:0;padding:0 16px 12px;font-size:14px;color:var(--tx)}
.cta{margin-top:70px;padding:40px 20px;text-align:center}
.cta h2{margin-bottom:4px}
.cta .btns{justify-content:center;margin-top:18px}
footer{padding:44px 0 50px;color:var(--mu);font-size:13px;text-align:center}
.err{color:#f08a6a}
@media (max-width:860px){
 .grid,.tips{grid-template-columns:1fr}

 .two{grid-template-columns:1fr}
 .stats{grid-template-columns:1fr 1fr}
 .tv{grid-template-columns:1fr}.tv .go{grid-column:1;grid-row:auto}
 .top{background:var(--ink)}
}
</style>

{const op=l=>'<option value="'+l+'"'+(l==='au'?' style="font-family:\'FF Aurebesh\',system-ui"':l==='sg'?' style="font-family:\'FF Galactic\',system-ui"':'')+'>'+NAMES[l]+'</option>';
