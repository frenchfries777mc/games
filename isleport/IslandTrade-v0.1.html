<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="https://frenchfries777mc.github.io/games/ff-lang.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Isleport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gugi&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{touch-action:manipulation}
:root{--ink:#1d1109;--text:#f6efd8;--muted:#d3bf94;--gold:#f2c75a;--gold-d:#8a5a14;--btn:#f3e4b0;--btn-d:#cdb87c;--btn-ink:#2a1f0c;--hot:#d7f19a;--field:#24160b;--line:#8a6238;--bad:#f08a6a;--good:#a8e08a;
 --px:'Press Start 2P',monospace;--ko:'Gugi','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#14324d;color:var(--text);font:13px/1.45 var(--ko);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(#3a2412,#27170a);border-bottom:3px solid var(--line);box-shadow:0 3px 0 var(--ink)}
.logo{font:15px var(--px);color:var(--gold);text-shadow:2px 2px 0 #5a3414;letter-spacing:1px}
.stat{display:flex;flex-direction:column;line-height:1.15}.stat small{font-size:10px;color:var(--muted)}.stat b{font:12px var(--px);color:var(--text)}
.tabs{display:flex;gap:4px}.tabs button,.pb{border:2px solid var(--btn-d);border-bottom-width:4px;background:var(--btn);color:var(--btn-ink);border-radius:5px;padding:5px 10px;font-weight:700}
.tabs button.on{background:var(--gold);border-color:#c79a30}
.pb:active,.tabs button:active{transform:translateY(2px);border-bottom-width:2px}
.pb.sm{padding:3px 7px;font-size:12px}.pb[disabled]{opacity:.45;cursor:default}
.pb.dark{background:#4a2e14;color:var(--text);border-color:#6a4220}
.pb.gold{background:var(--gold);border-color:#c79a30}
.sp{flex:1}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;background:#1f5a86}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
#side{width:272px;overflow-y:auto;background:linear-gradient(#2e1c0d,#22140a);border-left:3px solid var(--line);padding:8px 8px 20px;display:flex;flex-direction:column;gap:8px}
.box{background:var(--field);border:2px solid var(--line);border-radius:6px;padding:7px 8px;box-shadow:inset 0 0 0 1px #000}
.box h3{margin:0 0 5px;font:10px var(--px);color:var(--gold);letter-spacing:.5px}
.row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.muted{color:var(--muted);font-size:12px}
.inv{display:grid;grid-template-columns:1fr auto auto;gap:2px 8px;font-size:12.5px;align-items:center}
.inv .n{font-family:var(--px);font-size:10px}
.bar{height:6px;background:#0d0804;border:1px solid #000;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--good)}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;border:1px solid #000}
.good{color:var(--good)}.bad{color:var(--bad)}
.ship{border-top:1px dashed #5a3a1c;padding:5px 0}.ship:first-of-type{border-top:0}
.btns{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.inbox{border:2px solid var(--gold);background:#3a2a10}
#pop{position:absolute;z-index:5;min-width:210px;max-width:260px;background:linear-gradient(#3a2412,#2a190b);border:3px solid var(--line);border-radius:7px;padding:8px;box-shadow:0 0 0 2px var(--ink),0 6px 0 rgba(0,0,0,.35)}
#pop h4{margin:0 0 6px;font:11px var(--px);color:var(--gold)}
#pop .opt{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;margin:3px 0;border:2px solid var(--btn-d);border-bottom-width:3px;background:var(--btn);color:var(--btn-ink);border-radius:5px;padding:4px 8px;text-align:left}
#pop .opt[disabled]{opacity:.45}
#pop .opt small{font-size:11px;opacity:.75}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;z-index:30;pointer-events:none;align-items:center}
.toast{background:#2a190b;border:2px solid var(--gold);color:var(--text);padding:5px 12px;border-radius:5px;font-size:13px;box-shadow:0 3px 0 #000;animation:tin .2s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,18,30,.72);padding:12px}
.panel{width:min(520px,96vw);max-height:92vh;overflow-y:auto;background:linear-gradient(#3a2412,#27170a);border:3px solid var(--line);border-radius:8px;padding:14px;box-shadow:0 0 0 2px var(--ink),0 8px 0 rgba(0,0,0,.4)}
.panel h2{margin:0 0 8px;font:14px var(--px);color:var(--gold)}
#title{background:radial-gradient(ellipse at 50% 40%,rgba(31,90,134,.55),rgba(8,20,34,.92))}
#title .panel{text-align:center;display:flex;flex-direction:column;gap:9px;align-items:stretch}
#title h1{margin:4px 0 2px;font:30px var(--px);color:var(--gold);text-shadow:3px 3px 0 #5a3414,0 0 18px rgba(242,199,90,.4);letter-spacing:2px;line-height:1.3}
#title .sub{color:var(--muted)}
.big{padding:12px;font-size:16px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}.t td,.t th{padding:2px 4px;text-align:right}.t td:first-child,.t th:first-child{text-align:left}.t th{color:var(--muted);font-weight:400;font-size:11px}
.step{display:inline-flex;align-items:center;gap:3px}.step b{min-width:26px;text-align:center;font:10px var(--px)}
.ports{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
input[type=text],input[type=number],select{background:#120a04;color:var(--text);border:2px solid var(--line);border-radius:4px;padding:5px 7px;font:inherit;width:100%;-webkit-user-select:text;user-select:text}
.ach{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed #5a3a1c}.ach.got b{color:var(--gold)}.ach:not(.got){opacity:.5}
.ach .ic{width:26px;height:26px;border:2px solid var(--line);background:#120a04;display:flex;align-items:center;justify-content:center;font:9px var(--px);color:var(--gold)}
.note h4{margin:8px 0 3px;font:10px var(--px);color:var(--gold)}.note li{margin:2px 0}
@media (max-width:820px){#main{flex-direction:column}#side{width:auto;height:44%;border-left:0;border-top:3px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="logo">섬 상회</div>
    <div class="stat"><small>금화</small><b id="sMoney">0</b></div>
    <div class="stat"><small>재산</small><b id="sNet">0</b></div>
    <div class="tabs"><button data-v="island" class="on">섬</button><button data-v="sea">바다</button></div>
    <span class="sp"></span>
    <span id="roomTag" class="muted" hidden></span>
    <button class="pb sm gold" id="bHarvest">모두 수확</button>
    <button class="pb sm" id="bAch">업적</button>
    <button class="pb sm" id="bNotes">패치노트</button>
    <button class="pb sm dark" id="bMenu">메뉴</button>
  </div>
  <div id="main"><div id="stage"><canvas id="cv"></canvas><div id="pop" hidden></div></div><aside id="side"></aside></div>
  <div id="toast"></div>
</div>

<div id="title" class="ov">
  <div class="panel">
    <h1>섬 상회</h1>
    <div class="sub">작은 섬에서 작물을 키우고, 배에 실어 항구에 팔아요</div>
    <button class="pb big gold" id="bSingle">혼자 하기</button>
    <button class="pb big" id="bMulti">멀티플레이</button>
    <button class="pb" id="bHelp">하는 법</button>
    <div class="muted" id="who">Frenchfries777 계정으로 로그인하면 프로필 카드에 업적이 올라가요</div>
  </div>
</div>
<div id="modal" class="ov" hidden><div class="panel" id="mbody"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js" async></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://frenchfries777mc.github.io/games/ff-profile.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const LOCAL=/local/.test(location.hash);
let OFF=0;const NOW=()=>Date.now()+OFF;
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= 자료 ================= */
const GOODS=[
 {id:'wheat',n:'밀',base:12,grow:20,seed:5,yield:3,col:'#e8c24a',crop:1},
 {id:'potato',n:'감자',base:16,grow:25,seed:6,yield:3,col:'#b98a4a',crop:1},
 {id:'apple',n:'사과',base:30,grow:40,seed:10,yield:4,col:'#d9443a',crop:1},
 {id:'grape',n:'포도',base:42,grow:50,seed:14,yield:4,col:'#7a3e9d',crop:1},
 {id:'cotton',n:'목화',base:55,grow:60,seed:18,yield:4,col:'#f2f2ee',crop:1},
 {id:'bread',n:'빵',base:45,col:'#d9a45a'},
 {id:'wine',n:'와인',base:130,col:'#a0305a'},
 {id:'cloth',n:'옷감',base:140,col:'#5a8fd8'}];
const GI={};GOODS.forEach((g,i)=>{g.i=i;GI[g.id]=g;});
const RECIPES={bakery:{in:'wheat',n:2,out:'bread',time:15},winery:{in:'grape',n:2,out:'wine',time:25},loom:{in:'cotton',n:2,out:'cloth',time:30}};
const BLD={bakery:{n:'빵집',cost:150,roof:'#c0452f'},winery:{n:'와인 창고',cost:260,roof:'#7a3e9d'},loom:{n:'옷감 공방',cost:320,roof:'#3a6fb8'}};
const PORTS=[
 {n:'황금항',x:166,y:46,r:26,pf:[0.7,0.8,1.25,1.2,1.15,1.1,1.3,1.2],d:'밀과 감자가 흔한 곡창 항구'},
 {n:'붉은항',x:268,y:82,r:28,pf:[1.2,1.15,0.7,1.2,1.1,1.25,1.15,1.2],d:'사과 과수원이 많은 항구'},
 {n:'보랏항',x:222,y:162,r:26,pf:[1.15,1.2,1.15,0.7,1.2,1.2,0.85,1.25],d:'포도 농장과 와인으로 유명해요'},
 {n:'흰구름항',x:128,y:168,r:24,pf:[1.25,1.2,1.2,1.15,0.7,1.3,1.25,0.8],d:'목화밭과 옷감 시장이 있어요'}];
const WW=336,WH=208,COLS=6,HOME=[112,112];
const HOMES=[[70,112],[34,44],[34,180],[70,24],[70,200],[16,112],[104,14],[104,208]];
const SHIP_COST=[400,700,1100,1600,2200],CAPS=[20,35,55,80],CAP_COST=[250,600,1300],ESC_COST=[200,500,1000],WCAPS=[40,80,150,300],WCOST=[300,800,2000];
const PCOLS=['#f2c75a','#e0553f','#4fa3e0','#6fcf6a','#c46ee0','#f08a2a','#4fe0c8','#e0e0e0'];
const SPEED=3.6,SELLDROP=0.975,RAID_COST=100,RAID_CD=45000;
const ACH=[
 ['first_harvest','첫 수확','작물을 처음 수확하기'],['first_sale','첫 판매','항구에서 처음 팔기'],['bread','첫 빵','빵집에서 빵 만들기'],['wine','첫 와인','와인 만들기'],['cloth','첫 옷감','옷감 만들기'],
 ['plots18','밭 18칸','밭을 18칸으로 넓히기'],['plots24','밭 24칸','밭을 모두 열기'],['ship2','선단','배 2척 갖기'],['ship4','큰 선단','배 4척 갖기'],['ship6','대선단','배 6척 갖기'],
 ['sale1k','큰 장사','한 번에 1,000 금화 넘게 팔기'],['sale5k','대박','한 번에 5,000 금화 넘게 팔기'],['earn10k','만 금화','누적 수입 10,000'],['earn100k','십만 금화','누적 수입 100,000'],['money10k','금고 가득','금화 10,000 모으기'],
 ['all_crops','농부','다섯 작물을 모두 수확하기'],['visit_all','항해사','네 항구에 모두 가기'],['cap_up','큰 배','배 용량 올리기'],['escort','호위함','호위 달기'],
 ['mp_join','같이 하기','멀티 방에 들어가기'],['trade','거래꾼','다른 상회와 거래하기'],['pirate','해적왕','다른 배를 습격해 성공하기'],['defend','철벽 수비','해적을 물리치기']];
const ACHN={};ACH.forEach(a=>ACHN[a[0]]=a);
const NOTES=[{date:'2026-10-18',build:'v0.1',title:'첫 출항',items:['섬 상회 공개','밭 24칸, 작물 5가지, 가공 건물 3가지 추가','항구 4곳과 시세 변동, 풍년, 축제, 폭풍 추가','배 여섯 척까지 추가','멀티플레이 방 코드, 순위 추가','거래 제안, 선물, 해적 습격, 호위 추가','업적 23개 추가']}];

/* ================= 상태 ================= */
let S=null,DEM=PORTS.map(()=>GOODS.map(()=>1)),EV=[],MODE='off';
function fresh(){return {v:1,money:300,plots:Array(24).fill(null),unlocked:12,inv:{},capLv:0,ships:[{id:1,cl:0,esc:0,st:'dock'}],nextShip:2,stats:{sold:0,earned:0,harvest:0,raided:0,looted:0,crops:{},best:0},ach:{},visited:{},assets:0,t0:Date.now()};}
const cap=()=>WCAPS[S.capLv],shipCap=s=>CAPS[s.cl];
const inv=id=>S.inv[id]||0;
function addInv(id,n){const room=cap()-inv(id),a=Math.max(0,Math.min(n,room));S.inv[id]=inv(id)+a;return a;}
const gold=()=>Math.floor(S.money);
function unitPrice(p,gi){let m=PORTS[p].pf[gi]*DEM[p][gi];const t=NOW();EV.forEach(e=>{if(e.p===p&&e.until>t){if(e.kind==='boom'&&e.g===gi)m*=1.6;if(e.kind==='fest')m*=1.2;}});return GOODS[gi].base*m;}
function revenue(p,gi,n){let r=0,m=unitPrice(p,gi);for(let i=0;i<n;i++){r+=m;m*=SELLDROP;}return r;}
function stormAt(p){const t=NOW();return EV.some(e=>e.p===p&&e.kind==='storm'&&e.until>t);}
const dist=p=>Math.hypot(PORTS[p].x-HOME[0],PORTS[p].y-HOME[1]);
const travel=p=>Math.round(dist(p)/SPEED*(stormAt(p)?1.5:1)*1000);
function netWorth(){if(!S)return 0;let v=S.money+S.assets*0.5;GOODS.forEach(g=>{v+=inv(g.id)*g.base;});S.ships.forEach(s=>{if(s.cargo)for(const k in s.cargo)v+=s.cargo[k]*GI[k].base;});return v;}
function unlock(id){if(!S||S.ach[id])return;S.ach[id]=1;toast('업적 달성 <b style="color:var(--gold)">'+ACHN[id][1]+'</b>');syncAch();}
function toast(h){const t=document.createElement('div');t.className='toast';t.innerHTML=h;const b=$('toast');b.appendChild(t);setTimeout(()=>t.remove(),2800);while(b.children.length>4)b.firstChild.remove();}
const FL=[];function float(x,y,txt,col){FL.push({x,y,txt,col:col||'#f2c75a',t:performance.now()});}

/* ================= 행동 ================= */
function plotXY(i){const c=i%COLS,r=Math.floor(i/COLS);return [OX+34+c*37,OY+44+r*33];}
function buyPlot(){const cost=60+20*(S.unlocked-12);if(S.unlocked>=24||S.money<cost)return;S.money-=cost;S.assets+=cost;S.unlocked++;if(S.unlocked>=18)unlock('plots18');if(S.unlocked>=24)unlock('plots24');}
function plant(i,id){const g=GI[id];if(S.plots[i]||i>=S.unlocked||S.money<g.seed)return;S.money-=g.seed;S.plots[i]={k:'crop',g:id,t0:NOW(),auto:false};}
function build(i,b){const c=BLD[b].cost;if(S.plots[i]||i>=S.unlocked||S.money<c)return;S.money-=c;S.assets+=c;S.plots[i]={k:'bld',b,end:0};}
function demolish(i){const p=S.plots[i];if(!p)return;if(p.k==='bld'){S.money+=BLD[p.b].cost*0.5;S.assets-=BLD[p.b].cost;}S.plots[i]=null;}
const ripe=p=>p&&p.k==='crop'&&NOW()-p.t0>=GI[p.g].grow*1000;
function harvest(i,silent){const p=S.plots[i];if(!ripe(p))return 0;const g=GI[p.g],a=addInv(g.id,g.yield);if(a<=0){if(!silent)toast('창고가 가득 찼어요');return 0;}
  S.stats.harvest+=a;S.stats.crops[g.id]=1;unlock('first_harvest');if(GOODS.filter(x=>x.crop).every(x=>S.stats.crops[x.id]))unlock('all_crops');
  const [x,y]=plotXY(i);float(x+17,y+6,'+'+a+' '+g.n,g.col);
  if(p.auto&&S.money>=g.seed){S.money-=g.seed;p.t0=NOW();}else S.plots[i]=null;return a;}
function harvestAll(){let n=0;for(let i=0;i<S.unlocked;i++)n+=harvest(i,true)?1:0;if(!n)toast('수확할 작물이 없어요');}
function buyShip(){if(S.ships.length>=6)return;const c=SHIP_COST[S.ships.length-1];if(S.money<c)return;S.money-=c;S.assets+=c;S.ships.push({id:S.nextShip++,cl:0,esc:0,st:'dock'});if(S.ships.length>=2)unlock('ship2');if(S.ships.length>=4)unlock('ship4');if(S.ships.length>=6)unlock('ship6');}
function upCap(s){if(s.cl>=3)return;const c=CAP_COST[s.cl];if(S.money<c)return;S.money-=c;S.assets+=c;s.cl++;unlock('cap_up');}
function upEsc(s){if(s.esc>=3)return;const c=ESC_COST[s.esc];if(S.money<c)return;S.money-=c;S.assets+=c;s.esc++;unlock('escort');}
function upWare(){if(S.capLv>=3)return;const c=WCOST[S.capLv];if(S.money<c)return;S.money-=c;S.assets+=c;S.capLv++;}
function dispatch(sid,p,cargo){const s=S.ships.find(x=>x.id===sid);if(!s||s.st!=='dock')return false;let tot=0;for(const k in cargo){if(cargo[k]>inv(k))return false;tot+=cargo[k];}
  if(tot<=0||tot>shipCap(s))return false;const d=travel(p),t=NOW();for(const k in cargo)S.inv[k]=inv(k)-cargo[k];
  Object.assign(s,{st:'sail',port:p,t0:t,t1:t+d,cargo,back:false,raided:false});return true;}
function arrive(s){const p=s.port;let total=0;const parts=[];for(const k in s.cargo){const n=s.cargo[k];if(n<=0)continue;const gi=GI[k].i,r=revenue(p,gi,n);total+=r;parts.push(GI[k].n+' '+n);
    DEM[p][gi]=Math.max(0.35,DEM[p][gi]*Math.pow(SELLDROP,n));if(MP.on&&!MP.host)MP.send({t:'sell',p,g:gi,n});}
  S.money+=total;S.stats.sold+=1;S.stats.earned+=total;S.stats.best=Math.max(S.stats.best,total);S.visited[p]=1;
  if(total>0){toast(`${PORTS[p].n}에서 <b style="color:var(--gold)">+${fmt(total)}</b> (${parts.join(', ')})`);unlock('first_sale');}
  if(total>=1000)unlock('sale1k');if(total>=5000)unlock('sale5k');if(S.stats.earned>=10000)unlock('earn10k');if(S.stats.earned>=100000)unlock('earn100k');
  if(S.visited[0]&&S.visited[1]&&S.visited[2]&&S.visited[3])unlock('visit_all');
  s.cargo={};s.back=true;s.t0=NOW();s.t1=s.t0+travel(p)*0.9;}
let tickT=0;
function tick(dt){if(!S)return;const t=NOW();
  S.plots.forEach((p,i)=>{if(!p||p.k!=='bld')return;const r=RECIPES[p.b];
    if(p.end){if(t>=p.end&&inv(r.out)<cap()){addInv(r.out,1);p.end=0;const u={bakery:'bread',winery:'wine',loom:'cloth'}[p.b];unlock(u);}}
    else if(inv(r.in)>=r.n&&inv(r.out)<cap()){S.inv[r.in]-=r.n;p.end=t+r.time*1000;}});
  S.ships.forEach(s=>{if(s.st==='sail'&&t>=s.t1){if(!s.back)arrive(s);else{s.st='dock';s.back=false;}}});
  if(S.money>=10000)unlock('money10k');
  if(!MP.on||MP.host){PORTS.forEach((_,p)=>GOODS.forEach((_,g)=>{DEM[p][g]+=(1-DEM[p][g])*0.01*dt;}));
    EV=EV.filter(e=>e.until>t);
    if(t>(tick.nextEv||0)){tick.nextEv=t+(70+Math.random()*80)*1000;const p=Math.floor(Math.random()*4),k=['boom','fest','storm'][Math.floor(Math.random()*3)];
      const e={p,kind:k,g:Math.floor(Math.random()*8),until:t+90000};EV.push(e);announce(e);}}
}
function announce(e){const P=PORTS[e.p].n;toast(e.kind==='boom'?`${P}에 ${GOODS[e.g].n} 풍년 수요! 값이 올라요`:e.kind==='fest'?`${P}에서 축제가 열려요. 모든 물건 값이 올라요`:`${P} 쪽 바다에 폭풍! 가는 시간이 늘어요`);}
function evText(e){const s=Math.max(0,Math.round((e.until-NOW())/1000));return (e.kind==='boom'?`${PORTS[e.p].n} · ${GOODS[e.g].n} 수요 +60%`:e.kind==='fest'?`${PORTS[e.p].n} · 축제 +20%`:`${PORTS[e.p].n} · 폭풍 항해 +50%`)+` (${s}초)`;}

async function openTransport(code,host){
  if(LOCAL){const bc=new BroadcastChannel('islandtrade-'+code);bc.onmessage=e=>onMsg(e.data);return {send:m=>bc.postMessage(m),close:()=>bc.close()};}
  await loadPeer();
  return new Promise((res,rej)=>{
    if(host){const peer=new Peer('islandtrade-'+code),conns=[];
      peer.on('open',()=>res({send:m=>conns.forEach(c=>{try{c.send(m);}catch(e){}}),close:()=>{try{peer.destroy();}catch(e){}}}));
      peer.on('error',e=>rej(e));
      peer.on('connection',c=>{conns.push(c);c.on('data',d=>{onMsg(d);if(d&&d.to&&d.to!==MP.me)conns.forEach(o=>{if(o!==c)try{o.send(d);}catch(e){}});});c.on('close',()=>{const i=conns.indexOf(c);if(i>=0)conns.splice(i,1);});});}
    else{const peer=new Peer();let done=false;peer.on('error',e=>{if(!done)rej(e);});
      peer.on('open',()=>{const c=peer.connect('islandtrade-'+code,{reliable:true});setTimeout(()=>{if(!done)rej(new Error('timeout'));},9000);
        c.on('open',()=>{done=true;res({send:m=>{try{c.send(m);}catch(e){}},close:()=>{try{peer.destroy();}catch(e){}}});});
        c.on('data',d=>onMsg(d));c.on('close',()=>{if(MP.on)mpLeave('방장과 연결이 끊겼어요');});});}
  });}

function offerTo(pid,dir,g,n,price){if(n<=0||price<0)return false;
  if(dir==='sell'){if(inv(g)<n)return false;S.inv[g]=inv(g)-n;}else{if(S.money<price)return false;S.money-=price;}
  const id=rid();MP.offers[id]={dir,g,n,price};sendTo(pid,{t:'offer',id,dir,g,n,price});
  setTimeout(()=>{const o=MP.offers[id];if(!o)return;delete MP.offers[id];if(o.dir==='sell')S.inv[o.g]=inv(o.g)+o.n;else S.money+=o.price;toast('거래 제안이 시간 초과로 취소됐어요');},62000);return true;}
function answerOffer(id,ok){const i=MP.inbox.findIndex(o=>o.id===id);if(i<0)return;const o=MP.inbox[i];MP.inbox.splice(i,1);
  if(!ok){sendTo(o.from,{t:'offerres',id,ok:0});return;}
  if(o.dir==='sell'){if(S.money<o.price){toast('금화가 모자라요');MP.inbox.push(o);return;}if(inv(o.g)+o.n>cap()){toast('창고에 자리가 모자라요');MP.inbox.push(o);return;}
    S.money-=o.price;addInv(o.g,o.n);sendTo(o.from,{t:'settle',id,gold:o.price});}
  else{if(inv(o.g)<o.n){toast('물건이 모자라요');MP.inbox.push(o);return;}S.inv[o.g]=inv(o.g)-o.n;S.money+=o.price;sendTo(o.from,{t:'settle',id,goods:{g:o.g,n:o.n}});}
  toast('거래가 이루어졌어요');unlock('trade');}
function gift(pid,g,n,goldAmt){if(g){if(inv(g)<n||n<=0)return;S.inv[g]=inv(g)-n;sendTo(pid,{t:'gift',g,n});}else{if(S.money<goldAmt||goldAmt<=0)return;S.money-=goldAmt;sendTo(pid,{t:'gift',gold:goldAmt});}toast('선물을 보냈어요');}
function raid(pid,ship){if(Date.now()<MP.cool){toast('해적이 아직 쉬는 중이에요 ('+Math.ceil((MP.cool-Date.now())/1000)+'초)');return;}if(S.money<RAID_COST){toast('고용비가 모자라요');return;}

  if(k==='port')DP.p=+v;else if(k==='close'){DP=null;closeModal();return;}
  else if(k==='m')DP.cargo[v]=Math.max(0,(DP.cargo[v]||0)-1);
  else if(k==='p'){if(dpTotal()<capn&&(DP.cargo[v]||0)<inv(v))DP.cargo[v]=(DP.cargo[v]||0)+1;}
  else if(k==='x'){const room=capn-dpTotal()+(DP.cargo[v]||0);DP.cargo[v]=Math.min(inv(v),room);}
  else if(k==='clear')DP.cargo={};
  else if(k==='auto'){DP.cargo={};let room=capn;GOODS.map(g0=>g0).sort((a,b)=>unitPrice(DP.p,b.i)-unitPrice(DP.p,a.i)).forEach(g0=>{const n=Math.min(inv(g0.id),room);if(n>0){DP.cargo[g0.id]=n;room-=n;}});}
  else if(k==='go'){if(dispatch(DP.sid,DP.p,DP.cargo)){toast('출항!');DP=null;closeModal();updateHud();renderSide(true);return;}}
  renderDispatch();});
let TR=null;
function openTrade(pid){const pl=MP.players[pid];if(!pl)return;TR={pid,tab:'offer',dir:'sell',g:'wheat',n:5,price:60};renderTrade();}
function renderTrade(){const pl=MP.players[TR.pid];if(!pl){closeModal();return;}const g0=GI[TR.g];
  let h=`<h2>${esc(pl.name)}와(과) 거래</h2><div class="btns"><button class="pb sm ${TR.tab==='offer'?'gold':''}" data-t="tab:offer">거래 제안</button><button class="pb sm ${TR.tab==='gift'?'gold':''}" data-t="tab:gift">선물</button></div><div style="height:8px"></div>
   <label class="muted">물건</label><select id="trG">${GOODS.map(q=>`<option value="${q.id}" ${q.id===TR.g?'selected':''}>${q.n} (창고 ${inv(q.id)}) 시장가 ${q.base}</option>`).join('')}</select>
   <label class="muted">개수</label><input id="trN" type="number" min="1" value="${TR.n}">`;
  if(TR.tab==='offer'){h+=`<label class="muted">방식</label><select id="trD"><option value="sell" ${TR.dir==='sell'?'selected':''}>내가 물건을 팔기</option><option value="buy" ${TR.dir==='buy'?'selected':''}>내가 물건을 사기</option></select>
   <label class="muted">총 금액 (금화)</label><input id="trP" type="number" min="0" value="${TR.price}"><div class="muted" style="margin-top:4px">물건이나 금화는 제안하는 순간 맡겨 두고, 거절되거나 60초가 지나면 돌려받아요</div>`;}
  else h+=`<div class="muted" style="margin-top:4px">선물은 돌려받을 수 없어요. 금화 선물은 아래 칸에 적어요</div><label class="muted">금화 선물</label><input id="trP" type="number" min="0" value="${TR.price}">`;
  h+=`<div class="btns" style="margin-top:10px"><button class="pb gold" data-t="send">보내기</button><button class="pb dark" data-t="close">닫기</button></div>`;modal(h);}
$('mbody').addEventListener('input',e=>{if(!TR)return;if(e.target.id==='trG'){TR.g=e.target.value;TR.price=Math.round(GI[TR.g].base*TR.n);const p=$('trP');if(p)p.value=TR.price;}if(e.target.id==='trN'){TR.n=Math.max(1,+e.target.value||1);TR.price=Math.round(GI[TR.g].base*TR.n);const p=$('trP');if(p)p.value=TR.price;}if(e.target.id==='trP')TR.price=Math.max(0,+e.target.value||0);if(e.target.id==='trD')TR.dir=e.target.value;});
$('mbody').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b||!TR)return;const k=b.dataset.t.split(':');
  if(k[0]==='tab'){TR.tab=k[1];renderTrade();}else if(k[0]==='close'){TR=null;closeModal();}
  else if(k[0]==='send'){let ok=false;if(TR.tab==='offer')ok=offerTo(TR.pid,TR.dir,TR.g,TR.n,TR.price);else{if(TR.price>0)gift(TR.pid,null,0,TR.price);else gift(TR.pid,TR.g,TR.n,0);ok=true;}
    if(ok){if(TR.tab==='offer')toast('제안을 보냈어요');TR=null;closeModal();updateHud();renderSide(true);}else toast('물건이나 금화가 모자라요');}});
function openAch(){let h=`<h2>업적 ${Object.keys(S?S.ach:{}).length}/${ACH.length}</h2>`;ACH.forEach(a=>{const got=S&&S.ach[a[0]];h+=`<div class="ach ${got?'got':''}"><div class="ic">${got?'OK':'--'}</div><div><b>${a[1]}</b><div class="muted">${a[2]}</div></div></div>`;});h+=`<div class="btns" style="margin-top:10px"><button class="pb dark" onclick="closeModal()">닫기</button></div>`;modal(h);}
function openNotes(){let h='<h2>패치노트</h2><div class="note">';NOTES.forEach(n=>{h+=`<h4>${n.date} · ${n.build} ${n.title}</h4><ul>${n.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;});h+=`</div><div class="btns" style="margin-top:10px"><button class="pb dark" onclick="closeModal()">닫기</button></div>`;modal(h);}
function openHelp(){modal(`<h2>하는 법</h2><div class="note"><ul>
 <li>섬 화면에서 빈 밭을 눌러 작물을 심어요. 다 자라면 눌러서 수확해요.</li>
 <li>밀, 포도, 목화는 빵집, 와인 창고, 옷감 공방에서 가공하면 훨씬 비싸게 팔려요. 건물은 재료가 창고에 있으면 알아서 일해요.</li>
 <li>창고 옆 "출항"으로 배에 짐을 싣고 항구로 보내요. 항구마다 값이 달라요. 같은 물건을 많이 팔면 값이 내려가고 시간이 지나면 돌아와요.</li>
 <li>풍년, 축제, 폭풍 같은 소식이 가끔 와요. 바다 화면에서 항구를 누르면 시세를 볼 수 있어요.</li>
 <li><b>멀티플레이</b>: 방 코드로 모여서 같은 시장을 나눠 써요. 한 사람이 많이 팔면 모두의 값이 내려가요. 바다에서 다른 상회의 배를 눌러 <b>해적 습격</b>을 보내거나, 순위 칸에서 <b>거래·선물</b>을 할 수 있어요. 배에 <b>호위</b>를 달면 습격을 막기 쉬워요.</li>
 <li>끝이 없는 게임이에요. 재산을 계속 늘려 보세요. 멀티에서는 재산 순위를 겨뤄요.</li></ul></div><div class="btns" style="margin-top:10px"><button class="pb dark" onclick="closeModal()">닫기</button></div>`);}

/* ================= 메뉴, 시작 ================= */
function showTitle(){$('title').hidden=false;$('modal').hidden=true;closePop();
  const sv=loadSave();$('bSingle').textContent=sv?'혼자 하기 (이어하기)':'혼자 하기';
  const b=$('bNew');if(b)b.remove();if(sv){const n=document.createElement('button');n.id='bNew';n.className='pb';n.textContent='새로 시작';n.onclick=()=>{if(n.dataset.arm){try{localStorage.removeItem(SAVEK);}catch(e){}startSingle(false);}else{n.dataset.arm=1;n.textContent='정말 지울까요? 한 번 더';}};$('bSingle').after(n);}}
function startSingle(cont){const sv=cont?loadSave():null;if(sv){S=sv.S;DEM=sv.DEM;EV=sv.EV||[];}else{S=fresh();DEM=PORTS.map(()=>GOODS.map(()=>1));EV=[];}
  MP.on=false;$('roomTag').hidden=true;$('title').hidden=true;markOnce();setView('island');fit();renderSide(true);updateHud();syncAch();save();}
$('bSingle').onclick=()=>startSingle(true);
$('bHelp').onclick=openHelp;$('bNotes').onclick=openNotes;$('bAch').onclick=openAch;$('bHarvest').onclick=()=>{if(S){harvestAll();updateHud();}};
$('bMenu').onclick=()=>{if(MP.on){modal(`<h2>나갈까요?</h2><div class="muted">방에서 나가면 이 판은 사라져요.</div><div class="btns" style="margin-top:10px"><button class="pb gold" id="mLeave">나가기</button><button class="pb dark" onclick="closeModal()">계속하기</button></div>`);$('mLeave').onclick=()=>mpLeave();}else{save();S=null;showTitle();}};
$('bMulti').onclick=()=>{modal(`<h2>멀티플레이</h2><div class="muted">같은 시장에서 겨루고, 거래하고, 해적도 해요. 끝은 없고 재산 순위를 겨뤄요.</div><div class="btns" style="margin:10px 0"><button class="pb gold big" id="mMake">방 만들기</button></div>
 <label class="muted">방 코드로 들어가기</label><input id="mCode" type="text" maxlength="4" placeholder="코드 4글자" style="text-transform:uppercase"><div class="btns" style="margin-top:8px"><button class="pb" id="mJoin">들어가기</button><button class="pb dark" onclick="closeModal()">닫기</button></div>`);
  $('mMake').onclick=()=>startMP(true,Math.random().toString(36).slice(2,6).toUpperCase());
  $('mJoin').onclick=()=>{const c=$('mCode').value.trim().toUpperCase();if(c.length!==4){toast('코드는 4글자예요');return;}startMP(false,c);};};
window.addEventListener('resize',()=>{fit();});
new ResizeObserver(()=>fit()).observe($('stage'));

/* ================= 루프 ================= */
let last=performance.now(),lastSave=0,lastSide=0;
function loop(now){const dt=Math.min(1,(now-last)/1000);last=now;
  if(VW){draw();}
  if(S){tick(dt);updateHud();if(now-lastSide>400&&!POPOPEN){lastSide=now;renderSide(false);}if(now-lastSave>4000){lastSave=now;save();}}
  requestAnimationFrame(loop);}
fit();initAuth();showTitle();requestAnimationFrame(loop);
window.__it={get S(){return S;},set OFF(v){OFF=v;},get OFF(){return OFF;},DEMget:()=>DEM,MP,tick,startSingle,startMP,setView,dispatch,harvestAll,plant,build,buyShip,unitPrice,GOODS,PORTS,netWorth,openDispatch,offerTo,answerOffer,raid,onMsg};
</script>
