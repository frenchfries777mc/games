.big{padding:12px;font-size:16px}

  P('밭을 눌렀을 때 "모든 밭 다시 심기"를 켜면 수확한 밭에 씨앗을 자동으로 다시 심어요 (연구 "자동 파종" 필요)','Turn on "Replant in every field" in a field menu to auto-replant after harvest (needs the Auto-sowing research)'),
  P('건물이 더 정교해졌어요. 뾰족한 지붕, 기와 결, 굴뚝, 창틀과 문을 새로 그렸어요','Buildings are more detailed, with proper pitched roofs, shingles, chimneys, window frames and doors'),
  P('낮과 밤, 날씨, 계절이 바뀔 때 천천히 이어지도록 바꿨어요','Day and night, weather and seasons now change gradually'),
  P('창고를 직접 늘릴 수 있어요. 헛간의 "창고 늘리기"에서 한 번에 칸마다 25개씩 10번까지 늘려요','You can expand the warehouse from the barn: +25 per slot, up to 10 times'),
  P('항구에서 선원을 고용해요. 항해사, 포수, 짐꾼, 장사꾼이 있고 성격마다 월급과 솜씨가 달라요','Hire sailors at the harbor: navigators, gunners, porters and hagglers with different personalities'),
  P('직접 항해 중 바다에 떠다니는 병을 건지면 지도 조각을 얻고, 세 조각마다 비밀 섬이 하나씩 나타나요 (산호섬, 호박섬, 유적 환초)','Fish up bottles while sailing to collect map pieces. Every three pieces reveal a secret island'),
  P('마을 입구에 내 가게가 생겼어요. 물건을 진열하고 값을 정하면 손님이 사 가요','A shop of your own opens in town. Display goods, set the price and customers come'),
  P('마을 대형 주문이 들어와요. 가공품을 모아 납품하고, 연결하면 방 사람들과 함께 채워 보상을 나눠요','Town big orders arrive. Deliver processed goods, or fill them together with the room and split the reward'),
  P('도감 등급이 생겼어요. 물건을 10개 모을 때마다 등급이 오르고 판매가 조금씩 올라요. 연못, 풍차 모형, 정자, 작은 등대, 황금 나무, 별빛 등불을 꾸미기에서 쓸 수 있어요','Codex tiers: every 10 goods raises your tier and sale prices, and unlocks six new decorations'),
  P('섬마다 그 섬에서만 해금되는 특산 작물이 생겼어요 (황금보리, 석류, 사프란, 구름솜, 해초, 용과)','Each island now has a specialty crop you can only unlock there'),
  P('항구가 가공품 주문을 내요. 쿠키, 빵 같은 가공품을 납품하면 보상이 훨씬 커요','Ports now post orders for processed goods with much bigger rewards'),
  P('직접 항해로 항구에 상륙하면 창고의 물건을 바로 팔고, 그 항구의 물건을 사고, 주문을 납품해요','Land at a port with your own ship to sell, buy and fill orders on the spot'),
  P('집에서 꾸미기를 열어 돌길, 꽃밭, 나무, 벤치, 가로등, 깃발, 분수, 동상을 섬에 놓을 수 있어요. 방문한 사람에게도 보여요','Decorate your island from home with paths, flowers, trees, benches, lamps, flags, a fountain and a statue. Visitors see them too'),
  P('밭, 목장, 마을, 항구가 걸어서 이어지는 한 장의 큰 맵이 됐어요','Fields, ranch, town and harbor are now one big map you can walk across'),
  P('캐릭터를 직접 조종해서 돌아다녀요','You walk around by controlling your character'),
  P('밭을 48칸까지 늘릴 수 있고, 빈 밭은 팔 수도 있어요','Fields can grow up to 48 plots, and empty ones can be sold'),
  P('목장이 12칸으로 커지고 동물도 더 많아졌어요','The ranch grew to 12 pens with more animals'),
  P('메뉴를 없애고, 집·창고·연구·은행·게시판·항구 건물에 걸어가서 써요','No menus: walk up to the home, warehouse, research mill, bank, notice board and harbor to use them'),
  P('로비 화면을 새로 꾸몄어요','The lobby got a new layout'),
  P('섬이 밭, 목장, 마을, 바다 네 곳으로 넓어졌어요','The isle grew into four places: fields, ranch, town and sea'),
  P('항구가 6곳이 되고, 물건을 사서 돌아오는 수입 무역을 추가했어요','Six ports now, plus importing goods on the way home'),
  P('항구 계약, 평판, 방문 상인, 해적을 추가했어요','Added port contracts, reputation, visiting traders and pirates'),
  P('계절 4가지와 날씨, 낮과 밤이 생겼어요','Added four seasons, weather and day-night'),
  P('연구 16가지, 계급 7단계, 은행, 안내 과제 12개를 추가했어요','Added 16 researches, 7 ranks, a bank and 12 guide quests'),
  P('배 종류 3가지와 조선소를 추가했어요','Added three ship types and a shipyard'),
  P('씨앗은 종자 상점에서 사서 써요. 처음엔 밀 씨앗 6개만 있어요','Seeds now come from the seed shop; you start with only 6 wheat seeds'),
  P('목장 부지 그림을 풀, 흙, 돌, 울타리까지 촘촘하게 다시 그렸어요','Ranch lots are redrawn with dense grass, dirt, stones and fences'),
  P('Frenchfries777 계정으로 로그인할 수 있어요 (로비와 집)','You can log in with a Frenchfries777 account from the lobby or home'),
  P('달걀과 밀가루로 쿠키, 달걀과 우유로 푸딩을 만들 수 있어요. 장터에서 가공하면 얼마나 비싸지는지 알려 줘요','Cookies from eggs and flour, pudding from eggs and milk; the market shows how much more processing earns'),
  P('배를 직접 몰아 다른 섬에 상륙할 수 있어요. 섬마다 시작섬에 없는 씨앗과 가공 건물을 금화로 해금해요','Sail your own ship to other islands and unlock seeds and workshops your home island lacks'),
  P('이름이 Isleport로 바뀌고 로비 배경에 등대와 풍차가 있는 섬이 생겼어요','The game is now called Isleport, with a new lobby island of lighthouse and windmill'),
  P('밭 한 칸이 더 커지고 작물이 더 촘촘히 자라요','Each field plot is bigger and crops grow denser'),
  P('마을 입구에 장터가 생겨서 창고의 물건을 바로 팔 수 있어요','A market at the town gate lets you sell goods straight from the warehouse'),
  P('돈과 물건이 모두 바닥나면 이웃이 품삯을 줘서 다시 시작할 수 있어요','If you run out of gold and goods, a neighbor pays a wage so you can restart'),
  P('각자 자기 섬이 있어요. 다른 사람의 섬을 구경하러 갈 수 있어요','Everyone has their own island, and you can visit other players’ islands'),
  P('섬에서 만난 사람과 서로 올린 물건과 금화를 보면서 실시간으로 거래해요','Trade live with the person you meet: both see the offers and swap when ready'),
  P('방 코드로 연결하면 경매, 채팅, 함께 짓는 공사도 있어요','Connect by room code for auctions, chat and shared projects'),
  P('처음엔 불편하고 뒤로 갈수록 알아서 돌아가요: 일꾼 12명, 컨베이어, 온실, 스프링클러','Slow at first, automatic later: up to 12 workers, conveyors, greenhouses and sprinklers'),
  P('밭 그림을 더 촘촘하게 그리고 밭 48칸을 서로 붙였어요','Fields have more pixel detail and the 48 plots now sit side by side'),
  P('물건이 65가지, 작물 17가지, 동물 7가지로 늘었어요','Now 65 goods, 17 crops and 7 animals'),

 "5초마다 기록해요": {

  "es": "Se registra cada 5 segundos",

  "de": "Alle 5 Sekunden erfasst"
 },
 "<b>밭</b>: 빈 밭을 눌러 작물을 심고, 다 자라면 눌러서 수확해요. 계절마다 자라는 속도가 달라요. 과일나무는 한 번 심으면 계속 열려요.": {
  "ja": "<b>畑</b>：空き畑をタップして作物を植え、育ったらタップして収穫します。季節ごとに育つ速さが変わります。果樹は一度植えれば実り続けます。",
  "es": "<b>Campos</b>: toca un campo vacío para sembrar y tócalo de nuevo cuando esté maduro. La velocidad de crecimiento cambia con las estaciones. Los árboles frutales siguen dando fruto.",
  "fr": "<b>Champs</b> : touche un champ vide pour semer, puis touche-le quand c’est mûr. La vitesse de pousse change avec les saisons. Les arbres fruitiers donnent toujours des fruits.",
  "de": "<b>Felder</b>: Tippe auf ein leeres Feld zum Säen und noch einmal, wenn es reif ist. Das Wachstum hängt von der Jahreszeit ab. Obstbäume tragen immer weiter."
 },
 "<b>목장</b>: 닭장, 양 우리, 소 외양간에는 먹이를 주고, 낚시터는 먹이가 필요 없어요. 단계를 올리면 더 빨리, 더 많이 나와요.": {
  "ja": "<b>牧場</b>：鶏小屋、羊小屋、牛小屋には餌をあげます。釣り場は餌がいりません。アップグレードすると、より速く、より多く採れます。",
  "es": "<b>Rancho</b>: los gallineros, apriscos y establos necesitan alimento; las cabañas de pesca no. Las mejoras los hacen más rápidos y productivos.",
  "fr": "<b>Ranch</b> : poulaillers, bergeries et étables ont besoin de nourriture ; les cabanes de pêche non. Les améliorations les rendent plus rapides et plus généreux.",
  "de": "<b>Ranch</b>: Hühnerställe, Schafpferche und Kuhställe brauchen Futter; Fischerhütten nicht. Ausbauten machen sie schneller und ergiebiger."
 },
 "<b>마을</b>: 건물을 지으면 재료가 창고에 있을 때 알아서 가공해요. 건물을 누르면 만들 것을 고를 수 있어요. 가판대는 물건을 조금씩 팔고, 방문 상인은 값을 더 쳐줘요.": {
  "ja": "<b>町</b>：建物を建てると、材料が倉庫にあるとき自動で加工します。建物をタップして作る物を選べます。露店は品物を少しずつ売り、行商人は高く買い取ってくれます。",
  "es": "<b>Pueblo</b>: los talleres fabrican solos cuando hay ingredientes en el almacén. Toca uno para elegir una receta. Los puestos venden despacio; los comerciantes viajeros pagan extra.",
  "fr": "<b>Village</b> : les ateliers fabriquent seuls quand les ingrédients sont en stock. Touche-en un pour choisir une recette. Les étals vendent doucement ; les marchands ambulants paient plus.",
  "de": "<b>Dorf</b>: Werkstätten stellen automatisch her, wenn die Zutaten vorrätig sind. Tippe auf eine, um ein Rezept zu wählen. Stände verkaufen langsam; Besuchshändler zahlen extra."
 },
 "<b>바다</b>: 출항에서 배에 짐을 싣고 항구로 보내요. 항구마다 값이 달라요. 같은 물건을 많이 팔면 값이 내려가고 시간이 지나면 돌아와요. 향신료, 비단 같은 수입품은 항구에서 사 와요.": {
  "ja": "<b>海</b>：出航で船に荷物を積んで港へ送ります。港ごとに値段が違います。同じ品物をたくさん売ると値段が下がり、時間がたつと戻ります。香辛料や絹などの輸入品は港で買い付けます。",
  "es": "<b>Mar</b>: carga un barco y envíalo a un puerto. Los precios cambian según el puerto; vender mucho baja el precio, que se recupera con el tiempo. Compra importaciones como especias y seda en los puertos.",
  "fr": "<b>Mer</b> : charge un navire et envoie-le vers un port. Les prix varient selon le port ; vendre beaucoup fait baisser le prix, qui remonte avec le temps. Achète des produits importés comme les épices et la soie dans les ports.",
  "de": "<b>Meer</b>: Belade ein Schiff und schicke es zu einem Hafen. Die Preise unterscheiden sich je Hafen; große Verkäufe senken den Preis, der sich mit der Zeit erholt. Kaufe Importe wie Gewürze und Seide in den Häfen."
 },
 "항구 <b>계약</b>을 채우면 보상과 평판을 얻어요. 평판이 높으면 팔 때 더 받아요.": {
  "ja": "港の<b>契約</b>を果たすと、報酬と評判がもらえます。評判が高いと販売時にもっと稼げます。",
  "es": "Cumple <b>contratos</b> de puerto para ganar recompensas y reputación; con más reputación se paga más.",
  "fr": "Remplis des <b>contrats</b> de port pour gagner des récompenses et de la réputation ; une meilleure réputation rapporte plus.",
  "de": "Erfülle <b>Aufträge</b> der Häfen für Belohnungen und Ansehen; höheres Ansehen zahlt mehr."
 },
 "<b>연구</b>, <b>은행</b>, <b>공공 공사</b>로 더 키울 수 있어요. 해적이 나올 수 있으니 배에 호위를 달아 보세요.": {
  "ja": "<b>研究</b>、<b>銀行</b>、<b>共同事業</b>でさらに成長できます。海賊が出ることがあるので、船に護衛をつけてみましょう。",
  "es": "Usa la <b>investigación</b>, el <b>banco</b> y las <b>obras comunes</b> para crecer. Pueden atacar piratas; añade escoltas.",
  "fr": "Utilise la <b>recherche</b>, la <b>banque</b> et les <b>chantiers communs</b> pour te développer. Des pirates peuvent attaquer ; équipe tes navires d’escortes.",
  "de": "Nutze <b>Forschung</b>, die <b>Bank</b> und <b>Gemeinschaftsbauten</b>, um zu wachsen. Piraten können angreifen; setze Eskorten ein."
 },
 "<b>다른 섬과 연결</b>: 집이나 게시판에서 방을 만들거나 코드로 들어가요. 연결하면 다른 사람의 섬을 구경하러 갈 수 있고, 섬에서 만난 사람과 <b>실시간 거래</b>를 해요. 서로 올린 물건과 금화를 보면서 둘 다 준비를 누르면 바로 바뀌어요. 연결하지 않아도 혼자 계속 할 수 있어요. 경매, 채팅, 함께 짓는 공사, 바다의 해적 습격도 있어요.": {
  "ja": "<b>ほかの島とつながる</b>: 家や掲示板で部屋を作るか、コードで入ります。つながると、ほかの人の島を見に行けて、島で会った人と<b>ライブ取引</b>ができます。お互いの品物とお金を見ながら、二人とも準備を押すとすぐに交換されます。つながらなくても一人で続けられます。オークション、チャット、みんなで建てる工事、海の海賊襲撃もあります。",
  "es": "<b>Conectar con otros</b>: crea una sala o entra con un código en casa o en el tablón. Conectado, puedes visitar las islas de otros jugadores e iniciar un <b>trueque en vivo</b> con quien te encuentres: ambos ven las ofertas y el intercambio ocurre cuando los dos pulsan Listo. Siempre puedes seguir jugando solo. También hay subastas, chat, obras compartidas y asaltos piratas.",
  "fr": "<b>Se connecter aux autres</b> : crée une salle ou entre avec un code à la maison ou au panneau d’affichage. Connecté, tu peux visiter les îles des autres joueurs et lancer un <b>échange en direct</b> avec qui tu croises : chacun voit les offres et l’échange se fait quand les deux appuient sur Prêt. Tu peux toujours jouer seul. Il y a aussi des enchères, un chat, des chantiers communs et des raids de pirates.",
  "de": "<b>Mit anderen verbinden</b>: Erstelle zu Hause oder am Schwarzen Brett einen Raum oder tritt per Code bei. Verbunden kannst du fremde Inseln besuchen und mit jedem, dem du begegnest, einen <b>Live-Handel</b> starten: Beide sehen die Angebote, getauscht wird, sobald beide auf Bereit drücken. Allein weiterspielen geht immer. Auktionen, Chat, gemeinsame Bauprojekte und Piratenüberfälle gibt es auch."
 },
 "<b>처음은 불편해요</b>: 창고는 칸마다 30개, 밭은 6칸, 일은 직접 해요. 연구, 일꾼, 창고 늘리기, 컨베이어, 온실, 스프링클러를 갖추면 점점 알아서 돌아가요.": {
  "ja": "<b>最初は不便です</b>: 倉庫は1マス30個、畑は6マス、仕事は自分でします。研究、働き手、倉庫拡張、コンベア、温室、スプリンクラーをそろえると、だんだん自動で回ります。",
  "es": "<b>Empieza lento</b>: 30 por casilla de almacén, 6 campos y haces las tareas tú. Con investigación, peones, almacén mayor, cintas, invernadero y aspersores, todo irá solo.",
  "fr": "<b>Ça commence lentement</b> : 30 par case d’entrepôt, 6 champs et tu fais les corvées toi-même. Recherche, ouvriers, entrepôt agrandi, convoyeurs, serres et arroseurs feront tout tourner seul.",
  "de": "<b>Am Anfang zäh</b>: 30 pro Lagerplatz, 6 Felder, und du erledigst alles selbst. Mit Forschung, Arbeitern, größerem Lager, Förderbändern, Gewächshaus und Sprinklern läuft später alles von allein."
 },
 "<b>직접 항해</b>: 항구에서 \"직접 항해\"를 고르면 배를 직접 몰아요. 방향키·WASD·화면 터치로 움직이고, 섬 가까이에서 E(폰은 행동 버튼)로 상륙해요. 섬마다 시작섬에 없는 씨앗과 가공 건물을 금화로 해금할 수 있어요. 우리 항구에서 E로 돌아와요.": {
  "ja": "<b>自分で航海</b>: 港で「自分で航海」を選ぶと船を操縦できます。矢印キー・WASD・画面タッチで動かし、島の近くでE(スマホは行動ボタン)を押して上陸します。島ごとに、母島にない種や加工施設をゴールドで解放できます。自分の港でEを押すと戻れます。",
  "es": "<b>Navegar tú mismo</b>: elige «Navegar tú mismo» en el puerto y pilota el barco. Muévete con las flechas, WASD o tocando la pantalla, y desembarca cerca de una isla con E (en el móvil, el botón de acción). Cada isla te deja desbloquear con oro semillas y talleres que tu isla inicial no tiene. Vuelve con E en tu puerto.",
  "fr": "<b>Naviguer soi-même</b> : choisissez « Naviguer soi-même » au port pour piloter le bateau. Déplacez-vous avec les flèches, WASD ou en touchant l’écran, et accostez près d’une île avec E (sur mobile, le bouton d’action). Chaque île permet de débloquer, contre de l’or, des graines et ateliers absents de votre île de départ. Revenez avec E à votre port.",
  "de": "<b>Selbst segeln</b>: Wähle im Hafen „Selbst segeln“, um das Schiff selbst zu steuern. Bewege dich mit Pfeiltasten, WASD oder Berühren des Bildschirms und lege nahe einer Insel mit E an (am Handy mit der Aktionstaste). Jede Insel schaltet gegen Gold Saatgut und Werkstätten frei, die deine Startinsel nicht hat. Mit E im eigenen Hafen kehrst du zurück."
 },
 "<b>종자 상점</b>: 씨앗은 처음에 조금만 있어요. 마을 입구의 종자 상점에서 작물별 씨앗을 사 두었다가 밭에 심어요.": {
  "ja": "<b>種の店</b>: 種は最初は少ししかありません。町の入口の種の店で作物ごとの種を買っておき、畑にまきます。",
  "es": "<b>Tienda de semillas</b>: al empezar tienes pocas semillas. Compra semillas por cultivo en la tienda de la entrada del pueblo y siémbralas en tus campos.",
  "fr": "<b>Boutique de graines</b> : tu démarres avec peu de graines. Achète des graines par culture à la boutique de l’entrée du village et sème-les dans tes champs.",
  "de": "<b>Saatgutladen</b>: Du startest mit wenig Saatgut. Kaufe Saatgut je Pflanze im Laden am Stadttor und säe es auf deinen Feldern."
 },
 "<b>장터</b>: 마을 입구 장터에서 창고의 물건을 바로 팔 수 있어요. 값은 기본가의 65%라서, 모이면 배에 실어 항구로 보내는 게 더 이득이에요. 돈이 바닥나서 아무것도 못 할 때는 이웃이 품삯을 조금 줘요.": {
  "ja": "<b>市場</b>: 町の入口の市場で、倉庫の品物をすぐ売れます。値段は基本価格の65%なので、たまったら船で港へ送るほうが得です。お金も品物も尽きて何もできないときは、隣人が少し手間賃をくれます。",
  "es": "<b>Mercado</b>: vende productos del almacén al instante en el mercado de la entrada del pueblo por el 65 % del precio base; enviarlos a un puerto paga más. Si te quedas sin nada, un vecino te paga un pequeño jornal.",
  "fr": "<b>Marché</b> : vends les produits de l’entrepôt sur le champ au marché de l’entrée du village, à 65 % du prix de base ; les envoyer dans un port rapporte plus. Si tu n’as plus rien, un voisin te verse un petit salaire.",
  "de": "<b>Markt</b>: Verkaufe Waren aus dem Lager sofort am Markt am Stadttor für 65 % des Grundpreises; Verschiffen in einen Hafen bringt mehr. Wenn du nichts mehr hast, zahlt dir ein Nachbar einen kleinen Lohn."
 },
 "<b>이동</b>: 방향키나 WASD로 캐릭터를 걸어 다니게 해요. 가까이 가면 테두리가 켜지고, E나 스페이스(폰은 행동 버튼)로 써요. 다 자란 작물과 동물 산물은 위를 걸으면 저절로 모아요. 화면을 눌러도 그쪽으로 걸어가요.": {
  "ja": "<b>移動</b>: 矢印キーかWASDでキャラクターを歩かせます。近づくと枠が光り、EかスペースキーでOK(スマホは行動ボタン)。育った作物や動物の産物は上を歩くと自動で集まります。画面をタップしてもそこへ歩いて行きます。",
  "es": "<b>Movimiento</b>: camina con las flechas o WASD. Los objetos cercanos se resaltan; pulsa E o Espacio (el botón Acción en el móvil) para usarlos. Si pasas sobre cultivos maduros o productos de animales, se recogen solos. Tocar la pantalla también te lleva allí.",
  "fr": "<b>Déplacement</b> : marche avec les flèches ou WASD. Un objet proche est entouré ; appuie sur E ou Espace (bouton Action sur mobile) pour l’utiliser. Marcher sur des cultures mûres ou des produits d’animaux les ramasse tout seul. Toucher l’écran t’y emmène aussi.",
  "de": "<b>Bewegung</b>: Laufe mit den Pfeiltasten oder WASD. Nahe Objekte werden umrandet; drücke E oder Leertaste (auf dem Handy die Aktion-Taste) zum Benutzen. Reife Pflanzen und Tierprodukte sammelst du beim Darüberlaufen automatisch. Tippen auf den Bildschirm führt dich ebenfalls dorthin."
 },
 "끝이 없는 게임이에요. 천천히 섬을 키워 보세요. 키보드 1~4로 화면을 바꿀 수 있어요.": {

 "<b>마을</b>: 건물을 누르고 만들 것을 고르면 창고의 재료를 넣어 가공해요. 완성품은 직접 꺼내 창고로 옮겨요. 연구로 이 일을 자동화할 수 있어요. 가판대는 물건을 조금씩 팔고, 방문 상인은 값을 더 쳐줘요.": {
  "ja": "<b>町</b>：建物をタップして作る物を選ぶと、倉庫の材料を入れて加工します。完成品は自分で取り出して倉庫へ運びます。研究でこの作業を自動化できます。露店は品物を少しずつ売り、行商人は高く買い取ってくれます。",

 "가공은 처음에 손으로 해요. 건물을 눌러 재료를 넣고, 다 만들면 완성품을 꺼내 창고로 옮겨요. 연구 \"재료 자동 투입\"과 \"완성품 자동 운반\"으로 자동화해요": {
  "ja": "加工は最初は手作業です。建物をタップして材料を入れ、できたら完成品を取り出して倉庫へ運びます。研究「材料の自動投入」と「完成品の自動運搬」で自動化できます",
  "es": "Al principio se fabrica a mano: toca un edificio para cargar ingredientes y, al terminar, saca los productos y llévalos al almacén. Automatízalo con las investigaciones «Carga automática» y «Transporte automático»",

 "직접 항해로 섬에 닿으면 그 섬의 맵으로 상륙해요. 섬마다 모양과 풍경이 달라요: 황금항은 밀밭과 풍차, 레드포트은 사과 과수원, 라벤더포트은 포도밭과 돌 저택, 코튼포트은 목화밭과 양, 솔트베이은 어촌과 만, 향신항은 시장 천막, 산호섬은 산호 웅덩이, 호박섬은 송진 숲, 유적 환초는 옛 기둥과 제단이에요": {

  "es": "Al llegar navegando a una isla desembarcas en su propio mapa. Cada isla es distinta: Puerto Dorado tiene trigales y molino, Redport un manzanar, Lavender Port viñedos y una villa de piedra, Cotton Port algodón y ovejas, Salt Bay un pueblo pesquero en una bahía, Puerto Especia tiendas de bazar, Cayo de Coral pozas de coral, Isla de Ámbar un bosque de resina y Atolón de las Ruinas viejas columnas y un altar",

  "fr": "Les contrats, c’est la confiance. Ceux qui vont jusqu’au bout vont loin.",
  "de": "Aufträge sind Vertrauenssache. Wer sie zu Ende bringt, kommt weit."
 },
 "낡은 장부": {
  "en": "The old ledger",
  "ja": "古い帳簿",
  "es": "El viejo libro de cuentas",
  "fr": "Le vieux registre",
  "de": "Das alte Kontobuch"
 },
 "아이고, 마침 왔구나. 헛간을 정리하다가 네 할아버지의 낡은 장부를 찾았단다.": {
  "en": "Oh my, just in time. While tidying the barn I found your grandfather's old ledger.",
  "ja": "おや、ちょうどいいところに来たね。納屋を片付けていたら、おまえのおじいさんの古い帳簿が出てきたんだよ。",
  "es": "Vaya, llegas justo a tiempo. Ordenando el granero encontré el viejo libro de cuentas de tu abuelo.",
  "fr": "Ah, tu tombes bien. En rangeant la grange, j’ai trouvé le vieux registre de ton grand-père.",
  "de": "Ach, du kommst gerade recht. Beim Aufräumen der Scheune habe ich das alte Kontobuch deines Großvaters gefunden."
 },
 "이 섬 상회를 처음 연 분이 네 할아버지였지. 장부 첫 장에 \"밀 스무 포대부터 시작하라\"고 적혀 있어.": {
  "en": "Your grandfather was the one who first opened the trading house on this island. The first page says, \"Start with twenty sacks of wheat.\"",
  "ja": "この島の商会を最初に開いたのはおまえのおじいさんだったのさ。帳簿の最初のページに「小麦二十袋から始めよ」と書いてある。",
  "es": "Tu abuelo fue quien abrió la primera casa de comercio de esta isla. En la primera página pone: «Empieza con veinte sacos de trigo».",
  "fr": "C’est ton grand-père qui a ouvert la première maison de commerce de l’île. La première page dit : « Commence par vingt sacs de blé. »",
  "de": "Dein Großvater hat das erste Handelshaus dieser Insel eröffnet. Auf der ersten Seite steht: „Fang mit zwanzig Säcken Weizen an.“"
 },
 "그분처럼 밭부터 가꿔 보렴. 작물을 스무 개만 거둬 오면 다음 장을 읽어 주마.": {
  "en": "Tend the fields first, like he did. Bring in twenty crops and I'll read you the next page.",
  "ja": "あの人みたいにまずは畑を耕してごらん。作物を二十個収穫してきたら、次のページを読んであげよう。",
  "es": "Cuida primero los campos, como hacía él. Cosecha veinte cultivos y te leeré la página siguiente.",
  "fr": "Occupe-toi d’abord des champs, comme lui. Récolte vingt cultures et je te lirai la page suivante.",
  "de": "Kümmere dich zuerst um die Felder, so wie er. Ernte zwanzig Feldfrüchte, dann lese ich dir die nächste Seite vor."
 },
 "작물 20개 수확하기": {
  "en": "Harvest 20 crops",
  "ja": "作物を20個収穫する",
  "es": "Cosecha 20 cultivos",
  "fr": "Récolter 20 cultures",
  "de": "20 Feldfrüchte ernten"
 },
 "작물을 스무 개 거둬 오렴. 밭에서 손을 부지런히 놀리면 금방이란다.": {
  "en": "Bring in twenty crops. Keep your hands busy in the fields and you'll be done in no time.",
  "ja": "作物を二十個収穫しておいで。畑でせっせと手を動かせばすぐだよ。",
  "es": "Cosecha veinte cultivos. Si trabajas con ganas en el campo, terminarás enseguida.",
  "fr": "Récolte vingt cultures. Avec un peu d’ardeur aux champs, ce sera vite fait.",
  "de": "Ernte zwanzig Feldfrüchte. Wenn du fleißig auf dem Feld arbeitest, geht das schnell."
 },
 "잘했다! 흙을 다루는 솜씨가 그분과 똑같구나.": {
  "en": "Well done! You handle the soil just like he did.",
  "ja": "よくやった！土の扱い方があの人にそっくりだね。",
  "es": "¡Bien hecho! Trabajas la tierra igual que él.",
  "fr": "Bravo ! Tu travailles la terre exactement comme lui.",
  "de": "Gut gemacht! Du gehst mit der Erde um wie er."
 },
 "장부 뒤쪽엔 항구 이야기가 이어지는데, 나는 바다를 몰라서… 부두의 오르간 영감을 찾아가 보렴.": {
  "en": "The back of the ledger goes on about the harbor, but I don't know the sea… Go see old Organ at the pier.",
  "ja": "帳簿の後ろのほうは港の話が続くんだけど、わたしは海のことはわからなくてね… 桟橋のオルガンじいさんを訪ねてごらん。",
  "es": "La parte final del libro habla del puerto, pero yo no sé nada del mar… Ve a ver al viejo Organ en el muelle.",
  "fr": "La fin du registre parle du port, mais moi je ne connais rien à la mer… Va voir le vieil Organ sur le quai.",
  "de": "Hinten im Kontobuch geht es um den Hafen, aber vom Meer verstehe ich nichts… Besuch den alten Organ am Steg."
 },
 "항해사의 부탁": {
  "en": "The navigator's request",
  "ja": "航海士の頼み",
  "es": "El encargo del navegante",
  "fr": "La demande du navigateur",
  "de": "Die Bitte des Navigators"
 },
 "자네가 그 장부 주인이구먼. 나는 오르간, 한때 자네 할아버지 배의 항해사였지.": {
  "en": "So you're the owner of that ledger. I'm Organ, once navigator on your grandfather's ship.",
  "ja": "おまえさんがその帳簿の持ち主か。わしはオルガン、かつておまえさんのおじいさんの船で航海士をしておった。",
  "es": "Así que tú eres el dueño de ese libro. Soy Organ, antaño navegante en el barco de tu abuelo.",
  "fr": "C’est donc toi le propriétaire de ce registre. Je suis Organ, autrefois navigateur sur le navire de ton grand-père.",
  "de": "Du bist also der Besitzer dieses Buchs. Ich bin Organ, einst Navigator auf dem Schiff deines Großvaters."
 },
 "장부에는 항구 이야기가 가득할 거야. 하지만 바다 냄새를 맡아야 장부가 읽히는 법이지.": {
  "en": "That ledger must be full of harbor tales. But you have to smell the sea before it makes sense.",
  "ja": "帳簿には港の話がたっぷりあるだろう。だが、海の匂いを嗅がんと帳簿は読めんものじゃ。",
  "es": "Ese libro estará lleno de historias del puerto. Pero hay que oler el mar para entenderlo.",
  "fr": "Ce registre doit être plein d’histoires de port. Mais il faut sentir la mer pour le comprendre.",
  "de": "Das Buch steckt sicher voller Hafengeschichten. Aber man muss das Meer riechen, um es zu verstehen."
 },
 "배를 한 번 띄워 보게. 어디든 좋아, 항구를 다녀오면 되네.": {
  "en": "Put a ship out to sea. Anywhere will do, just sail to a port and back.",
  "ja": "船を一度出してみい。どこでもいい、港に行って帰ってくればよい。",
  "es": "Saca un barco al mar. Da igual adónde: ve a un puerto y vuelve.",
  "fr": "Mets un navire à la mer. N’importe où : va jusqu’à un port et reviens.",
  "de": "Schick ein Schiff hinaus. Egal wohin, fahr einfach zu einem Hafen und zurück."
 },
 "배를 한 번 보내기": {
  "en": "Send a ship once",
  "ja": "船を1回出す",
  "es": "Envía un barco una vez",
  "fr": "Envoyer un navire une fois",
  "de": "Einmal ein Schiff losschicken"
 },
 "배는 부두에서 출항할 수 있다네. 일단 한 번 띄워 보게.": {
  "en": "Ships set sail from the pier. Just send one out first.",
  "ja": "船は桟橋から出航できる。まずは一度出してみい。",
  "es": "Los barcos zarpan desde el muelle. Primero envía uno.",
  "fr": "Les navires partent du quai. Envoies-en déjà un.",
  "de": "Schiffe legen am Steg ab. Schick erst einmal eins los."
 },
 "좋아, 파도가 낯설지 않은 얼굴이군.": {
  "en": "Good, the waves aren't strangers to you anymore.",
  "ja": "よし、波に慣れた顔になったな。",
  "es": "Bien, las olas ya no te son extrañas.",
  "fr": "Bien, les vagues ne te sont plus étrangères.",
  "de": "Gut, die Wellen sind dir nicht mehr fremd."
 },
 "이건 내가 오래 간직하던 낡은 지도 조각이네. 받게.": {
  "en": "Here's an old map piece I've kept for years. Take it.",
  "ja": "これはわしが長いこと大事にしてきた古い地図の欠片じゃ。受け取れ。",
  "es": "Aquí tienes un viejo fragmento de mapa que guardé durante años. Tómalo.",
  "fr": "Voici un vieux fragment de carte que je garde depuis des années. Prends-le.",
  "de": "Hier ist ein altes Kartenstück, das ich lange aufbewahrt habe. Nimm es."
 },
 "믿을 만한 상인": {
  "en": "A trustworthy merchant",
  "ja": "信頼できる商人",
  "es": "Un mercader de confianza",
  "fr": "Un marchand de confiance",
  "de": "Ein vertrauenswürdiger Händler"
 },
 "어머, 그 장부 혹시 이 섬 상회의 것인가요? 우리 할머니가 늘 말씀하셨어요. 그 상회와 오래 거래했다고.": {
  "en": "Oh my, is that ledger from this island's trading house? My grandmother always said she traded with it for years.",
  "ja": "まあ、その帳簿ってもしかしてこの島の商会のものですか？ うちの祖母がいつも言っていました。あの商会と長く取引していたって。",
  "es": "Vaya, ¿ese libro es de la casa de comercio de esta isla? Mi abuela siempre decía que comerció con ella durante años.",
  "fr": "Oh, ce registre serait-il celui de la maison de commerce de l’île ? Ma grand-mère disait toujours qu’elle avait longtemps commercé avec elle.",
  "de": "Oh, ist das Buch etwa vom Handelshaus dieser Insel? Meine Großmutter sagte immer, sie habe lange mit ihm gehandelt."
 },
 "장부 속 거래처가 우리 집안이었네요. 계약 두 건만 성실히 마쳐 보세요.": {
  "en": "So the client in the ledger was my family. Finish just two contracts faithfully.",
  "ja": "帳簿の取引先はうちの家だったんですね。契約を2件だけ誠実にやり遂げてみてください。",
  "es": "Así que el cliente del libro era mi familia. Cumple fielmente solo dos contratos.",
  "fr": "Le client du registre, c’était donc ma famille. Remplis fidèlement deux contrats.",
  "de": "Der Kunde im Buch war also meine Familie. Erfülle gewissenhaft nur zwei Aufträge."
 },
 "믿을 만한 상인인지 보고 싶어요.": {
  "en": "I want to see if you're a merchant I can trust.",
  "ja": "信頼できる商人かどうか見てみたいんです。",
  "es": "Quiero ver si eres un mercader de confianza.",
  "fr": "Je veux voir si tu es un marchand digne de confiance.",
  "de": "Ich will sehen, ob du ein Händler bist, dem man trauen kann."
 },
 "계약 2건 끝내기": {
  "en": "Finish 2 contracts",
  "ja": "契約を2件終える",
  "es": "Cumple 2 contratos",
  "fr": "Remplir 2 contrats",
  "de": "2 Aufträge erfüllen"
 },
 "계약은 항만 사무소에서 볼 수 있어요. 두 건만 마쳐 주세요.": {
  "en": "You'll find contracts at the harbor office. Just finish two.",
  "ja": "契約は港湾事務所で見られます。2件だけ終えてください。",
  "es": "Encontrarás los contratos en la oficina portuaria. Cumple solo dos.",
  "fr": "Les contrats se trouvent à la capitainerie. Remplis-en deux.",
  "de": "Aufträge findest du im Hafenamt. Erfülle einfach zwei."
 },
 "수고했어요. 정말 믿을 만하네요.": {
  "en": "Good work. You really are trustworthy.",
  "ja": "お疲れさまでした。本当に信頼できますね。",
  "es": "Buen trabajo. De verdad eres de fiar.",
  "fr": "Beau travail. Tu es vraiment digne de confiance.",
  "de": "Gute Arbeit. Dir kann man wirklich trauen."
 },
 "그런데 하나만 물어볼게요. 장부의 내용을 저한테도 보여 줘도 괜찮을까요?": {
  "en": "But let me ask you one thing. Would you mind showing me what's in the ledger?",
  "ja": "ところでひとつ聞いてもいいですか？ 帳簿の中身を私にも見せてもらえませんか？",
  "es": "Pero déjame preguntarte algo. ¿Te importaría enseñarme lo que hay en el libro?",
  "fr": "Mais laisse-moi te demander une chose. Ça t’ennuierait de me montrer le contenu du registre ?",
  "de": "Aber eine Frage noch: Würdest du mir zeigen, was im Buch steht?"
 },
 "기꺼이 보여 준다": {
  "en": "Gladly show her",
  "ja": "喜んで見せる",
  "es": "Enseñárselo con gusto",
  "fr": "Le lui montrer volontiers",
  "de": "Gern zeigen"
 },
 "고마워요! 함께 맞춰 보니 지도 한 장이 더 나왔어요.": {
  "en": "Thank you! Piecing it together, we found another map.",
  "ja": "ありがとう！一緒に照らし合わせたら、地図がもう一枚出てきました。",
  "es": "¡Gracias! Al juntar las piezas, ha aparecido otro mapa.",
  "fr": "Merci ! En recoupant nos informations, une carte de plus est apparue.",
  "de": "Danke! Beim Zusammensetzen ist noch eine Karte aufgetaucht."
 },
 "아직은 비밀로 하겠다": {
  "en": "Keep it secret for now",
  "ja": "まだ秘密にしておく",
  "es": "Guardar el secreto por ahora",
  "fr": "Garder le secret pour l’instant",
  "de": "Vorerst geheim halten"
 },
 "조심스러운 분이군요. 그것도 좋은 상인의 덕목이죠. 사례로 드릴게요.": {
  "en": "You're a careful one. That's a good merchant's virtue too. Here's a reward.",
  "ja": "慎重な方ですね。それも良い商人の美徳です。お礼にこれを。",
  "es": "Eres prudente. Esa también es una virtud de buen mercader. Toma una recompensa.",
  "fr": "Tu es prudent. C’est aussi une qualité de bon marchand. Voici une récompense.",
  "de": "Du bist vorsichtig. Auch das ist eine Tugend guter Händler. Hier, eine Belohnung."
 },
 "사라진 새벽호": {
  "en": "The lost Dawn",
  "ja": "消えた暁号",
  "es": "El Alba desaparecido",
  "fr": "L’Aurore disparue",
  "de": "Die verschollene Morgenröte"
 },
 "아직은 때가 아니네. 자네가 이 바다에서 이름을 좀 더 알린 뒤에 얘기해 주겠네.": {
  "en": "Not yet. Make more of a name for yourself on these seas, then we'll talk.",
  "ja": "まだその時ではない。おまえさんがこの海でもう少し名を上げたら話してやろう。",
  "es": "Aún no es el momento. Hazte más nombre en estos mares y entonces hablaremos.",
  "fr": "Pas encore. Fais-toi un nom sur ces mers, et nous en reparlerons.",
  "de": "Noch nicht. Mach dir auf diesen Meeren erst einen Namen, dann reden wir."
 },
 "장부 뒤쪽에 새벽호란 배 이름이 있지? 자네 할아버지가 마지막으로 몬 배였어.": {
  "en": "See the ship's name in the back of the ledger, the Dawn? It was the last ship your grandfather sailed.",
  "ja": "帳簿の後ろに暁号という船の名前があるじゃろう？ おまえさんのおじいさんが最後に操った船じゃ。",
  "es": "¿Ves al final del libro el nombre de un barco, el Alba? Fue el último barco que gobernó tu abuelo.",
  "fr": "Tu vois le nom de navire à la fin du registre, l’Aurore ? C’est le dernier navire que ton grand-père a commandé.",
  "de": "Siehst du hinten im Buch den Schiffsnamen Morgenröte? Das war das letzte Schiff deines Großvaters."
 },
 "폭풍이 몰아치던 밤, 새벽호는 사라졌고 장부 마지막 장도 찢어졌지.": {
  "en": "On a stormy night the Dawn vanished, and the ledger's last page was torn away.",
  "ja": "嵐が吹き荒れた夜、暁号は消え、帳簿の最後のページも破れてしもうた。",
  "es": "Una noche de tormenta el Alba desapareció, y la última página del libro quedó arrancada.",
  "fr": "Par une nuit de tempête, l’Aurore a disparu, et la dernière page du registre a été arrachée.",
  "de": "In einer Sturmnacht verschwand die Morgenröte, und die letzte Seite des Buchs wurde herausgerissen."
 },
 "이 바다에서 이름 있는 상인이 되면 사람들이 입을 열 걸세. 계급을 두 단계 이상 올려 보게.": {
  "en": "Become a merchant with a name on these seas and people will talk. Raise your rank by two or more.",
  "ja": "この海で名のある商人になれば、皆が口を開くだろう。ランクを2段階以上上げてみい。",
  "es": "Hazte un mercader con nombre en estos mares y la gente hablará. Sube tu rango dos niveles o más.",
  "fr": "Deviens un marchand renommé sur ces mers et les langues se délieront. Monte ton rang de deux niveaux ou plus.",
  "de": "Werde ein Händler mit Namen auf diesen Meeren, dann reden die Leute. Steig zwei Ränge oder mehr auf."
 },
 "계급 2단계 이상 달성하기": {
  "en": "Reach rank 2 or higher",
  "ja": "ランク2以上に到達する",
  "es": "Alcanza el rango 2 o más",
  "fr": "Atteindre le rang 2 ou plus",
  "de": "Rang 2 oder höher erreichen"
 },
 "계급을 올려 보게. 장사로 이름을 알리는 게 가장 빠르지.": {
  "en": "Raise your rank. Making a name through trade is fastest.",
  "ja": "ランクを上げてみい。商売で名を上げるのが一番早い。",
  "es": "Sube tu rango. Hacerse un nombre comerciando es lo más rápido.",
  "fr": "Monte ton rang. Se faire un nom par le commerce, c’est le plus rapide.",
  "de": "Steig im Rang auf. Am schnellsten machst du dir durch Handel einen Namen."
 },
 "이제 이름이 제법 알려졌군.": {
  "en": "Now your name is fairly well known.",
  "ja": "これでなかなか名が知れたな。",
  "es": "Ahora tu nombre ya es bastante conocido.",
  "fr": "Ton nom commence à être bien connu.",
  "de": "Jetzt kennt man deinen Namen schon recht gut."
 },
 "새벽호를 마지막으로 본 사람들은 섬들에 흩어져 있네. 직접 걸어서 찾아보게.": {
  "en": "The people who last saw the Dawn are scattered across the islands. Go and look for them on foot.",
  "ja": "暁号を最後に見た者たちは島々に散らばっておる。自分の足で探してみい。",
  "es": "Quienes vieron el Alba por última vez están repartidos por las islas. Ve a buscarlos a pie.",
  "fr": "Ceux qui ont vu l’Aurore pour la dernière fois sont dispersés dans les îles. Va les chercher à pied.",
  "de": "Die Leute, die die Morgenröte zuletzt sahen, sind über die Inseln verstreut. Such sie zu Fuß."
 },
 "섬에서 들은 이야기": {
  "en": "Tales from the islands",
  "ja": "島で聞いた話",
  "es": "Historias de las islas",
  "fr": "Récits des îles",
  "de": "Geschichten von den Inseln"
 },
 "새벽호 얘기라면 저도 들었어요. 선원 중 한 명이 먼 섬에 정착했다던가…": {
  "en": "I've heard about the Dawn too. One of the sailors supposedly settled on a faraway island…",
  "ja": "暁号の話なら私も聞きました。船員のひとりが遠い島に住みついたとか…",
  "es": "Yo también he oído hablar del Alba. Dicen que uno de los marineros se instaló en una isla lejana…",
  "fr": "J’ai entendu parler de l’Aurore moi aussi. L’un des marins se serait installé sur une île lointaine…",
  "de": "Von der Morgenröte habe ich auch gehört. Einer der Matrosen soll sich auf einer fernen Insel niedergelassen haben…"
 },
 "섬을 직접 걸어 다니며 주민들에게 물어보세요. 세 곳에 상륙하면 실마리가 나올 거예요.": {
  "en": "Walk the islands yourself and ask the residents. Land on three and you'll find a clue.",
  "ja": "島を自分で歩き回って住民に聞いてみてください。3か所に上陸すれば手がかりが見つかるはずです。",

 "지도를 모아 숨은 섬을 하나 찾아보렴. 지도 석 장이면 새 섬이 나타난다더구나.": {

  "en": "A hidden island appears once you have three map pieces. Island residents give you maps when you help them.",

  "fr": "Une île cachée apparaît quand tu as trois fragments de carte. Les habitants des îles t’en donnent si tu les aides.",

 },
 "숨은 섬이라니, 네 할아버지가 즐겨 가던 곳이구나.": {

 },
 "오르간에게도 알려 주렴. 그 영감이 제일 기뻐할 거다.": {

 "조각을 맞춰 보니 마지막 글귀가 드러났네. \"진짜 보물은 돌아올 곳이 있다는 것.\"": {
  "en": "Putting the pieces together reveals the last words: \"The real treasure is having a place to come home to.\"",

const sellDrop=()=>PROJ.done[1]?0.982:SELLDROP;
const sellMult=p=>gdBonus()+1+repLv(S.rep[p])*0.015+crewV('trade')+codexTier(S)*0.004+(hasT('haggle')?.05:0)+(hasT('bigdeal')?.05:0)+(hasT('monopoly')?.05:0)+(PROJ.done[2]?.05:0)+(muSet('spec')?.02:0)+(S.story&&S.story.end===2?.03:0);

function buyCost(p,gi,n){let r=0,m=quote(p,gi)*1.2;for(let i=0;i<n;i++){r+=m;m*=BUYRISE;}return r;}

function genPaper(){const t=NOW(),k=S.stk,old=S.paper;let prev=null;if(old&&old.fc)prev=old.fc.map(f=>({id:f.id,d:f.d,hit:(k.p[f.id]>f.p0)===(f.d>0)}));
  const ids=STK.map(x=>x.id).sort(()=>Math.random()-.5).slice(0,3);k.drift={};
  const fc=ids.map(id=>{const d=Math.random()<.5?1:-1,ok=Math.random()<.75;k.drift[id]={d:ok?d:-d,until:t+PAPERMS};return {id,d,p0:k.p[id]};});
  const xs=[];while(xs.length<3){const i=Math.floor(Math.random()*NEWSX.length);if(!xs.includes(i))xs.push(i);}
  S.paper={t,no:(old?old.no:0)+1,fc,prev,x:xs,j:Math.floor(Math.random()*JOKES.length),seen:0};}

function stkValue(){if(!S||!S.stk)return 0;let v=0;for(const k in S.stk.hold)v+=S.stk.hold[k].n*S.stk.p[k];return v;}
function stkBuy(id,n){const k=S.stk,p=k.p[id];if(n==='max')n=Math.floor(S.money/p);n=Math.floor(n);if(n<=0||S.money<p*n)return;S.money-=p*n;const h=k.hold[id]||(k.hold[id]={n:0,avg:0});h.avg=(h.avg*h.n+p*n)/(h.n+n);h.n+=n;sfx('coin');}
function stkSell(id,n){const k=S.stk,h=k.hold[id];if(!h)return;if(n==='all')n=h.n;n=Math.min(Math.floor(n),h.n);if(n<=0)return;const g=k.p[id]*n*0.99;S.money+=g;S.stats.earned+=Math.max(0,g-h.avg*n);S.stats.stkGain=(S.stats.stkGain||0)+Math.max(0,g-h.avg*n);h.n-=n;if(h.n<=0)delete k.hold[id];sfx('coin');}
function depPut(a){a=a==='all'?S.money:Math.min(a,S.money);a=Math.floor(a);if(a<=0)return;S.money-=a;S.dep+=a;sfx('coin');}
function depGet(a){a=a==='all'?S.dep:Math.min(a,S.dep);if(a<=0)return;S.dep-=a;S.money+=a;if(S.dep<0.5){S.money+=S.dep;S.dep=0;}sfx('coin');}
function borrow(a){a=Math.min(a,loanMax()-S.loan);if(a<=0)return;S.loan+=a;S.money+=a;S.stats.loans++;sfx('coin');}
function repay(a){a=Math.min(a,S.loan,S.money);if(a<=0)return;S.loan-=a;S.money-=a;if(S.loan<0.5){S.loan=0;S.stats.repaid++;}sfx('coin');}

function tick(dt){if(!S)return;const t=NOW();rescue(dt);
  if(S.wk>0){S.wkAcc=(S.wkAcc||0)+dt;const iv=wkIv()/S.wk;let n=0;while(S.wkAcc>=iv&&n<6){S.wkAcc-=iv;n++;if(!wkAct()){S.wkAcc=Math.min(S.wkAcc,iv);break;}}}

    else{const can=r=>canBld(p,r);let ri=p.r;if(ri<0||ri>=B.rec.length||!can(B.rec[ri])){if(p.r<0){ri=B.rec.findIndex(can);}else ri=-1;}
      if(ri>=0&&(AC?inv(B.rec[ri][1])<capOf():outN(p)<OUTMAX)){const rec=B.rec[ri];rec[0].forEach(([g,n])=>{if(AF)S.inv[g]=inv(g)-n;else p.in[g]-=n;});p.cur=ri;p.end=t+rec[3]*1000/bldSpd(p);}}});
  S.ships.forEach(s=>{if(s.st!=='sail')return;if(s.pirAt&&t>=s.pirAt&&!s.back&&cargoN(s.cargo)>0)pirates(s);if(t>=s.t1){if(!s.back)arrive(s);else dock(s);}});
  // 반복 항해
  S.ships.forEach(s=>{if(s.st==='dock'&&s.rep&&s.last&&t>(s.repT||0)){s.repT=t+4000;const cg={};let room=shipCap(s);for(const k in s.last.cargo){const q=Math.min(s.last.cargo[k],inv(k),room);if(q>0){cg[k]=q;room-=q;}}const by={};for(const k in s.last.buy)by[k]=s.last.buy[k];if(cargoN(cg)+cargoN(by)>0)dispatch(s.id,s.last.p,cg,by);}});
  // 계약, 방문 상인
  if(t>S.ctNext){S.ctNext=t+(70+Math.random()*50)*1000;if(S.contracts.length<4+rankOf(S.stats.earned))genContract();}
  S.contracts=S.contracts.filter(c=>c.exp>t);
  if(S.visitor&&S.visitor.until<t)S.visitor=null;

  if(S.loan>0)S.loan+=S.loan*0.01/60*dt;
  ensureBank(S);provTick(dt);postTick(dt);shopTick(dt);innTick(dt);reTick(dt);gdTick(dt);hillTick(t);chalTick(t);dnTick(t);muTick(t);if(!S.paper||t>=S.paper.t+PAPERMS){const first=!S.paper;genPaper();if(!first)toast(T('새 시세 신문이 나왔어요','A new price paper is out'));}
  if(S.ins.auto&&S.ins.until<t&&S.money>=insCost()*3&&S.ships.length)insBuy();
  if(S.dep>0)S.dep+=Math.min(S.dep,depCap())*DEPR/60*dt;
  {const k=S.stk;if(t-k.t>200*STKMS)k.t=t-200*STKMS;while(t>=k.t+STKMS){stkStep();k.t+=STKMS;}}
  // 계급
  const rk=rankOf(S.stats.earned);if(rk>S.rank){S.rank=rk;rankUp(rk);}
  // 퀘스트
  if(S.tut>=0&&S.tut<TUT.length&&TUT[S.tut][1](S)){S.tut++;if(S.tut>=TUT.length){S.tut=-1;toast(T('안내가 끝났어요! 위의 ★ 과제를 따라가 보세요','Guide done! Follow the ★ quests at the top','' ));}else sfx('ach');}

async function openTransport(code,host){
  if(LOCAL){const bc=new BroadcastChannel('islandtrade-'+code);bc.onmessage=e=>onMsg(e.data);return {send:m=>bc.postMessage(m),close:()=>bc.close()};}
  await loadPeer();
  return new Promise((res,rej)=>{
    if(host){const peer=new Peer('islandtrade-'+code),conns=[];
      peer.on('open',()=>res({send:m=>conns.forEach(c=>{try{c.send(m);}catch(e){}}),close:()=>{try{peer.destroy();}catch(e){}}}));
      peer.on('error',e=>rej(e));
      peer.on('connection',c=>{conns.push(c);c.on('data',d=>{onMsg(d);if(d&&(d.bc||(d.to&&d.to!==MP.me)))conns.forEach(o=>{if(o!==c)try{o.send(d);}catch(e){}});});c.on('close',()=>{const i=conns.indexOf(c);if(i>=0)conns.splice(i,1);});});}
    else{const peer=new Peer();let done=false;peer.on('error',e=>{if(!done)rej(e);});
      peer.on('open',()=>{const c=peer.connect('islandtrade-'+code,{reliable:true});setTimeout(()=>{if(!done)rej(new Error('timeout'));},9000);
        c.on('open',()=>{done=true;res({send:m=>{try{c.send(m);}catch(e){}},close:()=>{try{peer.destroy();}catch(e){}}});});
        c.on('data',d=>onMsg(d));c.on('close',()=>{if(MP.on)mpLeave(T('방장과 연결이 끊겼어요','Lost connection to the host'));});});}
  });}

function techLayout(){if(TMAP.L)return TMAP.L;const kids={};TECHS.forEach(t=>{(kids[t.req||'']=kids[t.req||'']||[]).push(t.id);});
  const wt=id=>{const k=kids[id]||[];return k.length?k.reduce((a,c)=>a+wt(c),0):1;};
  const roots=kids[''],tot=roots.reduce((a,c)=>a+wt(c),0),R0=210,DR=150,pos={};let maxR=0;
  const place=(id,a0,a1,dp)=>{const a=(a0+a1)/2,r=R0+dp*DR;pos[id]={x:Math.cos(a)*r,y:Math.sin(a)*r};maxR=Math.max(maxR,r);const k=kids[id]||[],w=k.reduce((s,c)=>s+wt(c),0);let cur=a0;k.forEach(c=>{const span=(a1-a0)*wt(c)/w;place(c,cur,cur+span,dp+1);cur+=span;});};
  let cur=-Math.PI/2;roots.forEach(r=>{const span=Math.PI*2*wt(r)/tot;place(r,cur,cur+span,0);cur+=span;});
  const half=maxR+90;return TMAP.L={pos,half};}

MODS.fishing=m=>{const note=weather()==='rain'?T('비가 와서 진주가 잘 걸려요','Rain: pearls bite more'):'';
  let b='';
  if(m.st==='idle')b=`<button class="pb gold" data-act="fcast">${T('낚싯줄 던지기','Cast line')}</button>`;
  else if(m.st==='wait')b=`<div class="muted" style="font-size:16px;margin:14px 0">${T('찌를 보고 있어요…','Watching the float…')}</div>`;
  else if(m.st==='bite')b=`<div style="font-size:16px;margin:6px 0"><b>${T('입질이 왔어요! 가운데에서 눌러요','A bite! Press in the middle')}</b></div><div style="position:relative;height:26px;background:#2a1a0c;border:1px solid #6a4a22;border-radius:4px;margin:8px 0"><div style="position:absolute;left:30%;width:40%;top:0;bottom:0;background:#4a7a3a"></div><div style="position:absolute;left:43%;width:14%;top:0;bottom:0;background:#e0c050"></div><div id="fmark" style="position:absolute;left:0;top:-2px;width:4px;height:30px;background:#fff"></div></div><button class="pb gold" data-act="freel">${T('낚아채기!','Reel in!')}</button>`;
  else b=`<div class="card"><div class="grow">${m.res||''}</div></div><button class="pb gold" data-act="fcast">${T('다시 던지기','Cast again')}</button>`;
  return `<h2>${T('낚시','Fishing')}</h2><div class="muted">${T('{0}, {1}','{0}, {1}',T(FSEA[season()],['Spring','Summer','Autumn','Winter'][season()]),weather()==='rain'?T('비','Rain'):weather()==='snow'?T('눈','Snow'):T('맑음','Clear'))} ${note}</div><div class="muted">${T('여름엔 산호, 봄엔 해초, 비 오는 날엔 진주가 더 잘 걸려요. 노란 칸에서 누르면 두 배예요','Coral in summer, seaweed in spring, pearls in rain. Hit the yellow zone for double')}</div><div style="text-align:center;margin:10px 0">${b}</div>`;};
ACT.fcast=()=>{const m=MOD;m.st='wait';renderModal();const id=m.id=(m.id||0)+1;setTimeout(()=>{if(MOD!==m||m.st!=='wait'||m.id!==id)return;m.st='bite';m.b0=performance.now();renderModal();requestAnimationFrame(fishAnim);setTimeout(()=>{if(MOD===m&&m.st==='bite'&&m.id===id){m.st='res';m.res=T('놓쳤어요. 너무 늦었어요','Too late, it got away');renderModal();}},4400);},1500+Math.random()*2500);};
ACT.freel=()=>{const m=MOD;if(m.st!=='bite')return;const d=Math.abs(fishPos(m)-50);m.id++;if(d<20){const c=fishCatch(d<7?'perfect':'good');m.res=(d<7?T('완벽해요! ','Perfect! '):'')+c.txt;sfx('harvest');}else{m.res=T('타이밍이 빗나갔어요','Missed the timing');}m.st='res';updateHud();renderModal();};

function trainFade(on){let el=$('trainfade');if(on){if(!el){el=document.createElement('div');el.id='trainfade';el.style.cssText='position:fixed;inset:0;z-index:98;background:#000;opacity:0;transition:opacity .6s;pointer-events:none';document.body.appendChild(el);el.getBoundingClientRect();}el.style.opacity='1';}else if(el){el.style.opacity='0';setTimeout(()=>{const e=$('trainfade');if(e&&e.style.opacity==='0')e.remove();},700);}}
function trainRide(i){Object.assign(RIDE,{on:true,ph:'wait',t:0,x:186,i,D:2.2+i*.4});PL.goal=null;PL.x=262;PL.y=664;closePop();sfx('click');toast(T('{0}행 기차가 곧 출발해요','The train to {0} departs soon',tx(PROVS[i].n)));}
function rideTick(dt){RIDE.t+=dt;const ph=RIDE.ph;
  if(ph==='wait'){if(RIDE.t>.9){RIDE.ph='go';RIDE.t=0;sfx('click');}}
  else if(ph==='go'){const p=Math.min(1,RIDE.t/RIDE.D);RIDE.x=186-356*p*p;PL.x=RIDE.x+78;PL.y=664;if(p>=1){RIDE.ph='dark';RIDE.t=0;trainFade(true);}}
  else if(ph==='dark'){if(RIDE.t>.9){RIDE.on=false;enterIsl('prov'+RIDE.i,1);trainFade(false);}}
  else if(ph==='in'){const p=Math.min(1,RIDE.t/2.2),e=1-(1-p)*(1-p);RIDE.x=-170+356*e;PL.x=RIDE.x+78;PL.y=664;if(p>=1){RIDE.on=false;PL.x=262;PL.y=660;PL.goal=null;PL.dir=1;updateCam(0,true);sfx('coin');toast(T('기차역에 도착했어요','Arrived at the station'));}}}

  GOODS.forEach(g0=>{const seen=S.codex[g0.id];if(!seen){h+=`<div class="card" style="opacity:.55"><div class="gi" style="background:#120a04"></div><div class="grow">???</div></div>`;return;}
    const bp=bestPort(g0.i),made=[];BK.forEach(b=>{(BLD[b].rec||[]).forEach(r=>{if(r[1]===g0.id)made.push(tx(BLD[b].n));});});const uses=[];BK.forEach(b=>{(BLD[b].rec||[]).forEach(r=>{if(r[0].some(x=>x[0]===g0.id))uses.push(GN(r[1]));});});
    h+=`<div class="card">${gi(g0.id,28)}<div class="grow"><b>${GN(g0.id)}</b> <span class="muted">${T('기본값 {0}','Base {0}',g0.base)}</span><div class="muted">${g0.k==='crop'?T('밭에서 키워요','Grown in fields'):g0.k==='animal'?T('목장에서 얻어요','From the ranch'):g0.k==='import'?T('먼 항구에서 사 와요','Imported from ports'):T('{0}에서 만들어요','Made in {0}',made.join(', ')||'-')}${uses.length?'<br>'+T('쓰임: {0}','Used for: {0}',[...new Set(uses)].join(', ')):''}<br>${T('가장 비싼 곳: {0} {1}','Best: {0} {1}',tx(PORTS[bp[0]].n),Math.round(bp[1]))}</div></div></div>`;});return h;};

  if(ST.tab==='rec'){const rows=[[T('누적 수입','Total earned'),fmt(st.earned)],[T('재산','Net worth'),fmt(netWorth())],[T('한 번에 가장 많이 번 돈','Best single sale'),fmt(st.best)],[T('수확한 작물','Harvested'),fmt(st.harvest)],[T('가공품 만든 수','Goods crafted'),fmt(Object.values(S.made).reduce((a,b)=>a+b,0))],[T('출항 횟수','Voyages'),st.sailed],[T('항구에서 산 물건','Goods bought'),fmt(st.bought)],[T('채운 계약','Contracts done'),st.contracts],[T('해적을 만난 횟수','Pirate encounters'),st.pirated],[T('연구','Researches'),Object.keys(S.techs).length+'/'+TECHS.length],[T('업적','Goals'),Object.keys(S.ach).length+'/'+ACH.length],[T('계급','Rank'),tx(RANKS[rankOf(st.earned)][1])],[T('플레이 시간','Play time'),Math.floor(mins)+' min']];
    h+=`<table class="t">${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;}

function drawChart(){const c=$('chart');if(!c||!S)return;const k=c.getContext('2d'),W=c.width,H=c.height,gi0=GI[ST.g].i;k.clearRect(0,0,W,H);let mn=1e9,mx=0;
  PORTS.forEach((p,i)=>{HIST[i][gi0].forEach(v=>{mn=Math.min(mn,v);mx=Math.max(mx,v);});});if(mx<=mn){mn=GI[ST.g].base*.5;mx=GI[ST.g].base*1.6;}mn*=.95;mx*=1.05;
  k.strokeStyle='#3a2412';k.lineWidth=1;for(let i=0;i<=4;i++){const y=10+(H-24)*i/4;k.beginPath();k.moveTo(36,y);k.lineTo(W-6,y);k.stroke();k.fillStyle='#d3bf94';k.font='11px sans-serif';k.fillText(Math.round(mx-(mx-mn)*i/4),2,y+4);}
  const rk=rankOf(S.stats.earned);let leg='';PORTS.forEach((p,i)=>{if(rk<p.rank)return;const h=HIST[i][gi0],col=PCOLS[i%8];leg+=`<span class="pcol" style="background:${col}"></span>${esc(tx(p.n))} &nbsp;`;if(h.length<2)return;k.strokeStyle=col;k.lineWidth=2;k.beginPath();h.forEach((v,j)=>{const x=36+(W-42)*j/47,y=10+(H-24)*(1-(v-mn)/(mx-mn));j?k.lineTo(x,y):k.moveTo(x,y);});k.stroke();});
  const l=$('chartLeg');if(l)l.innerHTML=leg+'<br>'+T('5초마다 기록해요','Sampled every 5 seconds');}

MODS.help=()=>`<h2>${T('하는 법','How to play')}</h2><div class="note"><ul>
 <li>${T('<b>밭</b>: 빈 밭을 눌러 작물을 심고, 다 자라면 눌러서 수확해요. 계절마다 자라는 속도가 달라요. 과일나무는 한 번 심으면 계속 열려요.','<b>Fields</b>: tap an empty field to sow; tap it again when ripe. Growth speed changes with the seasons. Fruit trees keep bearing.')}</li>
 <li>${T('<b>목장</b>: 닭장, 양 우리, 소 외양간에는 먹이를 주고, 낚시터는 먹이가 필요 없어요. 단계를 올리면 더 빨리, 더 많이 나와요.','<b>Ranch</b>: coops, sheepfolds and barns eat feed; fishing huts need none. Upgrades make them faster and richer.')}</li>
 <li>${T('<b>마을</b>: 건물을 누르고 만들 것을 고르면 창고의 재료를 넣어 가공해요. 완성품은 직접 꺼내 창고로 옮겨요. 연구로 이 일을 자동화할 수 있어요. 가판대는 물건을 조금씩 팔고, 방문 상인은 값을 더 쳐줘요.','<b>Town</b>: tap a building and pick a recipe to load ingredients from the warehouse. Take the goods out and carry them to the warehouse yourself; research can automate this. Stalls sell slowly; visiting traders pay extra.')}</li>
 <li>${T('<b>바다</b>: 출항에서 배에 짐을 싣고 항구로 보내요. 항구마다 값이 달라요. 같은 물건을 많이 팔면 값이 내려가고 시간이 지나면 돌아와요. 향신료, 비단 같은 수입품은 항구에서 사 와요.','<b>Sea</b>: load a ship and send it to a port. Prices differ per port; selling a lot lowers the price, which recovers over time. Buy imports like spice and silk at ports.')}</li>
 <li>${T('항구 <b>계약</b>을 채우면 보상과 평판을 얻어요. 평판이 높으면 팔 때 더 받아요.','Fill port <b>contracts</b> for rewards and reputation; higher reputation pays more.')}</li>
 <li>${T('<b>연구</b>, <b>은행</b>, <b>공공 공사</b>로 더 키울 수 있어요. 해적이 나올 수 있으니 배에 호위를 달아 보세요.','Use <b>research</b>, the <b>bank</b> and <b>shared projects</b> to grow. Pirates may attack; add escorts.')}</li>
 <li>${T('<b>다른 섬과 연결</b>: 집이나 게시판에서 방을 만들거나 코드로 들어가요. 연결하면 다른 사람의 섬을 구경하러 갈 수 있고, 섬에서 만난 사람과 <b>실시간 거래</b>를 해요. 서로 올린 물건과 금화를 보면서 둘 다 준비를 누르면 바로 바뀌어요. 연결하지 않아도 혼자 계속 할 수 있어요. 경매, 채팅, 함께 짓는 공사, 바다의 해적 습격도 있어요.','<b>Connect to others</b>: create a room or join by code at home or the notice board. Once connected you can visit other players’ islands and start a <b>live trade</b> with anyone you meet there: both see the offers, and the swap happens when both press Ready. You can always keep playing alone. Auctions, chat, shared projects and pirate raids are there too.')}</li>
 <li>${T('<b>처음은 불편해요</b>: 창고는 칸마다 30개, 밭은 6칸, 일은 직접 해요. 연구, 일꾼, 창고 늘리기, 컨베이어, 온실, 스프링클러를 갖추면 점점 알아서 돌아가요.','<b>It starts slow</b>: 30 per warehouse slot, 6 fields, and you do the chores. Research, workers, bigger warehouses, conveyors, greenhouses and sprinklers make everything run by itself later.')}</li>
 <li>${T('<b>직접 항해</b>: 항구에서 "직접 항해"를 고르면 배를 직접 몰아요. 방향키·WASD·화면 터치로 움직이고, 섬 가까이에서 E(폰은 행동 버튼)로 상륙해요. 섬마다 시작섬에 없는 씨앗과 가공 건물을 금화로 해금할 수 있어요. 우리 항구에서 E로 돌아와요.','<b>Sail yourself</b>: pick "Sail it yourself" at the harbor to steer a ship. Move with arrows/WASD or tapping, and press E (the Act button on phones) near an island to land. Each island sells unlocks for seeds and workshops your home island lacks. Press E at your harbor to return.')}</li>\n <li>${T('<b>종자 상점</b>: 씨앗은 처음에 조금만 있어요. 마을 입구의 종자 상점에서 작물별 씨앗을 사 두었다가 밭에 심어요.','<b>Seed shop</b>: you start with only a few seeds. Buy seeds per crop at the seed shop by the town gate and sow them in your fields.')}</li>\n <li>${T('<b>장터</b>: 마을 입구 장터에서 창고의 물건을 바로 팔 수 있어요. 값은 기본가의 65%라서, 모이면 배에 실어 항구로 보내는 게 더 이득이에요. 돈이 바닥나서 아무것도 못 할 때는 이웃이 품삯을 조금 줘요.','<b>Market</b>: sell goods straight from the warehouse at the market by the town gate for 65% of base price; shipping to a port pays more. If you run dry with nothing left, a neighbor pays a small wage.')}</li>\n <li>${T('<b>일꾼</b>: 연구 "일꾼 고용"(큰 바구니 다음)을 끝내면 집을 눌러 "일꾼 고용"에서 금화로 고용해요. 일꾼은 다 자란 작물과 산물을 알아서 모아요.','<b>Workers</b>: finish the Hire workers research (after Big basket), then press your house and choose Hire workers. Workers collect ripe crops and goods on their own.')}</li>
 <li>${T('<b>이동</b>: 방향키나 WASD로 캐릭터를 걸어 다니게 해요. 가까이 가면 테두리가 켜지고, E나 스페이스(폰은 행동 버튼)로 써요. 다 자란 작물과 동물 산물은 위를 걸으면 저절로 모아요. 화면을 눌러도 그쪽으로 걸어가요.','<b>Moving</b>: walk your character with the arrow keys or WASD. A nearby object gets an outline; press E or Space (the Act button on phones) to use it. Walk over ripe crops and animal goods to collect them. Tapping the screen also walks there.')}</li>
 <li>${T('끝이 없는 게임이에요. 천천히 섬을 키워 보세요. 키보드 1~4로 화면을 바꿀 수 있어요.','There is no ending. Grow your isle at your own pace. Keys 1-4 switch scenes.')}</li></ul></div>`;
MODS.crew=()=>{const full=S.wk>=WKMAX,c=full?0:wkCost();return `<h2>${T('일꾼 고용','Hire workers')} ${S.wk}/${WKMAX}</h2><div class="muted">${T('일꾼은 다 자란 작물과 동물 산물을 알아서 모아요. 많을수록 빨라져요.','Workers collect ripe crops and animal goods by themselves. More workers, faster work.')}</div><div class="muted" style="margin:6px 0">${hasT('overseer')?T('감독관 덕분에 수확한 밭에 다시 심어요','Thanks to the overseer they replant fields'):T('연구 감독관을 끝내면 다시 심어요','Research Overseer so they replant')}</div>${full?'':`<button class="pb gold" data-act="hire" ${S.money<c?'disabled':''}>${T('고용하기','Hire')} ${fmt(c)} ${UG()}</button>`}`;};

MODS.mp=()=>{if(!MP.on)return `<h2>${T('다른 섬과 연결','Connect to other islands')}</h2><div class="muted">${T('연결하지 않아도 내 섬에서 계속 즐길 수 있어요. 연결하면 친구의 섬을 구경하고, 실시간으로 거래하고, 경매하고, 함께 공사도 해요. 시장도 같이 움직여요.','You can keep playing alone. Connect to visit friends’ islands, trade live, hold auctions and build together. The market is shared.')}</div>

ACT.seedbuy=a=>{const [g,n]=a.split(':');buySeed(g,+n);renderModal();updateHud();};
function procHint(g){let best=null;const recs=[];BK.forEach(b=>{const B=BLD[b];if(B.rec)B.rec.forEach(rc=>recs.push([b,rc]));});
  const cst=rc=>rc[0].reduce((a,[q,n])=>a+GI[q].base*n,0);
  recs.forEach(([b,rc])=>{if(!rc[0].some(([q])=>q===g))return;const x=GI[rc[1]].base*rc[2]/cst(rc);if(!best||x>best.x)best={out:rc[1],x,chain:[g,rc[1]]};
    recs.forEach(([b2,rc2])=>{if(!rc2[0].some(([q])=>q===rc[1]))return;const unit=cst(rc)/rc[2],c2=rc2[0].reduce((a,[q,n])=>a+(q===rc[1]?unit:GI[q].base)*n,0),x2=GI[rc2[1]].base*rc2[2]/c2;if(x2>best.x)best={out:rc2[1],x:x2,chain:[g,rc[1],rc2[1]]};});});

  (function f(now){const el=now-t0;k.clearRect(0,0,c.width,c.height);let alive=0;ps.forEach(p=>{const t=(el-p.dl)/1000;if(t<0){alive++;return;}if(t>1.6)return;alive++;k.globalAlpha=Math.max(0,1-t/1.6);k.fillStyle=p.col;k.fillRect(p.x+p.vx*t,p.y+p.vy*t+120*t*t,3,3);});k.globalAlpha=1;if(alive)requestAnimationFrame(f);else k.clearRect(0,0,c.width,c.height);})(t0);}
