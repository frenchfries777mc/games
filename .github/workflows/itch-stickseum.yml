name: itch-stickseum

# Stickseum이 main에 올라가면 itch 판을 만들어 itch.io에 자동으로 올려요.
# 필요: 저장소 Secret ITCH_API_KEY (itch 계정 API 키), 저장소 Variable ITCH_STICKSEUM_TARGET (예: 계정이름/게임이름:html5)
# 둘 중 하나라도 없으면 아무것도 올리지 않고 끝나요.
on:
  push:
    branches: [main]
    paths:
      - 'stickseum/**'
      - 'tools/itch/build_stickseum_itch.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
      TARGET: ${{ vars.ITCH_STICKSEUM_TARGET }}
    steps:
      - uses: actions/checkout@v4
      - name: Build itch edition
        if: env.BUTLER_API_KEY != '' && env.TARGET != ''
        run: python3 -I tools/itch/build_stickseum_itch.py stickseum build/stickseum-itch
      - name: Push to itch.io
        if: env.BUTLER_API_KEY != '' && env.TARGET != ''
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          VER=$(python3 -c "import json;d=json.load(open('stickseum/versions.json'));print(d['latest'])")
          ./butler/butler push build/stickseum-itch "$TARGET" --userversion "$VER"
