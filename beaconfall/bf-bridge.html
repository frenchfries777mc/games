<!DOCTYPE html><html><head><meta charset="utf-8"><title>BEACONFALL</title><meta name="robots" content="noindex"><style>html{background:#05061a}</style></head><body><script>
/* 옛 주소(github.io)에 남은 비콘폴 저장(월드·설치한 모드·설정)을 frenchfries777.com 으로 건네는 중간 페이지예요.
   브라우저 저장소는 주소마다 따로라서, 이 페이지가 자기 저장을 압축해 조각내고 frenchfries777.com 으로 한 조각씩 돌아가며 보내요. 보이는 건 없어요. */
(function(){
var OK='https://frenchfries777.com/',CH=250000;
function q(n){var m=new RegExp('[#&]'+n+'=([^&]*)').exec(location.hash);return m?decodeURIComponent(m[1]):'';}
var back=q('back'),i=+q('i')||0;
if(back.indexOf(OK)!==0)return;
function b64u(u8){var s='',k;for(k=0;k<u8.length;k+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(k,k+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function pack(){
 try{var c=sessionStorage.getItem('bfpack');if(c)return JSON.parse(c);}catch(e){}
 var d={},any=0;try{for(var j=0;j<localStorage.length;j++){var k=localStorage.key(j);
  if(/^(stranded\.|bf\.|bf_)/.test(k)&&!/^stranded\.cloud\./.test(k)&&k!=='bf_errlog'&&k!=='bf.import.v1'){d[k]=localStorage.getItem(k);any=1;}}}catch(e){}
 if(!any)return {z:0,p:[],none:1};
 var raw=new TextEncoder().encode(JSON.stringify(d)),z=0,u8=raw;
 try{if(window.CompressionStream){u8=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());z=1;}}catch(e){u8=raw;z=0;}
 var s=b64u(u8),p=[];for(var x=0;x<s.length;x+=CH)p.push(s.slice(x,x+CH));
 var P={z:z,p:p};try{sessionStorage.setItem('bfpack',JSON.stringify(P));}catch(e){}return P;
}
pack().then(function(P){
 if(P.none||!P.p.length||i>=P.p.length){location.replace(back+'#bfimp=none');return;}
 location.replace(back+'#bfimp='+P.z+'.'+i+'.'+P.p.length+'.'+P.p[i]);
}).catch(function(){location.replace(back+'#bfimp=none');});
})();
</script></body></html>
