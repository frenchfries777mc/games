<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BEACONFALL</title>
<style>
html,body{margin:0;height:100%;background:#05061a;color:#cfd6e4;font-family:system-ui,sans-serif}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#ld b{font:900 clamp(26px,5vw,44px)/1 system-ui,sans-serif;letter-spacing:.2em;color:#fff}
#ldb{width:min(720px,90vw);height:14px;background:#1c2438;border-radius:8px;overflow:hidden}
#ldi{display:block;height:100%;width:0;background:#3fe0c5;transition:width .15s}
#ldp{font:600 15px system-ui,sans-serif;color:#8a94a8}
</style>
</head>
<body>
<!-- 최신 게임 파일(versions.json 의 latestFile)을 받으면서 진행률을 보여 주는 시작 파일이에요. 다 받으면 그 자리에서 게임으로 바뀌어요. 게임을 고칠 때는 BEACONFALL-v0.X.html 을 고쳐요. -->
<div id="ld"><b>BEACONFALL</b><div id="ldb"><i id="ldi"></i></div><div id="ldp">불러오는 중 0%</div></div>
<script>
(function(){
var FALLBACK='BEACONFALL-v0.5.html', EST=1790465, bar=document.getElementById('ldi'), txt=document.getElementById('ldp');
var LG='ko';try{LG=localStorage.getItem('beaconfallSiteLang')||'';}catch(e){}
if(!LG)LG=((navigator.languages&&navigator.languages[0])||navigator.language||'ko').slice(0,2).toLowerCase();
if(LG==='au'||LG==='sg'||LG==='em')LG='en';
var PRE={ko:'불러오는 중 ',en:'Loading ',es:'Cargando ',fr:'Chargement ',de:'Laden ',ja:'読み込み中 ',zh:'加载中 ',pt:'Carregando ',ru:'Загрузка ',tr:'Yükleniyor ',it:'Caricamento ',pl:'Wczytywanie ',ar:'جارٍ التحميل '};
if(!PRE[LG])LG='ko';
txt.textContent=PRE[LG]+'0%';
function set(p){ p=Math.max(0,Math.min(100,p)); bar.style.width=p+'%'; txt.textContent=PRE[LG]+Math.round(p)+'%'; }
function plain(f){ location.replace((f||FALLBACK)+location.search+location.hash); }      // (진행률을 못 쓰는 브라우저·오류일 때는 게임 파일을 그대로 열어요)
if(!window.fetch||!window.ReadableStream||!window.Blob){ plain(); return; }
var est=EST; try{ est=+localStorage.getItem('bf_gsize')||EST; }catch(e){}      // (서버가 압축해서 보내면 파일 길이를 알 수 없어서, 지난번에 받은 크기를 기준으로 삼아요)
var SRC=FALLBACK;
fetch('versions.json').then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }).then(function(v){
  if(v&&v.latestFile&&/^[\w.-]+\.html$/.test(v.latestFile)) SRC=v.latestFile;
  return fetch(SRC);
}).then(function(r){
  if(!r.ok) throw new Error('http '+r.status);
  var rd=r.body.getReader(), parts=[], got=0;
  function pump(){ return rd.read().then(function(x){
    if(x.done) return;
    parts.push(x.value); got+=x.value.length; set(Math.min(99,got/est*100)); return pump();
  }); }
  return pump().then(function(){ try{ localStorage.setItem('bf_gsize',String(got)); }catch(e){} set(100); return new Blob(parts).text(); });
}).then(function(html){
  setTimeout(function(){ document.open(); document.write(html); document.close(); },120);
}).catch(function(){ plain(SRC); });
})();
</script>
</body>
</html>
