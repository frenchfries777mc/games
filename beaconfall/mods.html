<style>
.mn{margin-left:auto}.mn .ddl{left:auto;right:0}.mn>.pb{padding:2px 10px;font-size:16px;line-height:1.2}
.dd{position:relative}.ddl{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:20;min-width:100%;background:#0f1520;border:2px solid var(--gold);box-shadow:4px 4px 0 #000b;padding:4px}.dd.open .ddl{display:block}.ddl button{display:block;width:100%;text-align:left;white-space:nowrap;background:none;border:0;color:var(--cream);font:700 14px/1.2 inherit;padding:9px 12px;cursor:pointer}.ddl button:hover,.ddl button.on{background:#e9d9a433;color:var(--gold)}
.topnav{flex:1 1 0;min-width:240px;flex-wrap:wrap;gap:8px}.topnav .cur{background:var(--gold);color:#1a1408}
.hint{font-size:12px;color:var(--cream);opacity:.7;margin:4px 0 0}
html,body{touch-action:manipulation}   /* 더블터치 확대 막기 */
@font-face{font-family:Galmuri;src:url(Galmuri11.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Galmuri;src:url(Galmuri11-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--ink:#0b1626;--cream:#f4ecd0;--gold:#e9d9a4;--sky:#9ae0ff;--btn:rgba(14,18,30,.78);--panel:rgba(10,16,28,.86)}
*{box-sizing:border-box}
html{background:var(--ink)}
html,body{margin:0;color:var(--cream);font-family:Galmuri,'Noto Sans KR','Hiragino Sans','Malgun Gothic',monospace;font-size:15px;line-height:1.6}
body{background:linear-gradient(180deg,rgba(6,16,30,.55),rgba(6,16,30,.9)),url(shot-camp.png) center/cover fixed;min-height:100vh}
img{image-rendering:pixelated;image-rendering:crisp-edges}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.pb{display:inline-block;padding:8px 14px;border:3px solid var(--gold);border-radius:0;background:var(--btn);color:var(--cream);font:700 14px/1.2 inherit;text-decoration:none;cursor:pointer;box-shadow:4px 4px 0 #000b;text-align:center}
.pb:hover,.pb.on{background:var(--gold);color:#10141f}
.pb:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000b}
.row{display:flex;flex-wrap:wrap;gap:8px}
.top{padding:12px 0 6px}
.top .wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.top .pb{padding:6px 10px;font-size:13px;border-width:2px;box-shadow:3px 3px 0 #000b}
h1{margin:18px 0 4px;font-size:clamp(30px,7vw,52px);letter-spacing:.06em;line-height:1.1;text-shadow:4px 4px 0 #000}
.sub{margin:0 0 16px;color:var(--gold);font-size:13px;text-shadow:2px 2px 0 #000}
.tabs{margin:6px 0 14px}
.tabs .pb{border-color:var(--sky)}
.tabs .pb.on{background:var(--sky)}
input.q{width:100%;padding:10px 12px;border:3px solid var(--gold);background:var(--panel);color:var(--cream);font:15px inherit;box-shadow:4px 4px 0 #000b;outline:none;margin:0 0 12px}
.cats{margin:0 0 14px}
.cats .pb{padding:5px 9px;font-size:12px;border-width:2px;box-shadow:2px 2px 0 #000b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:2px solid #e9d9a466;background:var(--panel);cursor:pointer;font-size:12px;text-align:center;line-height:1.3;color:var(--cream)}
.card:hover{border-color:var(--gold)}
.card img{width:40px;height:40px}
.cnt{color:var(--gold);font-size:12px;margin:0 0 8px;text-shadow:2px 2px 0 #000}

.mrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:2px solid #e9d9a444;background:var(--panel);margin:0 0 8px}
.mrow .ic img.lg{width:40px;height:40px;image-rendering:pixelated}
.mrow .ic{flex:0 0 44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#e9d9a41a;border:2px solid #e9d9a444}
.mrow .tx{flex:1;min-width:0}
.mrow .nm{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .ds{font-size:12px;color:#d9cfb0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow{flex-wrap:wrap}
.mrow .inf{flex:1 0 100%;border-top:1px dashed #e9d9a433;padding-top:6px;font-size:12px;color:#d9cfb0;display:flex;flex-wrap:wrap;gap:4px 14px;word-break:break-word}
.mrow .inf .d{flex:1 0 100%;color:var(--cream)}
.mrow .inf b{color:var(--gold);font-weight:400}
.mrow .mt{font-size:11px;color:var(--gold);margin-top:2px}
.mrow .tg{display:inline-block;font-size:11px;padding:0 6px;border:1px solid var(--sky);color:var(--sky);margin-right:6px}
.mrow .tg.p{border-color:#ffb0d0;color:#ffb0d0}
.mrow .act{flex:0 0 auto;display:flex;gap:6px}
.mrow .pb{padding:8px 12px;font-size:13px}
.pb.off{background:#7a2b2b;border-color:#ffb0b0}
.pb.off:hover{background:#ffb0b0;color:#10141f}
.pb.warn{background:#7a2b2b;border-color:#ffb0b0}
#upl,#mdl{position:fixed;inset:0;z-index:20;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 12px}
#upl.on,#mdl.on{display:flex}
#intro{position:fixed;inset:0;z-index:30;background:#000;display:none;align-items:center;justify-content:center}
#intro.on{display:flex}
#intro video{width:100%;height:100%;object-fit:contain;background:#000}
#intro .pb{position:absolute;right:12px;top:12px;z-index:2}
#upl .box,#mdl .box{width:min(560px,100%);background:#141c2c;border:3px solid var(--gold);box-shadow:6px 6px 0 #000;padding:16px;position:relative}
#upl label,#mdl label{display:block;margin:10px 0 4px;color:var(--sky);font-size:13px}
#upl input,#upl textarea,#upl select,#mdl input,#mdl textarea{width:100%;padding:8px 10px;border:2px solid var(--gold);background:var(--panel);color:var(--cream);font:14px inherit;outline:none}
#upl textarea{min-height:150px;font-family:monospace;font-size:12px}
.msg{margin:8px 0 0;font-size:13px;color:var(--gold)}
.msg.err{color:#ffb0b0}
.empty{padding:22px;text-align:center;opacity:.8}
#uprev{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px}
#uprev span{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border:1px solid var(--sky)}
#uprev span.bad{border-color:#ffb0b0;color:#ffb0b0}
#uprev img,.inf img.tx{width:24px;height:24px;image-rendering:pixelated;background:#e9d9a41a}
.inf .pv{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:4px}
footer{padding:40px 0 30px;color:var(--gold);font-size:12px;text-shadow:2px 2px 0 #000}
@media(max-width:560px){.mrow{flex-wrap:wrap}.mrow .act{width:100%}.mrow .act .pb{flex:1}}
</style>

 <button class="pb x" id="ux" style="position:absolute;right:10px;top:10px;padding:4px 10px">✕</button>
 <h2 style="margin:0 40px 6px 0" id="uth">모드 · 리소스팩 올리기</h2>
 <label>폴더 (mode.bs가 있으면 모드, 없으면 리소스팩)</label>
 <input type="file" id="uf" webkitdirectory directory multiple>

 <label>로고 (PNG 그림, 고르지 않으면 폴더의 logo.png)</label><input type="file" id="ulg" accept="image/png"><div class="hint" id="ulgm"></div>

 <h2 style="margin:0 40px 6px 0" id="mt2"></h2><div id="mb"></div><div class="msg" id="mm"></div>
</div></div>
<script>
(function(){
var CATS={mod:['아이템','전투','편의','월드','기타'],pack:['이름','그림','소리','기타']};
var KEY='bf.mods.on';
var LIST=[],K='all',CAT='',SERVER='load',ME=null,SORT='apply',COUNTS={};
var KOPT=[['all','전체'],['mod','모드'],['pack','리소스팩'],['on','적용 중']],SOPT=[['apply','적용 많은 순'],['new','최신 순'],['name','이름 순']];
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function getOn(){try{var o=JSON.parse(localStorage.getItem(KEY)||'{}');return o&&typeof o==='object'?o:{};}catch(e){return {};}}
function setOn(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function sb(){return window.FFAuth&&FFAuth.client&&FFAuth.client();}
async function load(){
  SERVER='load';draw();
  try{
    if(window.FFAuth&&FFAuth.ready)await FFAuth.ready;
    var c=sb();if(!c){SERVER='off';draw();return;}
    try{var u=FFAuth.user();ME=u&&u.id||null;}catch(e){}
    var r=await c.from('beaconfall_mods').select('*').order('created_at',{ascending:false}).limit(500);
    if(r.error){SERVER='off';draw();return;}
    LIST=r.data||[];SERVER='ok';
  }catch(e){SERVER='off';}
  await loadCounts();
  draw();
}
async function loadCounts(){
  try{var c=sb();if(!c)return;var r=await c.from('beaconfall_mod_counts').select('mod_id,applies').limit(2000);if(r.error||!r.data)return;var o={};r.data.forEach(function(x){o[x.mod_id]=x.applies|0;});COUNTS=o;}catch(e){}
}
function countApply(id){
  try{var seen=JSON.parse(localStorage.getItem('bf.mods.seen')||'{}');if(seen[id])return;seen[id]=1;localStorage.setItem('bf.mods.seen',JSON.stringify(seen));}catch(e){}
  try{var c=sb(),u=window.FFAuth&&FFAuth.user&&FFAuth.user();if(!c||!u)return;c.rpc('beaconfall_mod_apply',{mid:id}).then(function(){loadCounts().then(draw);});}catch(e){}
}
function ddDraw(){
  function lab(o,v){for(var i=0;i<o.length;i++)if(o[i][0]===v)return o[i][1];return '';}
  $('ddkb').textContent='보기: '+lab(KOPT,K)+' ▾';$('ddsb').textContent='정렬: '+lab(SOPT,SORT)+' ▾';
  $('ddkl').innerHTML=KOPT.map(function(o){return '<button data-dk="'+o[0]+'"'+(o[0]===K?' class="on"':'')+'>'+o[1]+'</button>';}).join('');
  $('ddsl').innerHTML=SOPT.map(function(o){return '<button data-ds="'+o[0]+'"'+(o[0]===SORT?' class="on"':'')+'>'+o[1]+'</button>';}).join('');
}
function cats(){
  var set=K==='mod'?CATS.mod:K==='pack'?CATS.pack:CATS.mod.concat(CATS.pack.filter(function(x){return CATS.mod.indexOf(x)<0;}));
  var h='<button class="pb'+(CAT===''?' on':'')+'" data-c="">전체</button>';
  set.forEach(function(c){h+='<button class="pb'+(CAT===c?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>';});
  $('cats').innerHTML=h;
}
var POTATO_UUID='6f1c2b7e-3d4a-4e59-9a1b-7c0d5e8f2a43';
function menuOf(m,mine){
  if(m.id==='builtin-potato-api')return '<div class="dd mn"><button class="pb" data-mn="1" title="더 보기">⋯</button><div class="ddl"><button data-ma="uuid" data-id="'+esc(m.id)+'">uuid 복사</button>'+'</div></div>';
  var it=(mine&&m.id!==POTATO.id)?[['ver','버전 추가하기'],['del','모드 내리기'],['edit','모드 수정하기']]:[['report','모드 신고하기']];
  if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(m.id))it=[['uuid','uuid 복사']].concat(it);
  return '<div class="dd mn"><button class="pb" data-mn="1" title="더 보기">⋯</button><div class="ddl">'+it.map(function(o){return '<button data-ma="'+o[0]+'" data-id="'+esc(m.id)+'">'+o[1]+'</button>';}).join('')+'</div></div>';
}
var EDIT=null;
function mopen(t,h){$('mt2').textContent=t;$('mb').innerHTML=h;mmsg('');$('mdl').classList.add('on');}
function mmsg(s,err){var m=$('mm');m.textContent=s||'';m.className='msg'+(err?' err':'');}
$('mx').addEventListener('click',function(){$('mdl').classList.remove('on');});
function replaceMod(r){
  LIST=LIST.map(function(x){return x.id===r.id?r:x;});
  var o=getOn();if(o[r.id]){o[r.id]={kind:r.kind,name:r.name,descr:r.descr||'',cat:r.cat||'',author_name:r.author_name||'',data:r.data};setOn(o);}
}
function menuAct(a,id){
  var m=id===POTATO.id?POTATO:LIST.filter(function(x){return x.id===id;})[0];if(!m)return;
  var c=sb(),u=window.FFAuth&&FFAuth.user&&FFAuth.user();
  if(a==='uuid'){
    var uid=m.id===POTATO.id?POTATO_UUID:m.id;
    mopen('모드 uuid','<p>'+esc(m.name)+'</p><input id="muu" readonly value="'+esc(uid)+'" style="width:100%"><p style="font-size:13px">다른 모드에서  use_mod_uuid: '+esc(uid)+'  로 쓰면 이 모드의 공유 변수를 {:이름_모드이름:} 으로 읽어요.</p>');
    var ue=$('muu');ue.focus();ue.select();
    try{if(navigator.clipboard)navigator.clipboard.writeText(uid).then(function(){mmsg('uuid를 복사했어요.');},function(){});}catch(e){}
    return;
  }
  if(a==='report'){
    mopen('모드 신고하기','<p>'+esc(m.name)+'</p><label>이유 (최대 100자)</label><input id="mrs" maxlength="100"><div class="row" style="margin-top:12px"><button class="pb" id="mgo">신고하기</button></div>');
    $('mgo').onclick=async function(){
      if(!u||!c){mmsg('로그인이 필요해요.',1);return;}
      this.disabled=true;var r=await c.from('beaconfall_mod_reports').insert({mod_id:m.id,reason:$('mrs').value.trim().slice(0,100)});this.disabled=false;
      if(r.error){mmsg(r.error.code==='23505'?'이미 신고했어요.':'신고하지 못했어요. 서버가 아직 준비되지 않았을 수 있어요.',1);return;}
      mmsg('신고가 접수됐어요.');this.style.display='none';
    };
  }else if(a==='edit'){
    mopen('모드 수정하기','<label>이름 (최대 40자)</label><input id="men" maxlength="40"><label>설명 (최대 120자)</label><input id="mde" maxlength="120"><div class="row" style="margin-top:12px"><button class="pb" id="mgo">저장</button></div>');
    $('men').value=m.name;$('mde').value=m.descr||'';
    $('mgo').onclick=async function(){
      var n=$('men').value.trim(),d=$('mde').value.trim();if(!n){mmsg('이름을 적어 주세요.',1);return;}
      this.disabled=true;var r=await c.from('beaconfall_mods').update({name:n,descr:d}).eq('id',m.id).select().single();this.disabled=false;
      if(r.error||!r.data){mmsg('저장하지 못했어요.',1);return;}
      replaceMod(Object.assign({},m,r.data));$('mdl').classList.remove('on');draw();
    };
  }else if(a==='del'){
    mopen('모드 내리기','<p><b>'+esc(m.name)+'</b>을(를) 목록에서 지울까요? 되돌릴 수 없어요.</p><div class="row" style="margin-top:12px"><button class="pb off" id="mgo">내리기</button></div>');
    $('mgo').onclick=function(){
      this.disabled=true;
      c.from('beaconfall_mods').delete().eq('id',m.id).then(function(r){
        if(r.error){mmsg('내리지 못했어요.',1);$('mgo').disabled=false;return;}
        LIST=LIST.filter(function(x){return x.id!==m.id;});var o=getOn();delete o[m.id];setOn(o);$('mdl').classList.remove('on');draw();
      });
    };
  }else if(a==='ver'){
    EDIT=m;TEX={};FD=null;ULOGO=null;$('ulg').value='';$('ulgm').textContent='';$('uprev').innerHTML='';$('uf').value='';umsg('');
    $('uth').textContent='버전 추가하기 · '+m.name;$('ufields').style.display='none';$('us').textContent='새 폴더로 덮어쓰기';
    $('upl').classList.add('on');
  }
}
function potatoLogo(){var c=document.createElement('canvas');c.width=c.height=32;var g=c.getContext('2d');
  function px(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h);}
  px(6,8,20,16,'#7a5230');px(4,11,24,10,'#7a5230');px(8,6,16,20,'#7a5230');px(8,9,16,14,'#c99a5b');px(6,12,20,8,'#c99a5b');px(10,8,12,16,'#c99a5b');
  px(10,12,3,3,'#5a3a1c');px(18,16,3,3,'#5a3a1c');px(14,20,3,2,'#5a3a1c');px(20,10,2,2,'#5a3a1c');
  px(11,3,2,5,'#4a9650');px(13,2,5,3,'#5aaa5e');
  return c.toDataURL('image/png');}
var POTATO={id:'builtin-potato-api',kind:'mod',name:'Potato API',descr:'여러 모드를 구동하고 만들기 위한 API모드',cat:'기타',author_name:'Frenchfries777',created_at:'2026-11-05',data:{api:'potato',logo:potatoLogo()}};
function draw(){
  cats();
  var on=getOn(),q=$('q').value.trim().toLowerCase(),L=$('list');
  ddDraw();
  if(SERVER==='load'){L.innerHTML='<div class="empty">불러오는 중이에요…</div>';$('cnt').textContent='';return;}
