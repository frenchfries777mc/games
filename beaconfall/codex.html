<style>
@font-face{font-family:Galmuri;src:url(Galmuri11.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Galmuri;src:url(Galmuri11-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--ink:#0b1626;--cream:#f4ecd0;--gold:#e9d9a4;--sky:#9ae0ff;--btn:rgba(14,18,30,.78);--panel:rgba(10,16,28,.86)}
*{box-sizing:border-box}
html{background:var(--ink)}
html,body{margin:0;color:var(--cream);font-family:Galmuri,'Noto Sans KR','Hiragino Sans','Malgun Gothic',monospace;font-size:15px;line-height:1.6}
body{background:linear-gradient(180deg,rgba(6,16,30,.55),rgba(6,16,30,.9)),url(shot-camp.png) center/cover fixed;min-height:100vh}
img{image-rendering:pixelated;image-rendering:crisp-edges}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.pb{display:inline-block;padding:8px 14px;border:3px solid var(--gold);border-radius:0;background:var(--btn);color:var(--cream);font:700 14px/1.2 inherit;text-decoration:none;cursor:pointer;box-shadow:4px 4px 0 #000b;text-align:center}
.pb:hover,.pb.on{background:var(--gold);color:#10141f}
.pb:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000b}
.row{display:flex;flex-wrap:wrap;gap:8px}
.top{padding:12px 0 6px}
.top .wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.top .pb{padding:6px 10px;font-size:13px;border-width:2px;box-shadow:3px 3px 0 #000b}
h1{margin:18px 0 4px;font-size:clamp(30px,7vw,52px);letter-spacing:.06em;line-height:1.1;text-shadow:4px 4px 0 #000}
.sub{margin:0 0 16px;color:var(--gold);font-size:13px;text-shadow:2px 2px 0 #000}
.tabs{margin:6px 0 14px}
.tabs .pb{border-color:var(--sky)}
.tabs .pb.on{background:var(--sky)}
input.q{width:100%;padding:10px 12px;border:3px solid var(--gold);background:var(--panel);color:var(--cream);font:15px inherit;box-shadow:4px 4px 0 #000b;outline:none;margin:0 0 12px}
.cats{margin:0 0 14px}
.cats .pb{padding:5px 9px;font-size:12px;border-width:2px;box-shadow:2px 2px 0 #000b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:2px solid #e9d9a466;background:var(--panel);cursor:pointer;font-size:12px;text-align:center;line-height:1.3;color:var(--cream)}
.card:hover{border-color:var(--gold)}
.card img{width:40px;height:40px}
.cnt{color:var(--gold);font-size:12px;margin:0 0 8px;text-shadow:2px 2px 0 #000}
/* 레시피 */
.grp{margin:18px 0 6px;font-size:16px;text-shadow:2px 2px 0 #000;color:var(--gold)}
.rc{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 10px;border:2px solid #e9d9a444;background:var(--panel);margin:0 0 6px}
.rc .res{display:flex;align-items:center;gap:6px;min-width:140px;cursor:pointer;font-weight:700}
.rc .res img{width:28px;height:28px}
.slots{display:flex;gap:3px;flex-wrap:wrap}
.sl{position:relative;width:30px;height:30px;border:2px solid #00000088;background:#e9d9a41f;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sl img{width:22px;height:22px}
.sl b{position:absolute;right:1px;bottom:-2px;font-size:10px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.sl.e{cursor:default;opacity:.45}
.wh{font-size:11px;padding:2px 6px;border:1px solid var(--sky);color:var(--sky);white-space:nowrap}
.wh.bk{border-color:#ffb0d0;color:#ffb0d0}
.rn{flex-basis:100%;font-size:12px;color:#d9cfb0;margin-top:-2px}
.isl{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.isl .card{padding:0 0 8px;overflow:hidden}
.isl .card img{width:100%;height:84px;object-fit:cover;image-rendering:pixelated}
.ishot{width:100%;max-height:200px;object-fit:cover;image-rendering:pixelated;border:2px solid #e9d9a444;margin:0 0 6px}
.ln{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;margin:0 0 4px}
.ln span b{color:var(--gold)}
/* 계산기 */
.cbar{display:flex;align-items:center;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
.cbar img{width:40px;height:40px;background:#e9d9a41a;border:2px solid #e9d9a444}
.cbar b{font-size:18px}
.cbar input{width:84px;padding:6px 8px;border:3px solid var(--gold);background:var(--panel);color:var(--cream);font:15px inherit}
.card.sel{border-color:var(--gold);background:#e9d9a426}
.card .bn{color:var(--gold);font-weight:700;font-size:14px}
.cst{display:flex;align-items:center;gap:10px;padding:6px 10px;border:2px solid #e9d9a444;background:var(--panel);margin:0 0 6px;cursor:pointer}
.cst img{width:28px;height:28px}
.cst span{margin-left:auto;font-size:12px;color:var(--sky)}
/* 공략 */
.gl{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.gl li{background:var(--panel);border-left:4px solid var(--gold);padding:8px 12px}
/* 상세 */
#det{position:fixed;inset:0;z-index:20;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 12px}
#det.on{display:flex}
#det .box{width:min(640px,100%);background:#141c2c;border:3px solid var(--gold);box-shadow:6px 6px 0 #000;padding:16px 16px 18px;position:relative}
#det .x{position:absolute;right:10px;top:10px}
.dh{display:flex;align-items:center;gap:12px;margin:0 40px 10px 0}
.dh img{width:64px;height:64px;background:#e9d9a41a;border:2px solid #e9d9a444}
.dh h2{margin:0;font-size:22px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tags span{font-size:12px;padding:2px 8px;border:1px solid var(--gold);color:var(--gold)}
.sec{margin:14px 0 6px;font-size:14px;color:var(--sky)}
.src{font-size:13px;margin:0 0 6px;padding:6px 10px;background:#ffffff0d}
.uses{display:flex;flex-wrap:wrap;gap:6px}
.uses .card{width:86px}
.none{font-size:13px;opacity:.7}
footer{padding:40px 0 30px;color:var(--gold);font-size:12px;text-shadow:2px 2px 0 #000}
</style>
</head>

function slotHTML(p){

function recipeHTML(i){
 const r=C.recipes[i],o=r.o[0];if(!o)return '';
 let last=r.p.length;while(last>0&&!r.p[last-1])last--;
 const slots=r.p.slice(0,Math.max(last,1)).map(slotHTML).join('');
 const outs=r.o.map(([id,n])=>`<span class="res" data-id="${esc(id)}"><img src="${ic(id)}" alt="">${esc(nm(id))}${n>1?' ×'+n:''}</span>`).join('');

 return `<div class="rc">${outs}<span class="wh">${esc(tr(r.w))}</span>${r.bk?`<span class="wh bk">${esc(t('s_book',{s:tr(r.bk)}))}</span>`:''}<span class="slots">${slots}</span>${note?`<div class="rn">${esc(note)}</div>`:''}</div>`;

  const ms=MADE[id],r=ms&&!(C.gather[id]&&C.gather[id].length)&&path.length<10&&!path.includes(id)?C.recipes[ms.find(i=>!C.recipes[i].bk)??ms[0]]:null;
  if(!r){base.set(id,(base.get(id)||0)+n);return;}
  const oc=(r.o.find(o=>o[0]===id)||[0,1])[1]||1,crafts=Math.ceil(n/oc),ing=new Map();
  r.p.forEach(p=>{if(!p)return;const x=Array.isArray(p)?p[0]:p.a[0],k=Array.isArray(p)?p[1]:p.n;ing.set(x,(ing.get(x)||0)+k);});
  for(const [x,k] of ing)go(x,k*crafts,path.concat(id));
  const st=steps.get(id);if(st)st.crafts+=crafts;else steps.set(id,{id,crafts,w:r.w});   // 재료를 먼저 만들도록 아래부터 쌓아요
 };
 go(id,qty,[]);
 return {base,steps:[...steps.values()]};
}
function renderCalc(){
 const q=document.getElementById('qc').value.trim().toLowerCase();
 const list=Object.keys(MADE).filter(id=>C.items[id]&&(!q||nm(id).toLowerCase().includes(q)||C.items[id].n.includes(q)));   // 만들 수 있는 아이템을 전부 보여줘요
 document.getElementById('cgrid').innerHTML=list.map(id=>`<button class="card${id===CI?' sel':''}" data-calc="${esc(id)}"><img src="${ic(id)}" alt="" loading="lazy">${esc(nm(id))}</button>`).join('');
 const box=document.getElementById('cres');
 if(!CI){box.innerHTML=`<p class="none" style="margin-top:14px">${esc(t('c_pick'))}</p>`;return;}
 const pl=calcPlan(CI,CQ);
 box.innerHTML=`<div class="cbar"><img src="${ic(CI)}" alt=""><b>${esc(nm(CI))}</b><label>${esc(t('c_qty'))} <input type="number" id="cq" min="1" max="9999" value="${CQ}"></label></div>`
  +`<div class="sec">${esc(t('c_base'))}</div><div class="grid">${[...pl.base].map(([id,n])=>`<button class="card" data-id="${esc(id)}"><img src="${ic(id)}" alt="" loading="lazy">${esc(nm(id))}<span class="bn">×${n}</span></button>`).join('')}</div>`
  +(pl.steps.length?`<div class="sec">${esc(t('c_steps'))}</div>${pl.steps.map(s=>`<div class="cst" data-id="${esc(s.id)}"><img src="${ic(s.id)}" alt="">${esc(nm(s.id))} · ${esc(t('c_times',{n:s.crafts}))}<span>${esc(tr(s.w))}</span></div>`).join('')}`:'')
  +`<p class="none" style="margin-top:14px">${esc(t('c_note'))}</p>`;
}
let GI=0;
function renderGuide(){
 const g=I.G||[];
 document.getElementById('gcats').innerHTML=g.map((x,i)=>`<button class="pb${i===GI?' on':''}" data-g="${i}">${esc(x.n[LANG]||x.n.en||x.n.ko)}</button>`).join('');
 document.getElementById('gtips').innerHTML=g[GI]?g[GI].i.map(x=>'<li>'+esc(x[LANG]||x.en||x.ko)+'</li>').join(''):'';
}
function sources(id){
 const out=[];
 const fh=FISH.get(id);if(fh)out.push(t(fh==='sea'?'s_fish_sea':'s_fish_river'));
 (C.gather[id]||[]).forEach(g=>out.push(tr(g)));
 for(const [mn,its,boss] of C.mobs)if(its.includes(id))out.push(t(boss?'s_boss':'s_mob',{s:tr(mn)}));
 if(LOOT.has(id))out.push(t('s_loot'));
 for(const [sid,n,p] of C.shops)if(sid===id)out.push(t('s_shop',{n,p}));
 for(const [seed,o] of C.crops)if(o===id||seed===id)out.push(t('s_crop',{s:nm(seed)}));
 if(ALCH.has(id))out.push(t('s_alch',{s:ALCH.get(id).map(nm).join(' + ')}));
 if(id.startsWith('ar_')){const [,pc,mat]=id.split('_');const P=C.armor.pieces.find(x=>x.k===pc);if(P)out.push(t('s_armor',{s:nm((C.armor.mi||{})[mat]||mat),n:P.n}));}
 return [...new Set(out)];
}
function openItem(id){
 const it=C.items[id];if(!it)return;
 const tags=[];if(it.pl)tags.push(t('tg_place'));if(it.du)tags.push(t('tg_dur',{n:it.du}));if(it.fd)tags.push(t('tg_food',{n:it.fd}));if(it.mx&&!it.du)tags.push(t('tg_max',{n:it.mx}));
 const made=(MADE[id]||[]).map(recipeHTML).join('');
 const src=sources(id).map(s=>`<div class="src">${esc(s)}</div>`).join('');
 const used=[...new Set((USED[id]||[]).flatMap(i=>C.recipes[i].o.map(o=>o[0])))];
 for(const [aid,ing] of ALCH)if(ing.includes(id)&&!used.includes(aid))used.push(aid);
 let h=`<button class="pb x" data-close>✕</button><div class="dh"><img src="${it.ic}" alt=""><h2>${esc(nm(id))}</h2></div>`;
 if(tags.length)h+=`<div class="tags">${tags.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
 if(made)h+=`<div class="sec">${esc(t('make'))}</div>${made}`;
 h+=`<div class="sec">${esc(t('get'))}</div>${src||(made?'':`<div class="none">${esc(t('none_get'))}</div>`)}`;
 if(!src&&made)h=h.replace(`<div class="sec">${esc(t('get'))}</div>`,'');
 h+=`<div class="sec">${esc(t('uses'))}</div>${used.length?`<div class="uses">${used.map(card).join('')}</div>`:`<div class="none">${esc(t('none_use'))}</div>`}`;
 document.getElementById('dbox').innerHTML=h;
 document.getElementById('det').classList.add('on');
 document.getElementById('det').scrollTop=0;
 if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);
}
function closeItem(){document.getElementById('det').classList.remove('on');history.replaceState(null,'',location.pathname+(TAB!=='items'?'#'+TAB:''));}
function setTab(tb){
 TAB=tb;
 for(const k of ['items','recipes','isl','calc','guide'])document.getElementById('v_'+k).hidden=k!==tb;
 document.querySelectorAll('#tabs .pb').forEach(b=>b.classList.toggle('on',b.dataset.tab===tb));
 if(tb==='recipes')renderRecipes();else if(tb==='isl')renderIsl();else if(tb==='calc')renderCalc();else if(tb==='guide')renderGuide();else renderItems();
}
function applyLang(){
 document.documentElement.lang=LANG;
 document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
 document.title='BEACONFALL';
 document.getElementById('qi').placeholder=t('q_items');document.getElementById('qr').placeholder=t('q_recipes');document.getElementById('qc').placeholder=t('q_calc');
 const cur=auOn()?FFLang.script():LANG;document.getElementById('lg').innerHTML=LS.concat(['au','sg','em']).map(l=>`<button class="pb${l===cur?' on':''}" data-l="${l}"${l==='au'?` style="font-family:'FF Aurebesh',system-ui"`:l==='sg'?` style="font-family:'FF Galactic',system-ui"`:''}>${NAMES[l]}</button>`).join('');
 setTab(TAB);
 const d=document.getElementById('det');if(d.classList.contains('on')){const id=decodeURIComponent(location.hash.slice(1));if(C.items[id])openItem(id);else if(ISH&&TAB==='isl')openIsland(ISH);}
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-l],[data-tab],[data-cat],[data-g],[data-calc],[data-isl],[data-id],[data-close],#det');if(!el)return;
 if(el.id==='det'){if(e.target===el)closeItem();return;}
 if(el.dataset.l){const v=el.dataset.l,was=auOn();LANG=(v==='au'||v==='sg'||v==='em')?'en':v;try{localStorage.setItem(KEY,LANG);if(window.FFLang)FFLang.set(v);}catch(x){}if((v==='au'||v==='sg'||v==='em')||was){location.reload();return;}applyLang();return;}
 if(el.dataset.tab){setTab(el.dataset.tab);history.replaceState(null,'',el.dataset.tab==='items'?location.pathname:'#'+el.dataset.tab);return;}
 if(el.dataset.cat){CAT=el.dataset.cat;renderItems();return;}
 if(el.dataset.g){GI=+el.dataset.g;renderGuide();return;}
 if(el.dataset.calc){CI=el.dataset.calc;renderCalc();return;}
 if(el.dataset.isl){openIsland(el.dataset.isl);return;}
 if(el.hasAttribute('data-close')){closeItem();return;}
 if(el.dataset.id)openItem(el.dataset.id);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeItem();});
document.getElementById('qi').addEventListener('input',renderItems);
document.getElementById('qr').addEventListener('input',renderRecipes);
document.getElementById('qc').addEventListener('input',renderCalc);
document.addEventListener('input',e=>{if(e.target.id==='cq'){CQ=Math.max(1,Math.min(9999,+e.target.value||1));const v=e.target.value;renderCalc();const n=document.getElementById('cq');n.value=v;n.focus();}});
{const h=decodeURIComponent(location.hash.slice(1));if(h==='recipes'||h==='guide'||h==='calc'||h==='isl')TAB=h;applyLang();if(C.items[h])openItem(h);}
</script>
<script src="https://frenchfries777mc.github.io/games/ff-auth.js"></script>
