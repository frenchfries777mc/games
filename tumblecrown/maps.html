<h1>맵 13곳</h1>
<p class="sub2">맵마다 모양이 달라 깃발 싸움도 달라져요. 팀은 맞은편 구석에서 시작해요.</p>
<div class="lg"><span><i style="background:#4a8af0"></i>파란 팀 시작 깃발</span><span><i style="background:#e05a4a"></i>붉은 팀 시작 깃발</span><span><i style="background:#f0c456"></i>주인 없는 깃발</span><span><i style="background:#fff;border:2px solid #4a8af0;box-sizing:border-box"></i>시작 자리</span></div>
<div class="ml" id="ml"></div>
<div class="cta"><a class="pb" href="../prototypes/tumblecrown/" target="_blank" rel="noopener">바로 플레이</a></div>
<script type="module">
import { CHAPTERS, MAP, setChapterData } from '../prototypes/tumblecrown/js/data.js';
import * as M from '../prototypes/tumblecrown/js/map.js';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const box=document.getElementById('ml');
CHAPTERS.forEach((c,i)=>{
 setChapterData(i);M.useChapter(i,true);
 const W=M.MW,H=M.MH,S=4,cv=document.createElement('canvas');cv.width=W*S;cv.height=H*S;const g=cv.getContext('2d');
 g.fillStyle='#10151f';g.fillRect(0,0,cv.width,cv.height);
 const img=g.createImageData(W,H);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=M.GRID[y*W+x],o=(y*W+x)*4,w=M.WATER&&M.WATER[y*W+x];
  const col=v===1?(w?[44,84,128]:[78,92,116]):[16,21,31];img.data[o]=col[0];img.data[o+1]=col[1];img.data[o+2]=col[2];img.data[o+3]=255;}
 const t=document.createElement('canvas');t.width=W;t.height=H;t.getContext('2d').putImageData(img,0,0);g.imageSmoothingEnabled=false;g.drawImage(t,0,0,W*S,H*S);
 const sp=MAP.tspawn||[],fl=(MAP.tflags||[]).map(f=>f.slice());
 [0,1].forEach(t=>{const own=fl.filter(f=>f[2]===t).sort((a,b)=>Math.hypot(a[0]-sp[t][0],a[1]-sp[t][1])-Math.hypot(b[0]-sp[t][0],b[1]-sp[t][1]));own.slice(1).forEach(f=>f[2]=-1);});
 sp.forEach((p,k)=>{g.beginPath();g.arc(p[0]*S,p[1]*S,15,0,7);g.fillStyle='rgba(255,255,255,.9)';g.fill();g.lineWidth=5;g.strokeStyle=k?'#e05a4a':'#4a8af0';g.stroke();});
 fl.forEach(f=>{const col=f[2]===0?'#4a8af0':f[2]===1?'#e05a4a':'#f0c456';const x=f[0]*S,y=f[1]*S;g.fillStyle='#0a0e16';g.fillRect(x-3,y-26,6,32);g.fillStyle=col;g.fillRect(x+3,y-26,22,14);g.lineWidth=3;g.strokeStyle='#0a0e16';g.strokeRect(x+3,y-26,22,14);});
 const a=document.createElement('article');a.className='box mc';a.appendChild(cv);
 const d=document.createElement('div');d.className='bd';d.innerHTML='<h3>'+esc(c.title)+'</h3><p>깃발 '+fl.length+'개 · 시작할 때 팀마다 1개, 나머지는 점령해야 해요</p>';a.appendChild(d);box.appendChild(a);});
</script>
