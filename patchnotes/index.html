<style>
  :root{ --bg:#08090d; --panel:#10131b; --line:#222837; --text:#eef0f5; --dim:#8a93a6; --fry:#ffc93c; --fry2:#ff8a3d; --g0:#ff8fc2; --g1:#3ee0c4; --g2:#e8c25a; --g3:#ffae5a; --g4:#6aa8ff; }
  html[data-ff-theme=light]{ --bg:#f6f3ec; --panel:#ffffff; --line:#e2dccf; --text:#1f1b14; --dim:#6d6658; --g0:#b8326f; --g1:#0f8a77; --g2:#8a6c14; --g3:#a0600c; --g4:#1f5fbf; }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
  body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; font-size:16px; line-height:1.6; min-height:100vh;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    background-image:radial-gradient(ellipse 900px 520px at 10% -10%, rgba(255,201,60,.10), transparent 60%), radial-gradient(ellipse 800px 600px at 110% 30%, rgba(255,77,94,.07), transparent 60%); background-attachment:fixed;}
  html[data-ff-theme=light] body{background-image:radial-gradient(ellipse 900px 520px at 10% -10%, rgba(255,201,60,.22), transparent 60%);}
  a{color:var(--fry);}
  .wrap{max-width:860px; margin:0 auto; padding:0 16px 60px;}
  .top{display:flex; align-items:center; gap:10px; padding:16px 0 4px; flex-wrap:wrap;}
  .hubBtn{margin-right:auto; display:inline-flex; align-items:center; gap:6px; color:var(--text); text-decoration:none; font-size:14px; font-weight:600; background:var(--panel); border:1px solid var(--line); border-radius:99px; padding:6px 13px;}
  .hubBtn:hover{border-color:var(--fry); color:var(--fry);}
  .langSel{background:var(--panel); color:var(--dim); border:1px solid var(--line); border-radius:8px; padding:5px 8px; font:inherit; font-size:13.5px; cursor:pointer;}
  h1{font-family:'Oswald','Noto Sans KR',sans-serif; font-size:34px; margin:18px 0 4px; letter-spacing:.02em;}
  h1 b{color:var(--fry);}
  .lead{margin:0 0 16px; color:var(--dim); font-size:15px;}
  .bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px;}
  .chip{background:var(--panel); color:var(--dim); border:1px solid var(--line); border-radius:99px; padding:5px 13px; font:inherit; font-size:14px; font-weight:700; cursor:pointer;}
  .chip:hover{color:var(--text);} .chip.on{color:#1a1206; background:linear-gradient(135deg,var(--fry),var(--fry2)); border-color:transparent;}
  .srch{flex:1 1 200px; min-width:180px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font:inherit; font-size:15px;}
  .srch:focus{outline:none; border-color:var(--fry);}
  .day{margin:22px 0 8px; font-size:13px; letter-spacing:.08em; color:var(--dim); font-weight:700;}
  .card{background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--c,var(--fry)); border-radius:12px; padding:12px 16px; margin-bottom:10px;}
  .card .h{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:13px; color:var(--dim);}
  .card .g{color:var(--c,var(--fry)); font-weight:800;}
  .card h3{margin:4px 0 4px; font-size:17.5px; line-height:1.4;}
  .card ul{margin:0; padding-left:20px;} .card li{margin:1px 0; font-size:15px;}
  .empty,.err{color:var(--dim); text-align:center; padding:30px 0;}
  .more{display:block; margin:14px auto 0; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:9px 22px; font:inherit; font-weight:700; cursor:pointer;}
  .more:hover{border-color:var(--fry);}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="hubBtn" id="hubBtn" href="../">← <span></span></a><span data-ff-account></span><select class="langSel" id="lang"></select></div>
  <h1>Patch <b>Notes</b></h1>
  <p class="lead" id="lead"></p>
  <div class="bar" id="bar"></div>
  <div id="list"></div>
</div>
<script src="../ff-auth.js?v=20261022b"></script>
<script>
(function(){
'use strict';
var LN=['ko','en','es','fr','de','ja','zh','pt','ru','tr','nw','gk','au','sg'], NAMES={ko:'한국어',en:'English',es:'Español',fr:'Français',de:'Deutsch',ja:'日本語',zh:"简体中文",pt:"Português (Brasil)",ru:"Русский",tr:"Türkçe",nw:"Newspeak",gk:"번역기 한국어",au:"Aurebesh",sg:"Standard Galactic",gk:"번역기 한국어"};
var U={
 ko:{hub:'허브',lead:'Stickseum · Crown Envoy · Beaconfall · 허브의 패치노트를 한곳에 모았다.',all:'전체',hubN:'허브',search:'패치노트 검색',empty:'찾는 패치노트가 없다.',err:'패치노트를 불러오지 못했다.',more:'더 보기',items:'{0}개'},
 en:{hub:'Hub',lead:'Patch notes of Stickseum, Crown Envoy, Beaconfall and the hub in one place.',all:'All',hubN:'Hub',search:'Search patch notes',empty:'No patch notes found.',err:'Could not load the patch notes.',more:'Show more',items:'{0} items'},
 es:{hub:'Hub',lead:'Las notas de parche de Stickseum, Crown Envoy, Beaconfall y el hub en un solo lugar.',all:'Todo',hubN:'Hub',search:'Buscar notas de parche',empty:'No se encontraron notas de parche.',err:'No se pudieron cargar las notas de parche.',more:'Ver más',items:'{0} elementos'},
 fr:{hub:'Hub',lead:'Les notes de mise à jour de Stickseum, Crown Envoy, Beaconfall et du hub au même endroit.',all:'Tout',hubN:'Hub',search:'Rechercher dans les notes',empty:'Aucune note trouvée.',err:'Impossible de charger les notes.',more:'Voir plus',items:'{0} éléments'},
 de:{hub:'Hub',lead:'Die Patchnotes von Stickseum, Crown Envoy, Beaconfall und dem Hub an einem Ort.',all:'Alle',hubN:'Hub',search:'Patchnotes durchsuchen',empty:'Keine Patchnotes gefunden.',err:'Die Patchnotes konnten nicht geladen werden.',more:'Mehr anzeigen',items:'{0} Einträge'},
 ja:{hub:'ハブ',lead:'Stickseum・Crown Envoy・Beaconfall・ハブのパッチノートを1か所にまとめました。',all:'すべて',hubN:'ハブ',search:'パッチノートを検索',empty:'パッチノートが見つかりません。',err:'パッチノートを読み込めませんでした。',more:'もっと見る',items:'{0}件'},
 zh:{"hub":"主页","lead":"将 Stickseum · Crown Envoy · Beaconfall · 主页的补丁说明汇集在一处。","all":"全部","hubN":"主页","search":"搜索补丁说明","empty":"没有找到补丁说明。","err":"无法加载补丁说明。","more":"显示更多","items":"{0} 项"},
 pt:{"hub":"Início","lead":"Notas de atualização de Stickseum, Crown Envoy, Beaconfall e do início em um só lugar.","all":"Tudo","hubN":"Início","search":"Buscar notas de atualização","empty":"Nenhuma nota encontrada.","err":"Não foi possível carregar as notas.","more":"Mostrar mais","items":"{0} itens"},
 ru:{"hub":"Хаб","lead":"Патчноуты Stickseum, Crown Envoy, Beaconfall и хаба в одном месте.","all":"Все","hubN":"Хаб","search":"Поиск по патчноутам","empty":"Патчноуты не найдены.","err":"Не удалось загрузить патчноуты.","more":"Показать ещё","items":"{0} пунктов"},
 tr:{"hub":"Merkez","lead":"Stickseum, Crown Envoy, Beaconfall ve merkezin yama notları tek yerde.","all":"Tümü","hubN":"Merkez","search":"Yama notlarında ara","empty":"Yama notu bulunamadı.","err":"Yama notları yüklenemedi.","more":"Daha fazla göster","items":"{0} madde"},
 nw:{"hub":"Hub","lead":"Every correction of Stickseum, Crown Envoy, Beaconfall and the hub, by the Ministry of Truth. The past has always been this way.","all":"All","hubN":"Hub","search":"Seek minitrue corrections","empty":"Unminitrue corrections seeked.","err":"You have been sent to Room 101. (Corrections could not load.)","more":"See plus","items":"{0} things"},
 gk:{"hub":"바퀴통","lead":"반창고 쪽지들 의 Stickseum, 왕관 Envoy, Beaconfall 그리고 그 바퀴통 안에 하나 장소.","all":"모든","hubN":"바퀴통","search":"수색하다 반창고 쪽지들","empty":"아니요 반창고 쪽지들 설립하다.","err":"할 수 있었다 아니다 짐 그 반창고 쪽지들.","more":"쇼 더","items":"{0} 품목들"}};
function detect(){ var c=[]; try{ var s=localStorage.getItem('arenaClashLang'); if(s) c.push(s); }catch(e){} try{ c=c.concat(navigator.languages||[navigator.language||'']); }catch(e){}
  for(var i=0;i<c.length;i++){ var k=String(c[i]).slice(0,2).toLowerCase(); if(LN.indexOf(k)>=0) return k; } return 'ko'; }
var lang=detect(), T=U[lang];
if(lang==='nw'){ document.title='Ministry of Truth: Corrections'; var h1=document.querySelector('h1'); if(h1) h1.innerHTML='Ministry of Truth: <b>Corrections</b>'; }
var SRC=[{k:'hub',name:'허브',c:'--g0',url:'../patchnotes.json'},{k:'stickseum',name:'Stickseum',c:'--g1',url:'../stickseum/patchnotes.json'},
         {k:'crownenvoy',name:'Crown Envoy',c:'--g2',url:'../crownenvoy/patchnotes.json'},{k:'beaconfall',name:'Beaconfall',c:'--g3',url:'../beaconfall/patchnotes.json'}];
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var all=[], sel='all', q='', shown=30, failed=0;
function tr(n){ var t=lang!=='ko'&&n.tr&&(n.tr[lang]||(['zh','pt','ru','tr','nw'].indexOf(lang)>=0&&n.tr.en)); return {title:(t&&t.title)||n.title||'', items:(t&&t.items)||n.items||[]}; }
function paintBar(){
  var h='<button type="button" class="chip'+(sel==='all'?' on':'')+'" data-k="all">'+esc(T.all)+'</button>'+SRC.map(function(s){ return '<button type="button" class="chip'+(sel===s.k?' on':'')+'" data-k="'+s.k+'">'+esc(s.k==='hub'?T.hubN:s.name)+'</button>'; }).join('')+
    '<input class="srch" id="q" type="search" placeholder="'+esc(T.search)+'" value="'+esc(q)+'">';
  $('#bar').innerHTML=h;
  $('#q').oninput=function(){ q=this.value; shown=30; paintList(); };
  var bs=document.querySelectorAll('#bar .chip'); for(var i=0;i<bs.length;i++) bs[i].onclick=function(){ sel=this.getAttribute('data-k'); shown=30; paintBar(); paintList(); try{ history.replaceState(null,'','#'+sel); }catch(e){} };
  var el=$('#q'); }
function paintList(){
  var box=$('#list'), ql=q.trim().toLowerCase();
  var rows=all.filter(function(n){ return (sel==='all'||n.g===sel)&&(!ql||(n.t.title+' '+n.t.items.join(' ')+' '+n.build).toLowerCase().indexOf(ql)>=0); });
  if(!rows.length){ box.innerHTML='<div class="'+(failed&&!all.length?'err':'empty')+'">'+esc(failed&&!all.length?T.err:T.empty)+'</div>'; return; }
  var out='', last='';
  rows.slice(0,shown).forEach(function(n){
    if(n.date!==last){ last=n.date; out+='<div class="day">'+esc(n.date)+'</div>'; }
    out+='<article class="card" style="--c:var('+n.s.c+')"><div class="h"><span class="g">'+esc(n.g==='hub'?(lang==='ko'?'허브':T.hubN):n.s.name)+'</span>'+(n.build?'<span>'+esc(n.build)+'</span>':'')+'<span>'+esc(T.items.replace('{0}',n.t.items.length))+'</span></div>'+
      '<h3>'+esc(n.t.title)+'</h3><ul>'+n.t.items.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul></article>'; });
  if(rows.length>shown) out+='<button type="button" class="more" id="more">'+esc(T.more)+'</button>';
  box.innerHTML=out; var m=$('#more'); if(m) m.onclick=function(){ shown+=30; paintList(); };
}
function load(){
  return Promise.all(SRC.map(function(s,si){ return fetch(s.url,{cache:'no-cache'}).then(function(r){ return r.ok?r.json():null; },function(){ return null; }).then(function(d){
    if(!d){ failed++; return []; } return (d.notes||[]).map(function(n,i){ return {g:s.k,s:s,i:i,si:si,date:n.date||'',build:n.build||'',t:tr(n)}; }); }); }))
  .then(function(l){ all=[].concat.apply([],l).sort(function(a,b){ return (b.date>a.date?1:b.date<a.date?-1:0)||(a.si-b.si)||(a.i-b.i); }); paintList(); });
}
(function init(){
  document.documentElement.lang=lang; $('#hubBtn span').textContent=T.hub; $('#lead').textContent=T.lead;
  var ls=$('#lang'); var VL={"ko": "가상 언어", "en": "Fictional languages", "es": "Idiomas ficticios", "fr": "Langues fictives", "de": "Fiktive Sprachen", "ja": "架空の言語", "zh": "虚构语言", "pt": "Idiomas fictícios", "ru": "Вымышленные языки", "tr": "Kurgusal diller", "nw": "Fictional speaks","gk":"Fictional 언어들"}, cur=(window.FFLang&&FFLang.pick)?FFLang.pick():lang, op=function(k){ return '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+NAMES[k]+'</option>'; }, vk=function(k){ return k==='nw'||k==='gk'||(k==='au'||k==='sg'); };
  ls.innerHTML=LN.filter(function(k){ return !vk(k); }).map(op).join('')+'<optgroup label="'+(VL[lang]||VL.en)+'">'+LN.filter(vk).map(op).join('')+'</optgroup>';
  ls.onchange=function(){ try{ localStorage.setItem('arenaClashLang',this.value); }catch(e){} try{ if(window.FFLang) FFLang.set(this.value); }catch(e){} location.reload(); };
  var h=(location.hash||'').slice(1); if(SRC.some(function(s){ return s.k===h; })) sel=h;
  paintBar(); load();
})();
})();
</script>
</body>
</html>
