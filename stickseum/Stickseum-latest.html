<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="https://frenchfries777mc.github.io/games/gamelogo/stickseum.svg">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stickseum</title>
<style>
html,body{margin:0;height:100%;background:#05061a;color:#cfd6e4;font-family:system-ui,sans-serif}
#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#ld b{font:900 clamp(26px,5vw,44px)/1 system-ui,sans-serif;letter-spacing:.2em;color:#fff}
#ldb{width:min(720px,90vw);height:14px;background:#1c2438;border-radius:8px;overflow:hidden}
#ldi{display:block;height:100%;width:0;background:#3fe0c5;transition:width .15s}
#ldp{font:600 15px system-ui,sans-serif;color:#8a94a8}
</style>
</head>
<body>
<!-- 게임 본체(Stickseum-game.html)를 받으면서 진행률을 보여 주는 시작 파일이에요. 다 받으면 그 자리에서 게임으로 바뀌어요. 게임을 고칠 때는 Stickseum-game.html 을 고쳐요. -->
<div id="ld"><b>STICKSEUM</b><div id="ldb"><i id="ldi"></i></div><div id="ldp"></div></div>
<script>
(function(){
var SRC='Stickseum-game.html', EST=3914897, bar=document.getElementById('ldi'), txt=document.getElementById('ldp');
var LANGS=['ko','en','es','fr','de','ja','zh','pt','ru','tr','it','pl','ar','nw','gk'];      // (언어는 게임과 같은 규칙: 저장된 선택 → 브라우저 언어 → 영어. nw·gk는 한국어 그대로)
var LT={en:'Loading {p}%',es:'Cargando {p}%',fr:'Chargement {p} %',de:'Lädt {p} %',ja:'読み込み中 {p}%',zh:'加载中 {p}%',pt:'Carregando {p}%',ru:'Загрузка {p}%',tr:'Yükleniyor %{p}',it:'Caricamento {p}%',pl:'Wczytywanie {p}%',ar:'جارٍ التحميل {p}%'};
var LG=(function(){ var s=null; try{ s=localStorage.getItem('arenaClashLang'); }catch(e){} if(LANGS.indexOf(s)>=0) return s; var c=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'']; for(var i=0;i<c.length;i++){ var b=String(c[i]||'').toLowerCase().split('-')[0]; if(LANGS.indexOf(b)>=0) return b; } return 'en'; })();
var MSG=(LT[LG])?LT[LG]:'불러오는 중 {p}%';
function set(p){ p=Math.max(0,Math.min(100,p)); bar.style.width=p+'%'; txt.textContent=MSG.replace('{p}',Math.round(p)); }
function plain(){ location.replace(SRC+location.search+location.hash); }      // (진행률을 못 쓰는 브라우저·오류일 때는 게임 파일을 그대로 열어요)
set(0);
if(!window.fetch||!window.ReadableStream||!window.Blob){ plain(); return; }
var est=EST; try{ est=+localStorage.getItem('stk_gsize')||EST; }catch(e){}      // (서버가 압축해서 보내면 파일 길이를 알 수 없어서, 지난번에 받은 크기를 기준으로 삼아요)
fetch(SRC).then(function(r){
  if(!r.ok) throw new Error('http '+r.status);
  var rd=r.body.getReader(), parts=[], got=0;
  function pump(){ return rd.read().then(function(x){
    if(x.done) return;
    parts.push(x.value); got+=x.value.length; set(Math.min(99,got/est*100)); return pump();
  }); }
  return pump().then(function(){ try{ localStorage.setItem('stk_gsize',String(got)); }catch(e){} set(100); return new Blob(parts).text(); });
}).then(function(html){
  setTimeout(function(){ document.open(); document.write(html); document.close(); },120);
}).catch(plain);
})();
</script>
</body>
</html>
