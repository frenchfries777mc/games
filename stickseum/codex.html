<html lang="ko">
<head>
<meta charset="UTF-8">

<title>Stickseum</title>
<meta name="description" content="Stickseum 캐릭터 27명의 무기, 스킬, 궁극기, 상성">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{ --bg:#0a0b0f; --bg2:#0e1420; --panel:#121825; --panel-2:#171f2e; --line:#232c3d; --text:#e8eaf0; --text-dim:#8893a6; --red:#ff4d5e; --teal:#3fe0c5; --gold:#ffd34d; --green:#4ade80; }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); min-height:100%;}
  body{ font-family:'Rajdhani','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:17px; line-height:1.55;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    background-image: radial-gradient(ellipse 900px 500px at 20% -10%, rgba(255,77,94,.12), transparent 60%), radial-gradient(ellipse 700px 500px at 100% 10%, rgba(63,224,197,.09), transparent 55%), linear-gradient(var(--bg), var(--bg2)); background-attachment:fixed; }
  .wrap{max-width:980px; margin:0 auto; padding:0 18px;}
  h1,h2,h3{font-family:'Oswald','Noto Sans KR',sans-serif; margin:0; letter-spacing:.01em;}
  a{color:var(--teal);}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:22px 0 10px; flex-wrap:wrap;}
  .wordmark{font-family:'Oswald',sans-serif; font-weight:600; font-size:21px; letter-spacing:.03em; color:var(--text); text-decoration:none;}
  .wordmark b{color:var(--red); font-weight:700;}
  .topbar nav{display:flex; gap:4px; overflow-x:auto; max-width:100%;}
  .topbar nav a{color:var(--text-dim); text-decoration:none; font-size:15px; padding:6px 10px; border-radius:7px; white-space:nowrap; border:1px solid transparent;}
  .topbar nav a:hover{color:var(--text);}
  .topbar [data-ff-account]{display:inline-flex; align-items:center; white-space:nowrap;}
  .topbar{align-items:flex-start; flex-wrap:nowrap;} .topbar .right{row-gap:8px;} .topbar nav{order:3; flex-basis:100%; justify-content:flex-end; flex-wrap:wrap; overflow-x:visible;}   /* not enough room for one row: the menu goes under the language and account buttons */
  .topbar nav a.on{color:var(--text); background:var(--panel); border:1px solid var(--line);}
  .langSel{background:var(--panel); color:var(--text-dim); border:1px solid var(--line); border-radius:7px; padding:5px 8px; font:inherit; font-size:14px; cursor:pointer; margin-left:6px;}
  .langSel:hover{color:var(--text); border-color:var(--teal);}
  .topbar .right{display:flex; align-items:center; gap:4px; max-width:100%; min-width:0; flex-wrap:wrap; justify-content:flex-end;}   /* no overflow here: it would clip the account menu */
  .head{padding:22px 0 4px;}
  .head h1{font-size:clamp(32px,6vw,48px); font-weight:700; text-transform:uppercase; line-height:1.05;}
  .head p{color:var(--text-dim); margin:10px 0 0; font-size:17px; max-width:62ch;}
  .rule{height:2px; background:linear-gradient(90deg,var(--red),transparent 40%); margin:9px 0 18px; border:0;}
  section{margin-top:34px;}
  section h2{font-size:23px; text-transform:uppercase; letter-spacing:.03em;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 14px;}
  .chip{background:var(--panel); border:1px solid var(--line); color:var(--text-dim); border-radius:99px; padding:6px 14px; font:inherit; font-size:15px; font-weight:600; cursor:pointer;}
  .chip:hover{color:var(--text);}
  .chip.on{background:var(--teal); border-color:var(--teal); color:#07201b;}
  input.search{background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:99px; padding:6px 14px; font:inherit; font-size:15px; min-width:0; flex:1 1 160px; max-width:260px;}
  input.search:focus{outline:none; border-color:var(--teal);}
  .muted{color:var(--text-dim);}
  .err{color:var(--red); padding:14px 0;}
  footer{margin:56px 0 40px; color:var(--text-dim); font-size:14px; border-top:1px solid var(--line); padding-top:18px;}
  @media(max-width:620px){ .wrap{padding:0 16px;} .topbar{padding-top:16px;} .topbar nav a{padding:6px 8px; font-size:14px;} }
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 10px 12px; cursor:pointer; text-align:center; position:relative; transition:transform .12s, border-color .12s; font:inherit; color:inherit;}
  .card:hover{transform:translateY(-2px); border-color:var(--teal);}
  .card img{width:100%; max-width:130px; aspect-ratio:200/160; display:block; margin:0 auto; image-rendering:auto;}
  .card .nm{font-family:'Oswald','Noto Sans KR',sans-serif; font-weight:600; font-size:19px; margin-top:2px;}
  .card .wp{color:var(--text-dim); font-size:14px;}
  .card .kd{position:absolute; top:8px; left:8px; font-size:12px; font-weight:700; color:var(--text-dim); background:var(--panel-2); border:1px solid var(--line); border-radius:99px; padding:1px 8px;}
  .wr{height:5px; background:var(--panel-2); border-radius:99px; margin:8px 6px 0; overflow:hidden;}
  .wr i{display:block; height:100%; border-radius:99px;}
  .wrt{font-size:12.5px; color:var(--text-dim); margin-top:3px;}
  #dlg{position:fixed; inset:0; background:rgba(5,6,10,.72); display:none; align-items:center; justify-content:center; padding:16px; z-index:10;}
  #dlg.on{display:flex;}
  .box{background:var(--panel); border:1px solid var(--line); border-radius:14px; width:min(720px,100%); max-height:calc(100vh - 32px); overflow:auto; position:relative; padding:20px 22px 22px;}
  .box .x{position:absolute; top:10px; right:10px; background:var(--panel-2); border:1px solid var(--line); color:var(--text); width:36px; height:36px; border-radius:50%; font-size:20px; cursor:pointer; line-height:1;}
  .top{display:grid; grid-template-columns:170px 1fr; gap:18px; align-items:center;}
  .top img{width:170px; aspect-ratio:200/160; background:radial-gradient(circle at 50% 60%, rgba(63,224,197,.13), transparent 70%); border-radius:12px;}
  .top h2{font-size:32px;} .top .sub{color:var(--text-dim); font-size:16px;}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px;}
  .st{background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:6px 8px; text-align:center;}
  .st b{display:block; font-family:'Oswald',sans-serif; font-size:21px; font-weight:600;} .st span{font-size:12.5px; color:var(--text-dim);}
  .ab{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:11px 14px; margin-top:10px;}
  .ab .h{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;}
  .ab .k{font-size:12.5px; font-weight:700; color:#0a0b0f; background:var(--gold); border-radius:5px; padding:0 7px;}
  .ab .k.f{background:var(--teal);} .ab .k.atk{background:#cfd3dc;}
  .ab .n{font-weight:700; font-size:17px;} .ab .c{color:var(--text-dim); font-size:13.5px;}
  .ab p{margin:4px 0 0; color:var(--text-dim); font-size:15.5px;}
  .mu{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  .mu h3{font-size:15px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}
  .mu a{display:flex; justify-content:space-between; color:var(--text); text-decoration:none; padding:3px 0; font-size:15.5px; border-bottom:1px dashed var(--line);}
  .mu a:last-child{border-bottom:0;} .mu a:hover{color:var(--teal);}
  .good{color:var(--teal);} .bad{color:var(--red);}
  @media(max-width:620px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px;}
    .card{padding:8px 6px 10px;} .card .nm{font-size:16px;} .card .wp{font-size:12.5px;} .card .kd{display:none;}
    .top{grid-template-columns:96px 1fr; gap:12px;} .top img{width:96px;} .top h2{font-size:24px;}
    .stats{grid-template-columns:repeat(2,1fr);} .mu{grid-template-columns:1fr;} .box{padding:16px 14px 16px;}
  }
</style>
</head>

const byId = {}; CODEX.chars.forEach(c => byId[c.id] = c);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const wrColor = p => p >= 60 ? 'var(--red)' : p >= 45 ? 'var(--teal)' : 'var(--gold)';

let kind = '전체', q = '';
const kinds = ['전체', ...new Set(CODEX.chars.map(c => c.kind).filter(Boolean))];
const chips = document.getElementById('chips');
kinds.forEach(k => { const b = document.createElement('button'); b.className = 'chip' + (k === kind ? ' on' : ''); b.textContent = k; b.onclick = () => { kind = k; chips.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); draw(); }; chips.appendChild(b); });
const s = document.createElement('input'); s.className = 'search'; s.placeholder = '이름으로 찾기'; s.oninput = () => { q = s.value.trim(); draw(); }; chips.appendChild(s);
function draw(){
  const g = document.getElementById('grid'); g.innerHTML = '';
  for (const c of CODEX.chars){
    if (kind !== '전체' && c.kind !== kind) continue;
    if (q && !(c.persona + ' ' + c.weapon + ' ' + SI18N.T(c.persona) + ' ' + SI18N.T(c.weapon)).toLowerCase().includes(q.toLowerCase())) continue;
    const b = BAL && BAL.rows[c.id];
    const el = document.createElement('button'); el.className = 'card';
    el.innerHTML = '<span class="kd">' + esc(c.kind) + '</span><img alt="" src="' + c.img + '"><div class="nm">' + esc(c.persona) + '</div><div class="wp">' + esc(c.emoji + ' ' + c.weapon) + '</div>'
      + (b ? '<div class="wr"><i style="width:' + b.wr + '%; background:' + wrColor(b.wr) + '"></i></div><div class="wrt">' + SI18N.F('승률 {0}%', b.wr.toFixed(1)) + '</div>' : '');
    el.onclick = () => { location.hash = c.id; };
    g.appendChild(el);
  }
  if (!g.children.length) g.innerHTML = '<p class="muted">찾는 캐릭터가 없어요.</p>';
}
function openChar(id){
  const c = byId[id], dlg = document.getElementById('dlg');
  if (!c){ dlg.classList.remove('on'); return; }
  const b = BAL && BAL.rows[c.id];
  const mu = (list, cls) => list.map(m => '<a href="#' + m.id + '"><span>' + esc((byId[m.id] || {}).persona || m.id) + '</span><span class="' + cls + '">' + m.wr + '%</span></a>').join('');
  document.getElementById('box').innerHTML =
    '<button class="x" aria-label="닫기">×</button>'
    + '<div class="top"><img alt="" src="' + c.img + '"><div><h2>' + esc(c.persona) + '</h2><div class="sub">' + esc(c.emoji + ' ' + c.weapon + ' · ' + c.kind) + '</div>'
    + '<div class="stats"><div class="st"><b>' + c.dmg + '</b><span>데미지</span></div><div class="st"><b>' + SI18N.F('{0}초', c.cd) + '</b><span>공격 쿨타임</span></div>'
    + '<div class="st"><b>' + (c.range || '원거리') + '</b><span>사거리</span></div><div class="st"><b>' + (b ? b.wr.toFixed(1) + '%' : '-') + '</b><span>1대1 승률</span></div></div></div></div>'
    + '<div class="ab"><div class="h"><span class="k atk">공격</span><span class="n">' + esc(c.weapon) + '</span></div><p>' + esc(c.desc) + '</p></div>'
    + (c.skill ? '<div class="ab"><div class="h"><span class="k f">스킬 F</span><span class="n">' + esc(c.skill.name) + '</span><span class="c">' + SI18N.F('쿨타임 {0}초', CODEX.skillCd) + '</span></div><p>' + esc(c.skill.desc) + '</p></div>' : '')
    + (c.ult ? '<div class="ab"><div class="h"><span class="k">궁극기 R</span><span class="n">' + esc(c.ult.name) + '</span><span class="c">' + SI18N.F('쿨타임 {0}초', CODEX.ultCd) + '</span></div><p>' + esc(c.ult.desc) + '</p></div>' : '')

  document.querySelector('#box .x').onclick = closeChar;
  dlg.classList.add('on'); document.getElementById('box').scrollTop = 0;
}
function closeChar(){ history.replaceState(null, '', location.pathname + location.search); document.getElementById('dlg').classList.remove('on'); }
document.getElementById('dlg').addEventListener('click', e => { if (e.target.id === 'dlg') closeChar(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeChar(); });
window.addEventListener('hashchange', () => openChar(location.hash.slice(1)));
draw(); openChar(location.hash.slice(1));
