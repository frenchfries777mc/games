<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stickseum</title>
<meta name="description" content="Stickseum 캐릭터별 승률과 패치마다 바뀐 수치">
<meta name="theme-color" content="#0a0b0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://frenchfries777mc.github.io/games/ff-lang.js"></script>
<script src="site-i18n.js"></script>
<style>
  :root{ --bg:#0a0b0f; --bg2:#0e1420; --panel:#121825; --panel-2:#171f2e; --line:#232c3d; --text:#e8eaf0; --text-dim:#8893a6; --red:#ff4d5e; --teal:#3fe0c5; --gold:#ffd34d; --green:#4ade80; }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); min-height:100%;}
  body{ font-family:'Rajdhani','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:17px; line-height:1.55;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    background-image: radial-gradient(ellipse 900px 500px at 20% -10%, rgba(255,77,94,.12), transparent 60%), radial-gradient(ellipse 700px 500px at 100% 10%, rgba(63,224,197,.09), transparent 55%), linear-gradient(var(--bg), var(--bg2)); background-attachment:fixed; }
  .wrap{max-width:980px; margin:0 auto; padding:0 18px;}
  h1,h2,h3{font-family:'Oswald','Noto Sans KR',sans-serif; margin:0; letter-spacing:.01em;}
  a{color:var(--teal);}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:22px 0 10px; flex-wrap:wrap;}
  .wordmark{font-family:'Oswald',sans-serif; font-weight:600; font-size:21px; letter-spacing:.03em; color:var(--text); text-decoration:none;}
  .wordmark b{color:var(--red); font-weight:700;}
  .topbar nav{display:flex; gap:4px; overflow-x:auto; max-width:100%;}
  .topbar nav a{color:var(--text-dim); text-decoration:none; font-size:15px; padding:6px 10px; border-radius:7px; white-space:nowrap; border:1px solid transparent;}
  .topbar nav a:hover{color:var(--text);}
  .topbar [data-ff-account]{display:inline-flex; align-items:center; white-space:nowrap;}
  .topbar{align-items:flex-start; flex-wrap:nowrap;} .topbar .right{row-gap:8px;} .topbar nav{order:3; flex-basis:100%; justify-content:flex-end; flex-wrap:wrap; overflow-x:visible;}   /* not enough room for one row: the menu goes under the language and account buttons */
  .topbar nav a.on{color:var(--text); background:var(--panel); border:1px solid var(--line);}
  .langSel{background:var(--panel); color:var(--text-dim); border:1px solid var(--line); border-radius:7px; padding:5px 8px; font:inherit; font-size:14px; cursor:pointer; margin-left:6px;}
  .langSel:hover{color:var(--text); border-color:var(--teal);}
  .topbar .right{display:flex; align-items:center; gap:4px; max-width:100%; min-width:0; flex-wrap:wrap; justify-content:flex-end;}   /* no overflow here: it would clip the account menu */
  .head{padding:22px 0 4px;}
  .head h1{font-size:clamp(32px,6vw,48px); font-weight:700; text-transform:uppercase; line-height:1.05;}
  .head p{color:var(--text-dim); margin:10px 0 0; font-size:17px; max-width:62ch;}
  .rule{height:2px; background:linear-gradient(90deg,var(--red),transparent 40%); margin:9px 0 18px; border:0;}
  section{margin-top:34px;}
  section h2{font-size:23px; text-transform:uppercase; letter-spacing:.03em;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 14px;}
  .chip{background:var(--panel); border:1px solid var(--line); color:var(--text-dim); border-radius:99px; padding:6px 14px; font:inherit; font-size:15px; font-weight:600; cursor:pointer;}
  .chip:hover{color:var(--text);}
  .chip.on{background:var(--teal); border-color:var(--teal); color:#07201b;}
  input.search{background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:99px; padding:6px 14px; font:inherit; font-size:15px; min-width:0; flex:1 1 160px; max-width:260px;}
  input.search:focus{outline:none; border-color:var(--teal);}
  .muted{color:var(--text-dim);}
  .err{color:var(--red); padding:14px 0;}
  footer{margin:56px 0 40px; color:var(--text-dim); font-size:14px; border-top:1px solid var(--line); padding-top:18px;}
  @media(max-width:620px){ .wrap{padding:0 16px;} .topbar{padding-top:16px;} .topbar nav a{padding:6px 8px; font-size:14px;} }
  .sum{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:18px;}
  .sum .panel{padding:12px 14px;}
  .sum b{display:block; font-family:'Oswald','Noto Sans KR',sans-serif; font-size:24px; font-weight:600; line-height:1.15;}
  .sum span{color:var(--text-dim); font-size:14px;}
  .tbl{padding:6px 0;}
  .row{display:grid; grid-template-columns:34px minmax(120px,170px) 1fr 70px 64px; gap:10px; align-items:center; padding:7px 14px; border-bottom:1px solid var(--line); text-decoration:none; color:var(--text);}
  .row:last-child{border-bottom:0;}
  a.row:hover{background:var(--panel-2);}
  .row.hd{color:var(--text-dim); font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  .rk{font-family:'Oswald',sans-serif; color:var(--text-dim); font-size:17px; text-align:right;}
  .nm{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar{height:12px; background:var(--panel-2); border-radius:99px; position:relative; overflow:hidden;}
  .bar i{position:absolute; left:0; top:0; bottom:0; border-radius:99px;}
  .bar .mid{position:absolute; left:50%; top:-2px; bottom:-2px; width:2px; background:rgba(255,255,255,.25);}
  .pc{font-family:'Oswald',sans-serif; font-size:18px; text-align:right;}
  .dl{font-size:14px; text-align:right; color:var(--text-dim);}
  .up{color:var(--green);} .down{color:var(--red);}
  .how{padding:14px 18px; color:var(--text-dim); font-size:15.5px;}
  .how ul{margin:6px 0 0; padding-left:20px;} .how li{margin:4px 0;}
  .note{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 16px 10px; margin-bottom:10px;}
  .note .nh{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px;}
  .note .nt{font-weight:700; font-size:17px;} .note .nd{color:var(--text-dim); font-size:13.5px;}
  .note ul{margin:6px 0 0; padding-left:20px; color:var(--text-dim); font-size:15.5px;} .note li{margin:3px 0;}
  .note li b{color:var(--text); font-weight:600;}
  .warn{background:rgba(255,211,77,.08); border:1px solid rgba(255,211,77,.35); border-radius:10px; padding:10px 14px; font-size:15px; margin-top:12px;}
  button.row{width:100%; background:none; border:0; border-bottom:1px solid var(--line); font:inherit; cursor:pointer; text-align:left;}
  button.row:hover{background:var(--panel-2);}
  #dlg{position:fixed; inset:0; background:rgba(5,6,10,.72); display:none; align-items:center; justify-content:center; padding:16px; z-index:10;}
  #dlg.on{display:flex;}
  .box{background:var(--panel); border:1px solid var(--line); border-radius:14px; width:min(860px,100%); max-height:calc(100vh - 32px); overflow:auto; position:relative; padding:20px 22px 20px;} .box{scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent;} .box::-webkit-scrollbar{width:6px;} .box::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18); border-radius:99px;}
  #dlgX{position:fixed; top:14px; right:14px; z-index:30; width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--panel-2); color:var(--text); font-size:24px; line-height:1; cursor:pointer; display:none; touch-action:manipulation;} #dlg.on ~ #dlgX{display:block;}
  .box .shut{display:block; width:100%; margin-top:14px; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); font:inherit; font-size:16px; cursor:pointer; touch-action:manipulation;}
  .box .x{position:absolute; top:10px; right:10px; z-index:5; background:var(--panel-2); border:1px solid var(--line); color:var(--text); width:36px; height:36px; border-radius:50%; font-size:20px; cursor:pointer; line-height:1;}
  .dl2{display:grid; grid-template-columns:200px minmax(0,1fr); gap:20px; align-items:start;}
  .who{text-align:center;}
  .who img{width:180px; aspect-ratio:200/160; display:block; margin:0 auto; background:radial-gradient(circle at 50% 60%, rgba(63,224,197,.13), transparent 70%); border-radius:12px;}
  .who h2{font-size:28px; margin-top:4px;} .who .sub{color:var(--text-dim); font-size:15px;}
  .who .now{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:12px;}
  .who .now div{background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:6px;}
  .who .now b{display:block; font-family:'Oswald',sans-serif; font-size:21px; font-weight:600;} .who .now span{font-size:12.5px; color:var(--text-dim);}
  .who a{display:inline-block; margin-top:12px; color:var(--teal); font-size:14.5px;}
  .ch h3{font-size:16px; margin:0 0 4px;}
  .lg{display:flex; gap:14px; font-size:13.5px; color:var(--text-dim); margin-bottom:2px;}
  .lg i{display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px;}
  .ch svg{display:block; overflow:visible;}
  .ch{min-width:0;} .chw{display:flex; align-items:flex-start;} .chaxis{flex:none;} .chs{flex:1; min-width:0; overflow-x:auto; overflow-y:hidden; cursor:grab; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y;} .chs.drag{cursor:grabbing; user-select:none;} .chs::-webkit-scrollbar{height:6px;} .chs::-webkit-scrollbar-track{background:transparent;} .chs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18); border-radius:99px;} .chs svg{max-width:none;}
  .ch svg text{font-family:'Rajdhani','Noto Sans KR',sans-serif;}
  .tip{position:absolute; pointer-events:none; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:13.5px; display:none; white-space:nowrap; z-index:2;}
  .pl{margin-top:10px;} .pl .pb{font-size:13px; color:var(--gold); font-weight:700; margin-top:8px;}
  .pl ul{margin:2px 0 0; padding-left:18px; color:var(--text-dim); font-size:14.5px;} .pl li b{color:var(--text); font-weight:600;}
  @media(max-width:620px){
    .dl2{grid-template-columns:minmax(0,1fr); gap:10px;} .who img{width:120px;} .who h2{font-size:22px;} .box{padding:16px 12px;}
    .sum{grid-template-columns:repeat(2,1fr);}
    .row{grid-template-columns:24px 1fr 52px 44px; gap:8px; padding:7px 10px;}
    .row .bar{grid-column:2 / span 3; grid-row:2; height:8px;}
    .row.hd .bh{display:none;}
    .pc{font-size:16px;} .dl{font-size:13px;}
  }
</style>
</head>

ne koreanischen Namen mehr; die Sperrzeit dafür wurde auf 15 Sekunden verkürzt."]}, "ja": {"title": "グランドマスターのスキル・必殺技をオーロラ色に、ウノマジシャンの帽子変更、サーバーのボットの韓国語名", "items": ["グランドマスタースキンのスキルと必殺技の効果をオーロラ色に適用。ウノマジシャンの帽子は、黒い山高帽とウノカードの扇に変更。サーバーが作った部屋のボット名に韓国語の名前を適用しない仕様を変更し、その禁止時間を15秒に短縮。"]}, "zh": {"title": "宗师技能与终极技能改为极光色，Uno 魔术师帽子变更，服务器机器人韩文名称", "items": ["宗师皮肤的技能和终极技能效果应用极光色。Uno 魔术师的帽子改为黑色礼帽和 Uno 牌扇。服务器创建房间中的机器人名称不再应用韩文名，禁止应用的时间缩短为 15 秒。"]}, "pt": {"title": "Habilidades e ultimate do Grão-Mestre em cores de aurora, chapéu do Mágico do Uno alterado, nomes coreanos dos bots do servidor", "items": ["Os efeitos das habilidades e da ultimate da skin Grão-Mestre usam cores de aurora. O chapéu do Mágico do Uno virou uma cartola preta com um leque de cartas do Uno. Os nomes dos bots em salas criadas pelo servidor não recebem mais nomes coreanos; o tempo de bloqueio para aplicá-los foi reduzido para 15 segundos."]}, "ru": {"title": "Навыки и ультимейты Грандмастера в цветах сияния, новая шляпа Мага Уно, корейские имена ботов сервера", "items": ["Эффекты навыков и ультимейтов скина «Грандмастер» используют цвета сияния. Шляпа Мага Уно заменена на чёрный цилиндр с веером карт Уно. Имена ботов в комнатах, созданных сервером, больше не получают корейские имена; время запрета на их применение сокращено до 15 с."]}, "tr": {"title": "Büyük Usta yetenek ve ültimaları aurora renginde, Uno Büyücüsü şapkası değişti, sunucu botlarının Korece isimleri", "items": ["Büyük Usta skininin yetenek ve ültima efektleri aurora renklerini kullanır. Uno Büyücüsü'nün şapkası, Uno kartlarından bir yelpazeyle birlikte siyah bir silindire dönüştü. Sunucunun oluşturduğu odalardaki bot isimleri artık Korece isim almaz; bu yasağın süresi 15 saniyeye indirildi."]}, "it": {"title": "Abilità e ultimate del Gran Maestro in colori aurora, cappello del Mago Uno cambiato, nomi coreani dei bot del server", "items": ["Gli effetti di abilità e ultimate della skin Gran Maestro usano i colori dell'aurora. Il cappello del Mago Uno diventa un cilindro nero con un ventaglio di carte Uno. I nomi dei bot nelle stanze create dal server non applicano più nomi coreani; il tempo di blocco è ridotto a 15 secondi."]}, "pl": {"title": "Umiejętności i ultimate Wielkiego Mistrza w kolorach zorzy, zmieniony kapelusz Maga Uno, koreańskie nazwy botów serwera", "items": ["Efekty umiejętności i ultimate skina Wielki Mistrz używają barw zorzy. Kapelusz Maga Uno zmieniono na czarny cylinder z wachlarzem kart Uno. Nazwy botów w pokojach tworzonych przez serwer nie przyjmują już koreańskich nazw; czas blokady ich stosowania skrócono do 15 sekund."]}, "ar": {"title": "مهارات وقدرات الأستاذ الكبير الكبرى بألوان الشفق، وتغيير قبعة ساحر أونو، وأسماء الروبوتات الكورية في خوادم اللعب", "items": ["تستخدم تأثيرات مهارات وقدرات مظهر الأستاذ الكبير ألوان الشفق. صارت قبعة ساحر أونو قبعة عالية سوداء مع مروحة من بطاقات أونو. لم تعد أسماء الروبوتات في الغرف التي ينشئها الخادم تأخذ أسماء كورية؛ وخُفض وقت منع تطبيقها إلى 15 ثانية."]}}}, {"date": "2026-10-27", "build": "v436", "title": "그랜드 마스터 오로라 쇼 강화, 스킨 전용 모션", "items": ["그랜드 마스터 스킨 효과를 4000 sC 스킨보다 화려한 오로라 쇼로 교체(오로라 커튼 7장, 별가루, 나선 빛줄기, 꼬리 구슬) 그랜드 마스터 스킨 사용 중 몸 색이 오로라 색으로 변함 2000 sC 이상 스킨과 그랜드 마스터 스킨은 캐릭터 선택 창과 상점 미리보기에서 테마별 전용 모션 적용"], "tr": {"en": {"title": "Grandmaster aurora show upgraded, skin-only motions", "items": ["The Grandmaster skin effect is replaced with an aurora show more dazzling than the 4000 sC skins (7 aurora curtains, star dust, spiraling light beams, tail orbs). While using a Grandmaster skin, the body color changes to aurora colors. Skins at 2000 sC and above, and Grandmaster skins, get theme-specific motions in the character select screen and in shop previews."]}, "es": {"title": "Espectáculo de aurora del Gran Maestro mejorado, animaciones exclusivas de la skin", "items": ["El efecto de la skin Gran Maestro se sustituye por un espectáculo de aurora más llamativo que el de las skins de 4000 sC (7 cortinas de aurora, polvo de estrellas, haces de luz en espiral, orbes en la cola). Mientras usas una skin Gran Maestro, el color del cuerpo cambia a colores de aurora. Las skins de 2000 sC o más y las skins Gran Maestro reciben animaciones propias de cada tema en la pantalla de selección de personaje y en las vistas previas de la tienda."]}, "fr": {"title": "Spectacle aurore du Grand Maître amélioré, mouvements réservés aux skins", "items": ["L'effet de la skin Grand Maître est remplacé par un spectacle d'aurore plus éblouissant que celui des skins à 4000 sC (7 rideaux d'aurore, poussière d'étoiles, faisceaux de lumière en spirale, orbes de queue). Pendant l'utilisation d'une skin Grand Maître, la couleur du corps devient celle de l'aurore. Les skins à partir de 2000 sC et les skins Grand Maître reçoivent des mouvements propres à leur thème dans l'écran de sélection du personnage et dans les aperçus de la boutique."]}, "de": {"title": "Großmeister-Polarlichtshow verbessert, skinspezifische Bewegungen", "items": ["Der Effekt des Großmeister-Skins wird durch eine Polarlichtshow ersetzt, die spektakulärer ist als die 4000-sC-Skins (7 Polarlicht-Vorhänge, Sternenstaub, spiralförmige Lichtstrahlen, Schweifkugeln). Während ein Großmeister-Skin genutzt wird, wechselt die Körperfarbe zu Polarlicht-Farben. Skins ab 2000 sC und Großmeister-Skins erhalten themenspezifische Bewegungen im Charakterauswahl-Bildschirm und in Shop-Vorschauen."]}, "ja": {"title": "グランドマスターのオーロラ演出を強化、スキン専用モーション", "items": ["グランドマスタースキンの効果を、4000sCスキンより華やかなオーロラ演出に変更（オーロラカーテン7枚、星の粉、らせんの光線、尾の玉）。グランドマスタースキン使用中は体の色がオーロラ色に変化。2000sC以上のスキンとグランドマスタースキンは、キャラクター選択画面とショップのプレビューでテーマごとの専用モーションが付く。"]}, "zh": {"title": "宗师极光演出加强，皮肤专属动作", "items": ["宗师皮肤效果改为比 4000 sC 皮肤更华丽的极光演出（7 道极光帷幕、星尘、螺旋光束、尾部光球）。使用宗师皮肤时身体颜色变为极光色。2000 sC 及以上皮肤和宗师皮肤在角色选择界面和商店预览中会显示各主题专属动作。"]}, "pt": {"title": "Show de aurora do Grão-Mestre aprimorado, movimentos exclusivos das skins", "items": ["O efeito da skin Grão-Mestre é trocado por um show de aurora mais deslumbrante que o das skins de 4000 sC (7 cortinas de aurora, poeira de estrelas, feixes de luz em espiral, orbes na cauda). Ao usar uma skin Grão-Mestre, a cor do corpo muda para cores de aurora. Skins de 2000 sC ou mais e skins Grão-Mestre ganham movimentos próprios de cada tema na tela de seleção de personagem e nas prévias da loja."]}, "ru": {"title": "Усилено шоу сияния Грандмастера, фирменные движения скинов", "items": ["Эффект скина «Грандмастер» заменён шоу сияния, которое ярче, чем у скинов за 4000 sC (7 занавесов сияния, звёздная пыль, спиральные лучи света, хвостовые сферы). Пока используется скин «Грандмастер», цвет тела становится цветами сияния. Скины от 2000 sC и скины «Грандмастер» получают фирменные движения по теме в экране выбора персонажа и в предпросмотре магазина."]}, "tr": {"title": "Büyük Usta aurora gösterisi geliştirildi, skine özel hareketler", "items": ["Büyük Usta skininin efekti, 4000 sC skinlerinden daha parlak bir aurora gösterisine dönüştürüldü (7 aurora perdesi, yıldız tozu, spiral ışın demetleri, kuyruk küreleri). Büyük Usta skinini kullanırken vücut rengi aurora renklerine döner. 2000 sC ve üzeri skinler ile Büyük Usta skinleri, karakter seçim ekranında ve mağaza önizlemelerinde temaya özel hareketler kazanır."]}, "it": {"title": "Spettacolo aurora del Gran Maestro potenziato, movenze esclusive per skin", "items": ["L'effetto della skin Gran Maestro diventa uno spettacolo d'aurora più scenografico di quello delle skin da 4000 sC (7 tende d'aurora, polvere di stelle, fasci di luce a spirale, sfere di coda). Mentre si usa una skin Gran Maestro il colore del corpo diventa quello dell'aurora. Le skin da 2000 sC in su e le skin Gran Maestro ricevono movenze dedicate al tema nella schermata di selezione del personaggio e nelle anteprime del negozio."]}, "pl": {"title": "Pokaz zorzy Wielkiego Mistrza ulepszony, ruchy tylko dla skinów", "items": ["Efekt skina Wielki Mistrz zastąpiono pokazem zorzy, który jest efektowniejszy niż u skinów za 4000 sC (7 zasłon zorzy, pył gwiezdny, spiralne wiązki światła, kule na ogonie). Podczas używania skina Wielki Mistrz kolor ciała zmienia się na barwy zorzy. Skiny od 2000 sC wzwyż i skiny Wielki Mistrz dostają motywy ruchów na ekranie wyboru postaci i w podglądzie sklepu."]}, "ar": {"title": "تحسين عرض الشفق للأستاذ الكبير، وحركات خاصة بالمظاهر", "items": ["صار تأثير مظهر الأستاذ الكبير عرض شفق أبهى من مظاهر 4000 sC (7 ستائر شفق، وغبار نجوم، وأشعة ضوء حلزونية، وكرات ذيلية). أثناء استخدام مظهر الأستاذ الكبير يتحول لون الجسد إلى ألوان الشفق. تحصل المظاهر من 2000 sC فما فوق ومظاهر الأستاذ الكبير على حركات خاصة بكل موضوع في شاشة اختيار الشخصية ومعاينات المتجر."]}}}, {"date": "2026-10-27", "build": "v435", "title": "실험적 모드 3개 추가", "items": ["실험적 모드 '무궁화 꽃이 피었습니다' 추가(배틀로얄 + 빨간불에 움직이면 100 피해) 실험적 모드 '왕관 잡기' 추가(왕관을 든 사람을 쓰러뜨리면 왕관 획득, 1초에 1점, 60점 선취) 실험적 모드 '하이퍼 배틀로얄' 추가(체력 7배, 공격 속도 절반, 대쉬 무한, 궁극기 쿨타임 1/5)"], "tr": {"en": {"title": "Three experimental modes added", "items": ["Experimental mode 'Red Light, Green Light' added (Battle Royale; moving on red light deals 100 damage). Experimental mode 'Crown Grab' added (defeating the crown holder takes the crown; 1 point per second; first to 60 points wins). Experimental mode 'Hyper Battle Royale' added (7x HP, half attack speed, unlimited dash, ultimate cooldown 1/5)."]}, "es": {"title": "Añadidos 3 modos experimentales", "items": ["Añadido el modo experimental 'Luz roja, luz verde' (Battle Royale; moverse con luz roja inflige 100 de daño). Añadido el modo experimental 'Robar la corona' (derrotar al portador de la corona te da la corona; 1 punto por segundo; gana quien llegue primero a 60 puntos). Añadido el modo experimental 'Hyper Battle Royale' (vida x7, velocidad de ataque a la mitad, impulso infinito, enfriamiento de ultimate 1/5)."]}, "fr": {"title": "Trois modes expérimentaux ajoutés", "items": ["Mode expérimental « Feu rouge, feu vert » ajouté (Battle Royale ; bouger sous le feu rouge inflige 100 dégâts). Mode expérimental « Vol de couronne » ajouté (vaincre le porteur de la couronne permet de la prendre ; 1 point par seconde ; 60 points pour gagner). Mode expérimental « Hyper Battle Royale » ajouté (PV x7, vitesse d'attaque divisée par deux, dash illimité, recharge des ultimes 1/5)."]}, "de": {"title": "Drei experimentelle Modi hinzugefügt", "items": ["Experimenteller Modus „Rotlicht, Grünlicht“ hinzugefügt (Battle Royale; bei Rotlicht bewegen bringt 100 Schaden). Experimenteller Modus „Kronenraub“ hinzugefügt (wer den Kronenträger besiegt, nimmt die Krone; 1 Punkt pro Sekunde; 60 Punkte gewinnen). Experimenteller Modus „Hyper Battle Royale“ hinzugefügt (7-fache Lebenspunkte, halbe Angriffsgeschwindigkeit, unbegrenzter Dash, Ultimate-Abklingzeit 1/5)."]}, "ja": {"title": "実験的モードを3つ追加", "items": ["実験的モード「だるまさんがころんだ」を追加（バトルロイヤル。赤信号で動くと100ダメージ）。実験的モード「王冠争奪」を追加（王冠を持つ人を倒すと王冠を獲得、1秒ごとに1点、60点先取）。実験的モード「ハイパーバトルロイヤル」を追加（体力7倍、攻撃速度半分、ダッシュ無限、必殺技のクールタイム1/5）。"]}, "zh": {"title": "新增 3 个实验性模式", "items": ["新增实验性模式「红绿灯」（大逃杀；红灯时移动会造成 100 伤害）。新增实验性模式「抢王冠」（击倒持有王冠的人即可获得王冠，每秒 1 分，先到 60 分获胜）。新增实验性模式「超级大逃杀」（体力 7 倍，攻击速度减半，无限冲刺，终极技能冷却为 1/5）。"]}, "pt": {"title": "Três modos experimentais adicionados", "items": ["Modo experimental 'Luz vermelha, luz verde' adicionado (Battle Royale; mover-se na luz vermelha causa 100 de dano). Modo experimental 'Roubo da coroa' adicionado (derrotar quem está com a coroa faz você pegá-la; 1 ponto por segundo; 60 pontos para vencer). Modo experimental 'Hyper Battle Royale' adicionado (vida x7, velocidade de ataque pela metade, dash infinito, recarga da ultimate 1/5)."]}, "ru": {"title": "Добавлено 3 экспериментальных режима", "items": ["Добавлен экспериментальный режим «Красный свет, зелёный свет» («Королевская битва»; движение на красный свет наносит 100 урона). Добавлен экспериментальный режим «Захват короны» (убийство владельца короны забирает корону; 1 очко в секунду; первым до 60 очков). Добавлен экспериментальный режим «Гипер-Королевская битва» (HP ×7, скорость атаки вдвое ниже, бесконечный рывок, перезарядка ультимейта 1/5)."]}, "tr": {"title": "3 deneysel mod eklendi", "items": ["“Kırmızı ışık, yeşil ışık” deneysel modu eklendi (Battle Royale; kırmızı ışıkta hareket etmek 100 hasar verir). “Taç kapma” deneysel modu eklendi (tacı taşıyanı yenince taç sana geçer; saniyede 1 puan; 60 puana ilk ulaşan kazanır). “Hyper Battle Royale” deneysel modu eklendi (can 7 kat, saldırı hızı yarıya iner, sınırsız atılma, ültima bekleme süresi 1/5)."]}, "it": {"title": "Aggiunte 3 modalità sperimentali", "items": ["Aggiunta la modalità sperimentale « Un, due, tre, stella » (Battle Royale; muoversi con il semaforo rosso infligge 100 danni). Aggiunta la modalità sperimentale « Ruba la corona » (sconfiggere chi tiene la corona te la fa prendere; 1 punto al secondo; primo a 60 punti vince). Aggiunta la modalità sperimentale « Hyper Battle Royale » (7 volte la vita, velocità d'attacco dimezzata, scatto illimitato, ricarica delle ultimate 1/5)."]}, "pl": {"title": "Dodano 3 tryby eksperymentalne", "items": ["Dodano tryb eksperymentalny „Czerwone światło, zielone światło” (Battle Royale; ruch przy czerwonym świetle zadaje 100 obrażeń). Dodano tryb eksperymentalny „Porwanie korony” (pokonanie posiadacza korony przejmuje koronę; 1 punkt na sekundę; pierwszy do 60 punktów wygrywa). Dodano tryb eksperymentalny „Hiper Battle Royale” (7× HP, połowa szybkości ataku, nieograniczony sprint, odnowienie ultimate 1/5)."]}, "ar": {"title": "إضافة 3 أوضاع تجريبية", "items": ["إضافة الوضع التجريبي «الضوء الأحمر والأخضر» (باتل رويال؛ الحركة عند الضوء الأحمر تسبب 100 ضرر). إضافة الوضع التجريبي «خطف التاج» (هزيمة حامل التاج تأخذ منه التاج؛ نقطة واحدة في الثانية؛ أول من يصل إلى 60 نقطة يفوز). إضافة الوضع التجريبي «باتل رويال الفائق» (صحة ×7، وسرعة هجوم نصف، واندفاع غير محدود، وتهدئة القدرة الكبرى 1/5)."]}}}, {"date": "2026-10-27", "build": "v434", "title": "그랜드 마스터 오로라 스킨으로 교체", "items": ["그랜드 마스터 스킨 27종을 오로라 컨셉의 새 스킨으로 교체(불꽃, 용암, 번개 효과 제거) 그랜드 마스터 스킨으로 스킬과 궁극기를 쓰면 오로라 폭발 효과 추가 거대 점령전 봇이 32명까지 들어오도록 수정 거대 점령전에서 이미 차지한 깃발도 더 많은 사람이 서 있으면 다시 점령 가능 온라인 게임에서 방장 관련 메시지와 설명 제거 클라우드 서버는 랭크전을 우선 처리"], "tr": {"en": {"title": "Grandmaster skins replaced with aurora skins", "items": ["The 27 Grandmaster skins are replaced with new aurora-concept skins (fire, lava, and lightning effects removed). Using skills and ultimates with a Grandmaster skin adds an aurora burst effect. Giant Territory bots can now join up to 32. In Giant Territory, a flag you already hold can be captured again if more people are standing on it. Host-related messages and descriptions removed from online games. Cloud servers give priority to ranked matches."]}, "es": {"title": "Las skins Gran Maestro se reemplazan por skins de aurora", "items": ["Las 27 skins Gran Maestro se reemplazan por nuevas skins de concepto aurora (se quitan los efectos de fuego, lava y rayos). Usar habilidades y ultimates con una skin Gran Maestro añade un estallido de aurora. Los bots de Territorio gigante ahora pueden entrar hasta 32. En Territorio gigante, una bandera que ya tienes puede volver a capturarse si más personas están de pie sobre ella. Se quitan los mensajes y descripciones sobre el anfitrión en las partidas online. Los servidores en la nube dan prioridad a las partidas clasificatorias."]}, "fr": {"title": "Les skins Grand Maître remplacées par des skins aurore", "items": ["Les 27 skins Grand Maître sont remplacées par de nouvelles skins au concept aurore (effets de feu, de lave et de foudre supprimés). Utiliser une compétence ou un ultime avec une skin Grand Maître ajoute une explosion d'aurore. Les bots du Territoire géant peuvent désormais être jusqu'à 32. Dans le Territoire géant, un drapeau déjà capturé peut être repris si plus de joueurs se tiennent dessus. Messages et descriptions liés à l'hôte supprimés des parties en ligne. Les serveurs cloud priorisent les matchs classés."]}, "de": {"title": "Großmeister-Skins durch Polarlicht-Skins ersetzt", "items": ["Die 27 Großmeister-Skins werden durch neue Polarlicht-Skins ersetzt (Feuer-, Lava- und Blitzeffekte entfernt). Fähigkeiten und Ultimates mit einem Großmeister-Skin erzeugen einen Polarlicht-Ausbruch. Riesen-Gebietskampf-Bots können jetzt bis zu 32 betreten. Im Riesen-Gebietskampf kann eine bereits gehaltene Flagge erneut erobert werden, wenn mehr Spieler darauf stehen. Hinweise und Beschreibungen zum Host in Online-Spielen entfernt. Cloud-Server bevorzugen Rangspiele."]}, "ja": {"title": "グランドマスタースキン27種をオーロラ系スキンに交換", "items": ["グランドマスタースキン27種を、オーロラをコンセプトにした新しいスキンに交換（炎・溶岩・雷の効果は削除）。グランドマスタースキンでスキルと必殺技を使うとオーロラの爆発効果を追加。巨大拠点戦のボットは最大32人まで入場可能に。巨大拠点戦では、すでに占領した旗も、より多くの人が立っていれば再占領可能。オンラインゲームのホストに関するメッセージと説明を削除。クラウドサーバーはランク戦を優先処理。"]}, "zh": {"title": "宗师皮肤替换为极光皮肤", "items": ["27 款宗师皮肤替换为以极光为概念的新皮肤（移除火焰、熔岩和闪电效果）。宗师皮肤使用技能和终极技能时加入极光爆发效果。巨型占领战的机器人最多可加入 32 人。巨型占领战中，已占领的旗帜如果有更多人站上去，可以再次占领。删除在线游戏中与房主相关的消息和说明。云服务器优先处理排位赛。"]}, "pt": {"title": "Skins Grão-Mestre substituídas por skins de aurora", "items": ["As 27 skins Grão-Mestre são substituídas por novas skins com conceito de aurora (efeitos de fogo, lava e raio removidos). Usar habilidades e ultimates com uma skin Grão-Mestre adiciona uma explosão de aurora. Os bots do Território gigante agora podem entrar até 32. No Território gigante, uma bandeira já dominada pode ser retomada se mais pessoas estiverem em cima dela. Mensagens e descrições sobre o anfitrião em jogos online removidas. Servidores em nuvem dão prioridade às partidas ranqueadas."]}, "ru": {"title": "Скины «Грандмастер» заменены скинами северного сияния", "items": ["27 скинов «Грандмастер» заменены новыми скинами в концепции северного сияния (эффекты огня, лавы и молний удалены). Использование способностей и ультимейтов скином «Грандмастер» добавляет взрыв сияния. Боты в «Гигантском захвате» могут заходить до 32 человек. В «Гигантском захвате» уже захваченный флаг можно захватить снова, если на нём стоит больше игроков. Сообщения и описания, связанные с хостом, в онлайн-играх удалены. Облачные серверы приоритетно обрабатывают рейтинговые матчи."]}, "tr": {"title": "Büyük Usta skinleri aurora skinleriyle değiştirildi", "items": ["27 Büyük Usta skini aurora konseptli yeni skinlerle değiştirildi (ateş, lav ve yıldırım efektleri kaldırıldı). Büyük Usta skiniyle yetenek ve ültima kullanmak aurora patlaması ekler. Dev Bölge Kapma'daki botlar artık 32 kişiye kadar katılabilir. Dev Bölge Kapma'da zaten ele geçirilmiş bir bayrak, üzerinde daha fazla kişi duruyorsa yeniden ele geçirilebilir. Çevrimiçi oyunlardaki yönetici ile ilgili mesaj ve açıklamalar kaldırıldı. Bulut sunucuları derecelişleri önceliklendirir."]}, "it": {"title": "Skin Gran Maestro sostituite con skin aurora", "items": ["Le 27 skin Gran Maestro sono sostituite da nuove skin a tema aurora (rimossi gli effetti di fuoco, lava e fulmini). Usare abilità e ultimate con la skin Gran Maestro aggiunge un'esplosione d'aurora. I bot del Territorio gigante possono ora entrare fino a 32. Nel Territorio gigante una bandiera già occupata può essere riconquistata se più persone ci stanno sopra. Rimossi messaggi e descrizioni legati all'host nelle partite online. I server cloud danno la priorità alle partite classificate."]}, "pl": {"title": "Skiny Wielki Mistrz zastąpione skinami zorzy", "items": ["27 skinów Wielki Mistrz zastąpiono nowymi skinami w konwencji zorzy (usunięto efekty ognia, lawy i błyskawic). Użycie umiejętności i ultimate ze skinem Wielki Mistrz dodaje efekt wybuchu zorzy. Boty w Gigantycznym przejmowaniu mogą teraz wejść do 32. W Gigantycznym przejmowaniu flagę, którą już zajęto, można przejąć ponownie, jeśli stoi na niej więcej osób. Usunięto komunikaty i opisy dotyczące hosta w grach online. Serwery w chmurze priorytetowo obsługują mecze rankingowe."]}, "ar": {"title": "استبدال مظاهر الأستاذ الكبير بمظاهر الشفق", "items": ["استُبدلت مظاهر الأستاذ الكبير السبعة والعشرون بمظاهر جديدة بمفهوم الشفق (أُزيلت تأثيرات النار والحمم والبرق). استخدام المهارات والقدرات الكبرى بمظهر الأستاذ الكبير يضيف انفجار شفق. صار بإمكان روبوتات السيطرة العملاقة الدخول حتى 32. وفي السيطرة العملاقة يمكن إعادة الاستيلاء على علم سبق أن استولى عليه أحدهم إذا وقف عليه عدد أكبر من اللاعبين. أُزيلت الرسائل والوصف المتعلقان بالمضيف في الألعاب الأونلاين. تعطي خوادم السحابة الأولوية لمباريات التصنيف."]}}}, {"date": "2026-10-27", "build": "v433", "title": "그랜드 마스터 스킨 오로라 효과", "items": ["그랜드 마스터 스킨 전체를 오로라 색으로 변경(몸 뒤 오로라 커튼, 흐르는 색) 그랜드 마스터 탄환과 휘두르기에 오로라 리본 추가 서버 방장은 다른 사람이 올 수 있는 매칭에만 사용(혼자 봇과 하는 경기는 직접 방장)"], "tr": {"en": {"title": "Grandmaster skin aurora effect", "items": ["The whole Grandmaster skin changed to aurora colors (aurora curtain behind the body, flowing colors). Aurora ribbons added to Grandmaster bullets and swings. The server host is used only for matchmaking that can include other people (solo matches against bots keep you as host)."]}, "es": {"title": "Efecto aurora de la skin Gran Maestro", "items": ["Toda la skin Gran Maestro cambia a colores de aurora (cortina de aurora tras el cuerpo, colores fluidos). Se añaden cintas de aurora a las balas y los golpes del Gran Maestro. El servidor solo aloja partidas que puedan incluir a otras personas (en partidas en solitario contra bots, eres tú el anfitrión)."]}, "fr": {"title": "Effet aurore de la skin Grand Maître", "items": ["Toute la skin Grand Maître passe aux couleurs de l'aurore (rideau d'aurore derrière le corps, couleurs qui coulent). Rubans d'aurore ajoutés aux balles et aux coups du Grand Maître. Le serveur n'héberge que les matchs susceptibles d'accueillir d'autres joueurs (en solo contre des bots, c'est vous l'hôte)."]}, "de": {"title": "Polarlicht-Effekt des Großmeister-Skins", "items": ["Der gesamte Großmeister-Skin wechselt zu Polarlicht-Farben (Polarlicht-Vorhang hinter dem Körper, fließende Farben). Polarlicht-Bänder bei Geschossen und Hieben des Großmeisters. Der Server hostet nur Matches, an denen andere teilnehmen können (Solo-Matches gegen Bots hostest du selbst)."]}, "ja": {"title": "グランドマスタースキンのオーロラ効果", "items": ["グランドマスタースキン全体をオーロラ色に変更（体の後ろのオーロラカーテン、流れる色）。グランドマスターの弾と斬撃にオーロラリボンを追加。サーバーホストは他の人が参加しうるマッチングにのみ使用（ボットとの一人プレイは自分がホスト）。"]}, "zh": {"title": "宗师皮肤极光效果", "items": ["整个宗师皮肤变为极光色（身后的极光帷幕、流动的色彩）。宗师的子弹和挥击加入极光丝带。服务器房主仅用于可能有其他人加入的匹配（与机器人单人对局时由自己作为房主）。"]}, "pt": {"title": "Efeito aurora da skin Grão-Mestre", "items": ["Toda a skin Grão-Mestre passa a usar cores de aurora (cortina de aurora atrás do corpo, cores fluindo). Fitas de aurora adicionadas às balas e aos golpes do Grão-Mestre. O servidor hospeda somente partidas que possam ter outras pessoas (em partidas solo contra bots, você é o anfitrião)."]}, "ru": {"title": "Эффект северного сияния для скина «Грандмастер»", "items": ["Весь скин «Грандмастер» стал цветами северного сияния (занавес сияния за телом, переливающиеся цвета). Ленты сияния добавлены к пулям и ударам Грандмастера. Хост-сервер используется только в подборе, где могут быть другие игроки (в одиночных матчах с ботами хост — вы)."]}, "tr": {"title": "Büyük Usta skininin aurora efekti", "items": ["Büyük Usta skininin tamamı aurora renklerine döndü (vücudun arkasında aurora perdesi, akan renkler). Büyük Usta'nın mermilerine ve vuruşlarına aurora kurdeleleri eklendi. Sunucu yöneticiliği yalnızca başkalarının katılabileceği eşleşmelerde kullanılır (botlarla tek başına maçlarda yönetici sensin)."]}, "it": {"title": "Effetto aurora della skin Gran Maestro", "items": ["Tutta la skin Gran Maestro diventa dai colori dell'aurora (tenda d'aurora dietro il corpo, colori che scorrono). Nastri d'aurora aggiunti ai proiettili e ai colpi del Gran Maestro. Il server ospita solo le partite in cui possono entrare altre persone (nelle partite solo contro bot sei tu l'host)."]}, "pl": {"title": "Efekt zorzy dla skina Wielki Mistrz", "items": ["Cały skin Wielki Mistrz zmienia się w kolory zorzy (zasłona zorzy za ciałem, płynące barwy). Wstęgi zorzy przy pociskach i ciosach Wielkiego Mistrza. Serwer hostuje tylko mecze, do których mogą dołączyć inni (w meczach solo z botami hostem jesteś ty)."]}, "ar": {"title": "تأثير الشفق لمظهر الأستاذ الكبير", "items": ["صار مظهر الأستاذ الكبير كله بألوان الشفق (ستارة شفق خلف الجسد، وألوان متدفقة). أُضيفت أشرطة شفق إلى رصاصات الأستاذ الكبير وضرباته. الخادم يستضيف فقط المباريات التي قد ينضم إليها آخرون (في المباريات الفردية ضد الروبوتات تكون أنت المضيف)."]}}}, {"date": "2026-10-27", "build": "v432", "title": "모든 경기를 서버가 방장으로, 연승 보너스", "items": ["모든 온라인 경기를 서버가 방장으로 진행 서버가 바쁘면 예전처럼 내가 방장으로 진행 연승 표시(불꽃 n연승)를 방 목록과 캐릭터 공개 화면에 추가 연승 보너스 마스터리 포인트 추가(1연승 +1, 3연승 +2, 5연승 +3, 7연승 +4, 10연승 이상 +5) 승리 마스터리 포인트 4에서 2로 변경"], "tr": {"en": {"title": "All matches hosted by the server, win streak bonus", "items": ["All online matches are now hosted by the server; if the server is busy, you host as before. A win streak display (flame n-streak) is added to the room list and the character public screen. Win streak mastery point bonus added (1 win +1, 3 wins +2, 5 wins +3, 7 wins +4, 10 or more wins +5). Win mastery points changed from 4 to 2."]}, "es": {"title": "Todas las partidas las aloja el servidor, bonificación por racha de victorias", "items": ["Todas las partidas online ahora las aloja el servidor; si el servidor está ocupado, sigues alojando tú como antes. Se añade la racha de victorias (llama con n victorias seguidas) en la lista de salas y en la pantalla pública del personaje. Se añade una bonificación de puntos de maestría por racha (1 victoria +1, 3 +2, 5 +3, 7 +4, 10 o más +5). Los puntos de maestría por victoria pasan de 4 a 2."]}, "fr": {"title": "Toutes les parties hébergées par le serveur, bonus de série de victoires", "items": ["Toutes les parties en ligne sont désormais hébergées par le serveur ; si le serveur est occupé, vous hébergez comme avant. Affichage des séries de victoires (flamme n victoires) dans la liste des salons et l'écran public du personnage. Bonus de points de maîtrise pour les séries (1 victoire +1, 3 victoires +2, 5 +3, 7 +4, 10 et plus +5). Points de maîtrise par victoire passés de 4 à 2."]}, "de": {"title": "Alle Matches werden vom Server gehostet, Bonus für Siegesserien", "items": ["Alle Online-Matches werden jetzt vom Server gehostet; ist der Server ausgelastet, hostest du wie bisher selbst. Siegesserien (Flamme mit n Siegen) werden in der Raumliste und auf dem öffentlichen Charakterbildschirm angezeigt. Bonus-Meisterschaftspunkte für Serien (1 Sieg +1, 3 Siege +2, 5 +3, 7 +4, 10 oder mehr +5). Meisterschaftspunkte pro Sieg von 4 auf 2 geändert."]}, "ja": {"title": "すべての試合をサーバーがホストに、連勝ボーナス", "items": ["すべてのオンライン試合はサーバーがホストします。サーバーが混んでいる場合は、これまで通り自分がホストします。ルーム一覧とキャラクター公開画面に連勝表示（炎 n連勝）を追加。連勝ボーナスのマスタリーポイントを追加（1連勝 +1、3連勝 +2、5連勝 +3、7連勝 +4、10連勝以上 +5）。勝利のマスタリーポイントを4から2に変更。"]}, "zh": {"title": "所有对局由服务器作为房主，连胜奖励", "items": ["所有在线对局都由服务器作为房主进行；服务器繁忙时仍像以前一样由自己作为房主。房间列表和角色公开界面新增连胜显示（火焰 n 连胜）。新增连胜熟练点数奖励（1 连胜 +1，3 连胜 +2，5 连胜 +3，7 连胜 +4，10 连胜及以上 +5）。胜利熟练点数由 4 改为 2。"]}, "pt": {"title": "Todas as partidas hospedadas pelo servidor, bônus de sequência de vitórias", "items": ["Todas as partidas online agora são hospedadas pelo servidor; se o servidor estiver ocupado, você hospeda como antes. Sequência de vitórias (chama com n vitórias) adicionada na lista de salas e na tela pública do personagem. Bônus de pontos de maestria por sequência (1 vitória +1, 3 +2, 5 +3, 7 +4, 10 ou mais +5). Pontos de maestria por vitória alterados de 4 para 2."]}, "ru": {"title": "Все матчи размещает сервер, бонус за серию побед", "items": ["Все онлайн-матчи теперь размещает сервер; если сервер занят, вы размещаете матч сами, как раньше. В списке комнат и на публичном экране персонажа добавлено отображение серии побед (пламя, n побед подряд). Добавлен бонус очков мастерства за серии (1 победа +1, 3 победы +2, 5 побед +3, 7 побед +4, 10 и более +5). Очки мастерства за победу изменены с 4 на 2."]}, "tr": {"title": "Tüm maçları sunucu yönetir, galibiyet serisi bonusu", "items": ["Tüm çevrimiçi maçları artık sunucu yönetir; sunucu meşgulse eskisi gibi kendin yönetirsin. Oda listesinde ve karakterin herkese açık ekranında galibiyet serisi gösterimi (alev, n seri) eklendi. Seri için ustalık puanı bonusu eklendi (1 seri +1, 3 seri +2, 5 seri +3, 7 seri +4, 10 ve üzeri +5). Galibiyet ustalık puanı 4'ten 2'ye düşürüldü."]}, "it": {"title": "Tutte le partite ospitate dal server, bonus per serie di vittorie", "items": ["Tutte le partite online ora sono ospitate dal server; se il server è occupato, ospiti tu come prima. Serie di vittorie (fiamma con n vittorie) aggiunta nell'elenco stanze e nella schermata pubblica del personaggio. Bonus di punti maestria per serie (1 vittoria +1, 3 +2, 5 +3, 7 +4, 10 o più +5). Punti maestria per vittoria cambiati da 4 a 2."]}, "pl": {"title": "Wszystkie mecze hostuje serwer, bonus za serię zwycięstw", "items": ["Wszystkie mecze online są teraz hostowane przez serwer; gdy serwer jest zajęty, hostujesz sam jak dawniej. Dodano wyświetlanie serii zwycięstw (płomień z n wygranymi) na liście pokoi i na publicznym ekranie postaci. Dodano bonus punktów biegłości za serie (1 wygrana +1, 3 +2, 5 +3, 7 +4, 10 lub więcej +5). Punkty biegłości za wygraną zmienione z 4 na 2."]}, "ar": {"title": "الخادم يستضيف كل المباريات، ومكافأة سلسلة الانتصارات", "items": ["صار الخادم يستضيف كل المباريات الأونلاين؛ وإذا كان الخادم مشغولًا تستضيف أنت كما في السابق. أُضيف عرض سلسلة الانتصارات (لهب مع n انتصارًا متتاليًا) في قائمة الغرف وفي شاشة الشخصية العامة. أُضيفت مكافأة نقاط إتقان للسلسلة (انتصار +1، و3 انتصارات +2، و5 +3، و7 +4، و10 فأكثر +5). نقاط الإتقان للفوز من 4 إلى 2."]}}}, {"date": "2026-10-26", "build": "v431", "title": "로비 빌드 표시", "items": ["메인 화면 제목 아래 버전 옆에 빌드 번호 표시", "아래쪽 빌드·저작권 문구가 화면에 가려지던 문제 수정"], "tr": {"en": {"title": "Lobby build display", "items": ["Build number shown next to the version below the main screen title", "Fixed the bottom build and copyright text being covered on screen"]}, "es": {"title": "Visualización de la compilación en el vestíbulo", "items": ["Número de compilación mostrado junto a la versión debajo del título de la pantalla principal", "Corregido que el texto inferior de compilación y copyright quedara tapado en pantalla"]}, "fr": {"title": "Affichage du build dans le salon", "items": ["Numéro de build affiché à côté de la version sous le titre de l'écran principal", "Correction du texte de build et de copyright du bas qui était masqué à l'écran"]}, "de": {"title": "Build-Anzeige in der Lobby", "items": ["Build-Nummer neben der Version unter dem Titel des Hauptbildschirms angezeigt", "Behoben: Build- und Copyright-Text unten wurde auf dem Bildschirm verdeckt"]}, "ja": {"title": "ロビーのビルド表示", "items": ["メイン画面のタイトル下のバージョン表示の横にビルド番号を表示", "下部のビルド・著作権表記が画面に隠れる問題を修正"]}, "zh": {"title": "大厅版本显示", "items": ["在主界面标题下方的版本号旁显示版本编号", "修复屏幕底部版本号和版权文字被遮挡的问题"]}, "pt": {"title": "Exibição da build no lobby", "items": ["Número da build exibido ao lado da versão, abaixo do título da tela principal", "Corrigido o texto inferior de build e direitos autorais que ficava escondido na tela"]}, "ru": {"title": "Отображение сборки в лобби", "items": ["Номер сборки показан рядом с версией под заголовком главного экрана", "Исправлено: нижний текст со сборкой и авторскими правами перекрывался на экране"]}, "tr": {"title": "Lobi derleme gösterimi", "items": ["Ana ekran başlığının altındaki sürümün yanında derleme numarası gösterilir", "Ekranın altındaki derleme ve telif metninin ekranda kapanması düzeltildi"]}, "it": {"title": "Visualizzazione della build nella lobby", "items": ["Numero di build mostrato accanto alla versione sotto il titolo della schermata principale", "Corretto il testo in basso con build e copyright che veniva coperto sullo schermo"]}, "pl": {"title": "Wyświetlanie wersji w lobby", "items": ["Numer wersji pokazany obok wersji pod tytułem ekranu głównego", "Naprawiono zasłanianie dolnego tekstu z wersją i prawami autorskimi na ekranie"]}, "ar": {"title": "عرض الإصدار في الردهة", "items": ["يظهر رقم الإصدار بجانب النسخة أسفل عنوان الشاشة الرئيسية", "إصلاح احتجاب نص الإصدار وحقوق النشر في أسفل الشاشة"]}}}, // Balance changes, taken from the patch notes: any line with a number change (→) or naming a character or weapon
function drawLog(data){

  const names = BAL.names || [];

// ---- one character: picture on the left, win rate per measured version on the right, with the patches in between ----
const vnum = b => +(String(b).match(/v(\d+)/) || [0, 0])[1];
const SERIES = [[BAL.nmaps > 1 ? '승률' : '평지', 'var(--teal)', 0]];
function charNotes(r){
  const out = [];
  for (const n of NOTES){
    const L = SI18N.pick(n), src = n.items || [], tri = L.items || src;
    const items = src.map((t, i) => [t, tri[i] || t]).filter(([t]) => !t.includes('봇') && (t.includes(r.name) || (r.weapon && t.includes(r.weapon)))).map(p => p[1]);

let PATCH_ONLY = true; try{ if(localStorage.getItem('ffBalPatchOnly') === '0') PATCH_ONLY = false; }catch(e){}      // "패치 때만 보기": only the builds in which this character itself was patched (default on)
function chartSvg(r, notes){
  const B = BAL.hist || [], H = r.hist || [];
  if (B.length < 2) return '<p class="muted">아직 측정이 한 번뿐이에요.</p>';
  const W = innerWidth < 620 ? Math.max(260, Math.min(340, innerWidth - 60)) : 560, Ht = innerWidth < 620 ? 240 : 280, l = 40, rt = 58, pad = 12, t = 14, bt = 40, ih = Ht - t - bt;
  const patchedAt = i => i > 0 && notes.some(n => n.v > vnum(B[i - 1]) && n.v <= vnum(B[i]));
  let IDX = B.map((b, i) => i);
  const has = i => H[i] && H[i][0] != null, first = B.findIndex((b, i) => has(i));
  if (PATCH_ONLY){ IDX = IDX.filter(i => (i === first || patchedAt(i)) && has(i)); if (has(B.length - 1) && IDX[IDX.length - 1] !== B.length - 1) IDX.push(B.length - 1); if (!IDX.length) IDX = B.map((b, i) => i); }      // (builds before this character was measured get no empty column)      // "패치 때만 보기": only the first build, the builds with a patch of this character and the newest one get a column
  const POS = {}; IDX.forEach((i, k) => { POS[i] = k; });
  const VIS = 8, step = (W - l - rt - pad) / (Math.min(VIS, Math.max(2, IDX.length)) - 1), PW = Math.round(pad + step * (IDX.length - 1) + rt);      // the newest 8 columns fill the view, the rest wait to the left (drag or swipe to see them)
  const X = i => pad + step * POS[i];
  // the vertical range follows the data (not a fixed 0-100) so a 30-point drop actually looks like one
  const vals = []; for (const i of IDX) if (H[i]) for (const [, , k] of SERIES) if (H[i][k] != null) vals.push(H[i][k]);
  let lo = vals.length ? Math.floor((Math.min(...vals) - 6) / 10) * 10 : 0, hi = vals.length ? Math.ceil((Math.max(...vals) + 6) / 10) * 10 : 100;
  lo = Math.max(0, lo); hi = Math.min(100, hi); if (hi - lo < 30){ const c = (hi + lo) / 2; lo = Math.max(0, Math.round((c - 15) / 10) * 10); hi = Math.min(100, lo + 30); lo = Math.max(0, hi - 30); }
  const Y = v => t + ih * (1 - (v - lo) / (hi - lo)), TICKS = []; for (let v = lo; v <= hi; v += (hi - lo > 60 ? 25 : 10)) TICKS.push(v);
  let g = '', ax = '';
  for (const v of TICKS) ax += '<text x="' + (l - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="12" fill="var(--text-dim)">' + v + '%</text>';
  for (const v of TICKS.concat(lo < 50 && hi > 50 && TICKS.indexOf(50) < 0 ? [50] : [])) g += '<line x1="0" x2="' + PW + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="' + (v === 50 ? 'rgba(255,255,255,.35)' : 'rgba(255,255,255,.08)') + '" stroke-width="1"' + (v === 50 ? ' stroke-dasharray="4 4"' : '') + '/>';
  IDX.forEach(i => { const b = B[i];
    const patched = patchedAt(i);
    if (patched) g += '<line x1="' + X(i) + '" x2="' + X(i) + '" y1="' + t + '" y2="' + (t + ih) + '" stroke="rgba(255,211,77,.45)" stroke-width="2"/><text x="' + X(i) + '" y="' + (t - 3) + '" text-anchor="middle" font-size="12" font-weight="700" fill="var(--gold)">패치</text>';
    g += '<text x="' + X(i) + '" y="' + (Ht - bt + 20) + '" text-anchor="middle" font-size="13" fill="var(--text-dim)">' + short(b) + '</text>';
  });
  const ends = [];
  for (const [label, col, k] of SERIES){
    const all = H.map((h, i) => h && h[k] != null && POS[i] !== undefined ? [X(i), Y(h[k]), h[k], i] : null).filter(Boolean);
    const pts = PATCH_ONLY ? all
      : all.filter((p, j) => j === 0 || j === all.length - 1 || Math.abs(p[2] - all[j - 1][2]) >= 0.05);      // a measurement that changed nothing is not drawn
    if (!pts.length) continue;
    g += '<polyline fill="none" stroke="' + col + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="' + pts.map(p => p[0] + ',' + p[1]).join(' ') + '"/>';
    pts.forEach(p => { g += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4.5" fill="' + col + '" stroke="var(--panel)" stroke-width="2"/>'; });
    const last = pts[pts.length - 1]; ends.push({x: last[0] + 10, y: last[1] + 4, v: last[2]});
  }
  if (ends.length === 2 && Math.abs(ends[0].y - ends[1].y) < 15){ const [a, b] = ends[0].y <= ends[1].y ? ends : [ends[1], ends[0]], m = (a.y + b.y) / 2; a.y = m - 7.5; b.y = m + 7.5; }
  for (const e of ends) g += '<text x="' + e.x + '" y="' + e.y + '" font-size="13" font-weight="700" fill="var(--text)">' + e.v.toFixed(1) + '%</text>';
  IDX.forEach(i => { g += '<rect data-i="' + i + '" x="' + (X(i) - step / 2) + '" y="' + t + '" width="' + step + '" height="' + ih + '" fill="transparent"/>'; });
  return '<div class="chw"><svg class="chaxis" width="' + l + '" height="' + Ht + '" viewBox="0 0 ' + l + ' ' + Ht + '" aria-hidden="true">' + ax + '</svg><div class="chs"><svg width="' + PW + '" height="' + Ht + '" viewBox="0 0 ' + PW + ' ' + Ht + '" role="img" aria-label="' + esc(r.name) + '">' + g + '</svg></div></div>';
}

  { const sh=document.createElement('button'); sh.className='shut'; sh.textContent='닫기'; sh.onclick=closeChar; document.getElementById('box').appendChild(sh); }
  document.getElementById('patchOnly').onclick = () => { PATCH_ONLY = !PATCH_ONLY; try{ localStorage.setItem('ffBalPatchOnly', PATCH_ONLY ? '1' : '0'); }catch(e){} openChar(id); };
  const tip = document.getElementById('tip'), ch = document.querySelector('#box .ch');

    rc.addEventListener('pointerenter', () => { const i = +rc.dataset.i, h = (r.hist || [])[i] || []; tip.innerHTML = '<b>' + esc(short(B[i])) + '</b><br>' + (h[0] == null ? '-' : h[0].toFixed(1) + '%'); tip.style.display = 'block';
      const a = rc.getBoundingClientRect(), c = ch.getBoundingClientRect(); tip.style.left = Math.min(c.width - tip.offsetWidth, Math.max(0, a.left - c.left + a.width / 2 - tip.offsetWidth / 2)) + 'px'; tip.style.top = (a.top - c.top + 24) + 'px'; });

  const cs = document.querySelector('#box .chs');
  if (cs){ cs.scrollLeft = cs.scrollWidth;      // start at the newest builds; drag with the mouse (a finger already scrolls it)
    let sx = 0, sl = 0, on = false;
    cs.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; on = true; sx = e.clientX; sl = cs.scrollLeft; cs.classList.add('drag'); cs.setPointerCapture(e.pointerId); });
