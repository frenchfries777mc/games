<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stickseum</title>
<meta name="description" content="Stickseum 캐릭터별 승률과 패치마다 바뀐 수치">
<meta name="theme-color" content="#0a0b0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://frenchfries777mc.github.io/games/ff-lang.js"></script>
<script src="site-i18n.js"></script>
<style>
  :root{ --bg:#0a0b0f; --bg2:#0e1420; --panel:#121825; --panel-2:#171f2e; --line:#232c3d; --text:#e8eaf0; --text-dim:#8893a6; --red:#ff4d5e; --teal:#3fe0c5; --gold:#ffd34d; --green:#4ade80; }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); min-height:100%;}
  body{ font-family:'Rajdhani','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; font-size:17px; line-height:1.55;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    background-image: radial-gradient(ellipse 900px 500px at 20% -10%, rgba(255,77,94,.12), transparent 60%), radial-gradient(ellipse 700px 500px at 100% 10%, rgba(63,224,197,.09), transparent 55%), linear-gradient(var(--bg), var(--bg2)); background-attachment:fixed; }
  .wrap{max-width:980px; margin:0 auto; padding:0 18px;}
  h1,h2,h3{font-family:'Oswald','Noto Sans KR',sans-serif; margin:0; letter-spacing:.01em;}
  a{color:var(--teal);}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:22px 0 10px; flex-wrap:wrap;}
  .wordmark{font-family:'Oswald',sans-serif; font-weight:600; font-size:21px; letter-spacing:.03em; color:var(--text); text-decoration:none;}
  .wordmark b{color:var(--red); font-weight:700;}
  .topbar nav{display:flex; gap:4px; overflow-x:auto; max-width:100%;}
  .topbar nav a{color:var(--text-dim); text-decoration:none; font-size:15px; padding:6px 10px; border-radius:7px; white-space:nowrap; border:1px solid transparent;}
  .topbar nav a:hover{color:var(--text);}
  .topbar [data-ff-account]{display:inline-flex; align-items:center; white-space:nowrap;}
  .topbar{align-items:flex-start; flex-wrap:nowrap;} .topbar .right{row-gap:8px;} .topbar nav{order:3; flex-basis:100%; justify-content:flex-end; flex-wrap:wrap; overflow-x:visible;}   /* not enough room for one row: the menu goes under the language and account buttons */
  .topbar nav a.on{color:var(--text); background:var(--panel); border:1px solid var(--line);}
  .langSel{background:var(--panel); color:var(--text-dim); border:1px solid var(--line); border-radius:7px; padding:5px 8px; font:inherit; font-size:14px; cursor:pointer; margin-left:6px;}
  .langSel:hover{color:var(--text); border-color:var(--teal);}
  .topbar .right{display:flex; align-items:center; gap:4px; max-width:100%; min-width:0; flex-wrap:wrap; justify-content:flex-end;}   /* no overflow here: it would clip the account menu */
  .head{padding:22px 0 4px;}
  .head h1{font-size:clamp(32px,6vw,48px); font-weight:700; text-transform:uppercase; line-height:1.05;}
  .head p{color:var(--text-dim); margin:10px 0 0; font-size:17px; max-width:62ch;}
  .rule{height:2px; background:linear-gradient(90deg,var(--red),transparent 40%); margin:9px 0 18px; border:0;}
  section{margin-top:34px;}
  section h2{font-size:23px; text-transform:uppercase; letter-spacing:.03em;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 14px;}
  .chip{background:var(--panel); border:1px solid var(--line); color:var(--text-dim); border-radius:99px; padding:6px 14px; font:inherit; font-size:15px; font-weight:600; cursor:pointer;}
  .chip:hover{color:var(--text);}
  .chip.on{background:var(--teal); border-color:var(--teal); color:#07201b;}
  input.search{background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:99px; padding:6px 14px; font:inherit; font-size:15px; min-width:0; flex:1 1 160px; max-width:260px;}
  input.search:focus{outline:none; border-color:var(--teal);}
  .muted{color:var(--text-dim);}
  .err{color:var(--red); padding:14px 0;}
  footer{margin:56px 0 40px; color:var(--text-dim); font-size:14px; border-top:1px solid var(--line); padding-top:18px;}
  @media(max-width:620px){ .wrap{padding:0 16px;} .topbar{padding-top:16px;} .topbar nav a{padding:6px 8px; font-size:14px;} }
  .sum{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:18px;}
  .sum .panel{padding:12px 14px;}
  .sum b{display:block; font-family:'Oswald','Noto Sans KR',sans-serif; font-size:24px; font-weight:600; line-height:1.15;}
  .sum span{color:var(--text-dim); font-size:14px;}
  .tbl{padding:6px 0;}
  .row{display:grid; grid-template-columns:34px minmax(120px,170px) 1fr 70px 64px; gap:10px; align-items:center; padding:7px 14px; border-bottom:1px solid var(--line); text-decoration:none; color:var(--text);}
  .row:last-child{border-bottom:0;}
  a.row:hover{background:var(--panel-2);}
  .row.hd{color:var(--text-dim); font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  .rk{font-family:'Oswald',sans-serif; color:var(--text-dim); font-size:17px; text-align:right;}
  .nm{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar{height:12px; background:var(--panel-2); border-radius:99px; position:relative; overflow:hidden;}
  .bar i{position:absolute; left:0; top:0; bottom:0; border-radius:99px;}
  .bar .mid{position:absolute; left:50%; top:-2px; bottom:-2px; width:2px; background:rgba(255,255,255,.25);}
  .pc{font-family:'Oswald',sans-serif; font-size:18px; text-align:right;}
  .dl{font-size:14px; text-align:right; color:var(--text-dim);}
  .up{color:var(--green);} .down{color:var(--red);}
  .how{padding:14px 18px; color:var(--text-dim); font-size:15.5px;}
  .how ul{margin:6px 0 0; padding-left:20px;} .how li{margin:4px 0;}
  .note{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 16px 10px; margin-bottom:10px;}
  .note .nh{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px;}
  .note .nt{font-weight:700; font-size:17px;} .note .nd{color:var(--text-dim); font-size:13.5px;}
  .note ul{margin:6px 0 0; padding-left:20px; color:var(--text-dim); font-size:15.5px;} .note li{margin:3px 0;}
  .note li b{color:var(--text); font-weight:600;}
  .warn{background:rgba(255,211,77,.08); border:1px solid rgba(255,211,77,.35); border-radius:10px; padding:10px 14px; font-size:15px; margin-top:12px;}
  button.row{width:100%; background:none; border:0; border-bottom:1px solid var(--line); font:inherit; cursor:pointer; text-align:left;}
  button.row:hover{background:var(--panel-2);}
  #dlg{position:fixed; inset:0; background:rgba(5,6,10,.72); display:none; align-items:center; justify-content:center; padding:16px; z-index:10;}
  #dlg.on{display:flex;}
  .box{background:var(--panel); border:1px solid var(--line); border-radius:14px; width:min(860px,100%); max-height:calc(100vh - 32px); overflow:auto; position:relative; padding:20px 22px 20px;} .box{scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent;} .box::-webkit-scrollbar{width:6px;} .box::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18); border-radius:99px;}
  .box .x{position:absolute; top:10px; right:10px; z-index:5; background:var(--panel-2); border:1px solid var(--line); color:var(--text); width:36px; height:36px; border-radius:50%; font-size:20px; cursor:pointer; line-height:1;}
  .dl2{display:grid; grid-template-columns:200px minmax(0,1fr); gap:20px; align-items:start;}
  .who{text-align:center;}
  .who img{width:180px; aspect-ratio:200/160; display:block; margin:0 auto; background:radial-gradient(circle at 50% 60%, rgba(63,224,197,.13), transparent 70%); border-radius:12px;}
  .who h2{font-size:28px; margin-top:4px;} .who .sub{color:var(--text-dim); font-size:15px;}
  .who .now{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:12px;}
  .who .now div{background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:6px;}
  .who .now b{display:block; font-family:'Oswald',sans-serif; font-size:21px; font-weight:600;} .who .now span{font-size:12.5px; color:var(--text-dim);}
  .who a{display:inline-block; margin-top:12px; color:var(--teal); font-size:14.5px;}
  .ch h3{font-size:16px; margin:0 0 4px;}
  .lg{display:flex; gap:14px; font-size:13.5px; color:var(--text-dim); margin-bottom:2px;}
  .lg i{display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px;}
  .ch svg{display:block; overflow:visible;}
  .ch{min-width:0;} .chw{display:flex; align-items:flex-start;} .chaxis{flex:none;} .chs{flex:1; min-width:0; overflow-x:auto; overflow-y:hidden; cursor:grab; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y;} .chs.drag{cursor:grabbing; user-select:none;} .chs::-webkit-scrollbar{height:6px;} .chs::-webkit-scrollbar-track{background:transparent;} .chs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18); border-radius:99px;} .chs svg{max-width:none;}
  .ch svg text{font-family:'Rajdhani','Noto Sans KR',sans-serif;}
  .tip{position:absolute; pointer-events:none; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:13.5px; display:none; white-space:nowrap; z-index:2;}
  .pl{margin-top:10px;} .pl .pb{font-size:13px; color:var(--gold); font-weight:700; margin-top:8px;}
  .pl ul{margin:2px 0 0; padding-left:18px; color:var(--text-dim); font-size:14.5px;} .pl li b{color:var(--text); font-weight:600;}
  @media(max-width:620px){
    .dl2{grid-template-columns:minmax(0,1fr); gap:10px;} .who img{width:120px;} .who h2{font-size:22px;} .box{padding:16px 12px;}
    .sum{grid-template-columns:repeat(2,1fr);}
    .row{grid-template-columns:24px 1fr 52px 44px; gap:8px; padding:7px 10px;}
    .row .bar{grid-column:2 / span 3; grid-row:2; height:8px;}
    .row.hd .bh{display:none;}
    .pc{font-size:16px;} .dl{font-size:13px;}
  }
</style>
</head>

  <section>
    <h2>측정 방법</h2><hr class="rule">

</div>

eux croisés en chemin sont combattus sur place"]}, "de": {"title": "Clanname und Tag ändern, bessere Capture-the-Flag-Bots", "items": ["Der Clanleiter kann Clannamen und Tag jetzt nach der Gründung ändern (Bildschirm „Mein Clan“; supabase-clan-rename.sql muss ausgeführt werden)", "Capture the Flag: keine Bots mehr, die nur in der Basis stehen; die nächsten Bots stellen sich Gegnern entgegen, die auf unsere Seite kommen, und Gegner auf dem Weg werden sofort bekämpft"]}, "ja": {"title": "クラン名とタグの変更、旗取りボットの改善", "items": ["クラン作成後も、クランリーダーがクラン名とタグを変更できるように（マイクラン画面、supabase-clan-rename.sql の実行が必要）", "旗取り：基地に立っているだけのボットをなくし、自陣側に来る相手を近いボットが迎え撃つ（道中で会った相手もその場で戦う）"]}}}, {"date": "2026-10-17", "build": "v266", "title": "깃발 뺏기 봇 수비 개선", "items": ["깃발 뺏기에서 상대가 우리 기지에 다가오면 기지에 가장 가까운 봇들이 맞서 싸움 (상대 수만큼, 멀리 있는 봇은 부르지 않음)", "깃발 뺏기에서 기지에 틀어박혀 있던 봇을 줄여 4명 이상일 때 1명만 기지 근처를 돌아다니며 지킴"], "tr": {"en": {"title": "Capture the Flag bots defend better", "items": ["In Capture the Flag, when enemies come near our flag, the bots nearest to it go and meet them (as many as there are enemies; bots far away are not called back)", "Fewer bots sit at the base: in teams of 4 or more only one guards, walking around near the flag"]}, "es": {"title": "Los bots de Capturar la bandera defienden mejor", "items": ["En Capturar la bandera, cuando hay enemigos cerca de nuestra bandera, los bots más cercanos salen a su encuentro (tantos como enemigos; los bots lejanos no son llamados)", "Menos bots se quedan en la base: en equipos de 4 o más solo uno vigila, paseando cerca de la bandera"]}, "fr": {"title": "Les bots de Capture du drapeau défendent mieux", "items": ["En Capture du drapeau, quand des ennemis approchent de notre drapeau, les bots les plus proches vont à leur rencontre (autant que d’ennemis ; les bots éloignés ne sont pas rappelés)", "Moins de bots restent à la base : dans les équipes de 4 ou plus, un seul garde et se promène près du drapeau"]}, "de": {"title": "Capture-the-Flag-Bots verteidigen besse     + '<div class="now"><div><b>' + r.wr.toFixed(1) + '%</b><span>승률</span></div></div>'
    + '<a href="codex.html#' + id + '">도감에서 보기 →</a></div>'
    + '<div class="ch" style="position:relative"><h3>버전별 승률</h3><button id="patchOnly" class="btn" style="margin:0 0 8px; padding:4px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.3); background:' + (PATCH_ONLY ? 'rgba(63,224,197,.3)' : 'transparent') + '; color:inherit; font-size:14px;">패치 때만 보기: ' + (PATCH_ONLY ? '켜짐' : '꺼짐') + '</button>'
    + chartSvg(r, notes) + '<div class="tip" id="tip"></div>'
    + '<div class="pl">' + (pl ? '<h3>이 캐릭터의 패치</h3>' + pl : '<p class="muted">측정하는 동안 이 캐릭터의 수치는 바뀌지 않았어요.</p>') + '</div></div></div>';
  document.querySelector('#box .x').onclick = closeChar;
  document.getElementById('patchOnly').onclick = () => { PATCH_ONLY = !PATCH_ONLY; try{ localStorage.setItem('ffBalPatchOnly', PATCH_ONLY ? '1' : '0'); }catch(e){} openChar(id); };
  const tip = document.getElementById('tip'), ch = document.querySelector('#box .ch');
  document.querySelectorAll('#box svg rect[data-i]').forEach(rc => {
    rc.addEventListener('pointerenter', () => { const i = +rc.dataset.i, h = (r.hist || [])[i] || []; tip.innerHTML = '<b>' + esc(short(B[i])) + '</b><br>' + (h[0] == null ? '-' : h[0].toFixed(1) + '%'); tip.style.display = 'block';
      const a = rc.getBoundingClientRect(), c = ch.getBoundingClientRect(); tip.style.left = Math.min(c.width - tip.offsetWidth, Math.max(0, a.left - c.left + a.width / 2 - tip.offsetWidth / 2)) + 'px'; tip.style.top = (a.top - c.top + 24) + 'px'; });
    rc.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
  });
  dlg.classList.add('on'); document.getElementById('box').scrollTop = 0;
  const cs = document.querySelector('#box .chs');
  if (cs){ cs.scrollLeft = cs.scrollWidth;      // start at the newest builds; drag with the mouse (a finger already scrolls it)
    let sx = 0, sl = 0, on = false;
    cs.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; on = true; sx = e.clientX; sl = cs.scrollLeft; cs.classList.add('drag'); cs.setPointerCapture(e.pointerId); });
    cs.addEventListener('pointermove', e => { if (on) cs.scrollLeft = sl - (e.clientX - sx); });
    const end = () => { on = false; cs.classList.remove('drag'); };
    cs.addEventListener('pointerup', end); cs.addEventListener('pointercancel', end); }
}
function closeChar(){ history.replaceState(null, '', location.pathname + location.search); document.getElementById('dlg').classList.remove('on'); }
document.getElementById('dlg').addEventListener('click', e => { if (e.target.id === 'dlg') closeChar(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeChar(); });
window.addEventListener('hashchange', () => openChar(location.hash.slice(1)));
fetch('patchnotes.json', {cache: 'no-cache'}).then(r => r.ok ? r.json() : Promise.reject()).then(drawLog).catch(() => drawLog(NOTES_FALLBACK));
</script>
