function note(f,t0,d,type,v){

let MAP=MAPS[0],PTS=[],CUM=[],TOTAL=0,BLOCK=new Set();
function setMap(i){
  MAP=MAPS[i]||MAPS[0];
  const wp=MAP.wp;
  PTS=wp.map(p=>({x:p[0]*TS+30,y:MY+p[1]*TS+30}));
  if(PTS[PTS.length-1].x<900)PTS.push({x:900,y:PTS[PTS.length-1].y});
  CUM=[0];for(let k=1;k<PTS.length;k++)CUM.push(CUM[k-1]+Math.hypot(PTS[k].x-PTS[k-1].x,PTS[k].y-PTS[k-1].y));
  TOTAL=CUM[CUM.length-1];
  BLOCK=new Set();
  for(let k=1;k<wp.length;k++){
    const[c1,r1]=wp[k-1],[c2,r2]=wp[k];
    for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++)for(let r=Math.min(r1,r2);r<=Math.max(r1,r2);r++)BLOCK.add(c+','+r);
  }
  for(const o of MAP.obs)BLOCK.add(o[0]+','+o[1]);
  for(let r=3;r<=7;r++)BLOCK.add('15,'+r);
}
function pathAt(d){
  if(d<=0)return PTS[0];
  if(d>=TOTAL)return PTS[PTS.length-1];
  let i=1;while(CUM[i]<d)i++;
  const t=(d-CUM[i-1])/(CUM[i]-CUM[i-1]);
  return{x:PTS[i-1].x+(PTS[i].x-PTS[i-1].x)*t,y:PTS[i-1].y+(PTS[i].y-PTS[i-1].y)*t};
}

function waveGroups(n){

  if(n>20&&n%10===0){add('bossX',1,1,0);add('egg',25+n,.6,2);add('carrot',n,.8,6);add('onion',Math.floor(n/4),1.5,10);add('ice',Math.floor(n/6),2,12);return L}

  if(n===10){add('bossM',1,1,0);add('egg',10,1.2,3);add('carrot',6,1.4,6);add('onion',2,2.5,9);return L}

      G.feast=6;ring(160,'140,255,140',.7);fx(t.x,t.y,'#fff3a0',30,{v0:60,v1:200,l0:.5,l1:1,r0:2,r1:5});
      for(const o of G.towers)fx(o.x,o.y-10,'#8dff8d',6,{a:-1.57,spread:.6,v0:30,v1:80,l0:.5,l1:.9,r0:2,r1:4,g:-20});break;
    case 'pressure':releasePressure(t,inr);break;
  }
  G.shake=Math.max(G.shake,.35);sfx(260,.35,'sawtooth',.3,300);say(t.x,t.y-46,pick(SKQ[t.type]));
}

/* ===== 명령 (방장/혼자는 직접 실행, 참가자는 방장에게 전송) ===== */
function tell(pid,m){if(pid===0)toast(m);else{const c=NET.conns[pid];if(c)try{c.send({t:'toast',m})}catch(e){}}}
function exec(c,pid){
  if(!G||G.over)return;
  const say=m=>tell(pid,m);
  if(c.k==='place'){
    if(!TD[c.type]||!G.unl.towers[c.type])return;
    if(BLOCK.has(c.c+','+c.r)||towerAt(c.c,c.r)){say('여긴 설치할 수 없어요');return}
    const d=TD[c.type];
    if(G.coins<d.cost){say('코인이 부족해요');return}
    G.coins-=d.cost;const t=addTower(c.type,c.c,c.r);sfx(500,.1,'triangle',.3,200);burst(t.x,t.y+10,'#d8c8a8',8,60);
  }else if(c.k==='up'){const t=towerAt(c.c,c.r);if(t&&RES.includes(c.res))upgrade(t,c.res,say)}
  else if(c.k==='rc'){const t=towerAt(c.c,c.r);if(t&&RCP[c.id])applyRecipe(t,c.id,say)}
  else if(c.k==='sell'){const t=towerAt(c.c,c.r);if(t){G.coins+=Math.floor(t.spent*.7);G.towers=G.towers.filter(o=>o!==t);sfx(300,.1,'square',.2,-100)}}
  else if(c.k==='skill'){const t=towerAt(c.c,c.r);if(t)useSkill(t,say)}
  else if(c.k==='start'){if(G.active)say('웨이브가 진행 중이에요');else{const b=earlyBonus();if(b>0){G.coins+=b;gtoast('일찍 시작 보너스! 코인 +'+b)}startWave()}}
  else if(c.k==='ping'){
    if(!G.coop)return;const x=+c.x,y=+c.y;
    if(!(x>=0&&x<=W&&y>=MY&&y<MY+ROWS*TS))return;
    if(G.t-(G.pcd[pid]===undefined?-9:G.pcd[pid])<1.2)return;
    G.pcd[pid]=G.t;const ty=c.p===1?1:0;addPing(x,y,pid,ty);sfx(ty?520:760,.12,'triangle',.25,ty?-200:200);emit({k:'pg',x:q(x),y:q(y),p:pid,ty});
  }
  else if(c.k==='speed'){if(pid===0)G.speed=G.speed===1?2:1;else say('배속은 방장만 바꿀 수 있어요')}
}
function earlyBonus(){return G.wave>0&&!G.active?Math.floor(Math.max(0,G.next))*2:0}
function act(c){
  if(NET.mode==='client'){try{NET.conn.send({t:'cmd',c})}catch(e){}}
  else exec(c,0);
}

/* ===== 업데이트 ===== */
function updateSim(dt){
  if(G.feast>0)G.feast-=dt;
  if(!G.active&&!G.over){G.next-=dt;if(G.next<=0)startWave()}
  if(G.active){
    G.waveT+=dt;
    while(G.spawn.length&&G.spawn[0].t<=G.waveT)spawnUnit(G.spawn.shift().type);
  }
  for(let i=0;i<G.enemies.length;i++){
    const e=G.enemies[i];if(e.dead)continue;
    let spd=e.sp;
    if(e.slowT>0){e.slowT-=dt;spd*=1-(isBoss(e)?e.slowV*.5:e.slowV)}
    if(e.hasteT>0){e.hasteT-=dt;spd*=1.6}
    if(e.stopT>0){e.stopT-=dt;spd=0}
    e.flash=Math.max(0,e.flash-dt);if(e.hblock>0)e.hblock-=dt;
    if(Math.random()<dt*.015&&G.says.length<5&&e.x>20&&e.x<880)say(e.x,e.y-e.r-22,pick(EQ));
    if(e.type==='potato'){
      e.jumpCd-=dt;
      if(e.jump>0){e.jump-=dt;spd+=300;e.jy=-Math.sin((1-Math.max(0,e.jump)/.35)*Math.PI)*28}
      else{e.jy=0;if(e.jumpCd<=0&&e.stopT<=0){e.jump=.35;e.jumpCd=3.5;fx(e.x,e.y+10,'#d8c8a8',6,{v0:30,v1:90,l0:.2,l1:.4})}}
    }
    if(e.type==='boss_ramen'){
      e.spawnCd-=dt;
      if(e.dash>0){e.dash-=dt;spd*=3;if(Math.random()<dt*30)fx(e.x,e.y,'rgba(255,255,255,.7)',1,{v0:10,v1:40,g:-30,l0:.4,l1:.7,r0:4,r1:7})}
      else if(e.spawnCd<=0){
        e.spawnCd=6;e.dash=1.3;
        for(const t of G.towers)if(dist(t,e)<140){t.stun=2;t.stunK='fire'}
        G.rings.push({x:e.x,y:e.y,r:140,t:.4,mt:.4,col:'255,200,120'});fx(e.x,e.y,'#fff3d0',20,{v0:60,v1:200,g:-30,l0:.5,l1:.9,r0:4,r1:8});sfx(140,.3,'sawtooth',.3,-60);
      }
    }
    if(e.type==='boss_cake'){
      e.spawnCd-=dt;
      if(e.spawnCd<=0){e.spawnCd=7;e.shield=Math.min(e.smax,e.shield+500);for(let k=0;k<2;k++)spawnEnemy('slice',Math.max(0,e.d-20-k*20));G.rings.push({x:e.x,y:e.y,r:80,t:.4,mt:.4,col:'255,180,220'});sfx(520,.2,'triangle',.3,200)}
    }
    if(e.type==='ice'){
      e.spawnCd-=dt;
      if(e.spawnCd<=0){
        e.spawnCd=4.5;
        let best=null,bd=150;for(const t of G.towers)if(t.stun<=0){const dd=dist(t,e);if(dd<bd){bd=dd;best=t}}
        if(best){best.stun=2.5;best.stunK='ice';G.rings.push({x:best.x,y:best.y,r:40,t:.4,mt:.4,col:'160,220,255'});fx(best.x,best.y,'#e6f7ff',14,{v0:40,v1:120,l0:.4,l1:.8,r0:2,r1:5});sfx(900,.15,'sine',.2,-400)}
      }
    }
    e.d+=spd*dt;
    if(e.burn>0){e.burn-=dt;DSRC=e.bsrc||null;damage(e,e.burnDps*dt);DSRC=null;if(e.dead)continue}
    if(e.poison>0){e.poison-=dt;DSRC=e.psrc||null;damage(e,e.poisonDps*dt);DSRC=null;if(e.dead)continue}
    if(e.type==='mush'){for(const o of G.enemies)if(o!==e&&!o.dead&&o.hblock<=0&&o.hp<o.max&&dist(o,e)<90)o.hp=Math.min(o.max,o.hp+7*dt)}
    if(e.type==='boss'){e.spawnCd-=dt;if(e.spawnCd<=0){e.spawnCd=6;for(let k=0;k<3;k++)spawnEnemy('egg',Math.max(0,e.d-25-k*18));sfx(150,.2,'sawtooth',.25,60)}}
    if(e.d>=TOTAL){e.dead=true;G.hp-=(e.mid?5:(ED[e.type].leak||1));G.hit=.3;sfx(120,.2,'sawtooth',.3,-60);if(Math.random()<.5)say(860,300,pick(['내 반찬!','문 닫아!','전기세!','앗 차가워!']));continue}
    setPos(e);
  }
  const A=G.enemies.filter(e=>!e.dead);
  updTowers(dt,A);
  for(const p of G.proj){
    DSRC=p.tw.type;
    (p.trail=p.trail||[]).push({x:p.x,y:p.y});if(p.trail.length>8)p.trail.shift();
    if(p.target&&!p.target.dead){p.tx=p.target.x;p.ty=p.target.y}
    const dx=p.tx-p.x,dy=p.ty-p.y,dd=Math.hypot(dx,dy),step=p.sp*dt;
    p.ang=Math.atan2(dy,dx);
    if(dd<=step+4){
      if(p.target&&!p.target.dead){damage(p.target,p.dmg);if(!p.target.dead)applyStatus(p.target,p.tw)}
      fx(p.tx,p.ty,p.bread?'#e0b070':'#ffffff',8,{line:true,v0:100,v1:260,l0:.15,l1:.3,r0:2,r1:3});G.rings.push({x:p.tx,y:p.ty,r:24,t:.18,mt:.18,col:'255,255,255'});
      if(p.tw.st.splash){
        for(const e of G.enemies)if(!e.dead&&e!==p.target&&Math.hypot(e.x-p.tx,e.y-p.ty)<p.tw.st.splash){damage(e,p.dmg*.6);if(!e.dead)applyStatus(e,p.tw)}
        G.rings.push({x:p.tx,y:p.ty,r:p.tw.st.splash,t:.25,mt:.25,col:'255,160,60'});
      }
      if(p.chain>0){
        let nx=null,bd=130;
        for(const e of G.enemies)if(!e.dead&&!(p.hit||[]).includes(e.id)){const d2=Math.hypot(e.x-p.tx,e.y-p.ty);if(d2<bd){bd=d2;nx=e}}
        if(nx)G.proj.push({id:G.nid++,x:p.tx,y:p.ty,tx:nx.x,ty:nx.y,target:nx,sp:p.sp,dmg:p.dmg*.8,tw:p.tw,ang:0,bread:p.bread,chain:p.chain-1,hit:[...(p.hit||[]),nx.id]});
      }
      p.dead=true;
    }else{p.x+=dx/dd*step;p.y+=dy/dd*step}
  }
  DSRC=null;
  G.proj=G.proj.filter(p=>!p.dead);
  G.enemies=G.enemies.filter(e=>!e.dead);
  if(G.hp<=0&&!G.over){G.hp=0;G.over='lose';tune('over');endRun(false);return}
  if(G.active&&!G.spawn.length&&!G.enemies.length){
    G.active=false;const b=45+5*G.wave;G.coins+=b;
    {G.next=8;gtoast('웨이브 '+G.wave+' 클리어! 코인 +'+b);tune('clear');for(const c of['#ffd23c','#ff6b6b','#6bd0ff','#8dff8d'])fx(929,300,c,7,{a:-1.57,spread:1.2,v0:140,v1:320,g:520,l0:.7,l1:1.2,r0:3,r1:5,glow:false})}
  }
}
function compact(arr,fn){let j=0;for(let i=0;i<arr.length;i++)if(fn(arr[i]))arr[j++]=arr[i];arr.length=j}
function updateFx(dt){
  G.t+=dt;if(G.hit>0)G.hit-=dt;if(G.shake>0)G.shake=Math.max(0,G.shake-dt);
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt;p.t-=dt}
  G.parts=G.parts.filter(p=>p.t>0);
  for(const f of G.floats){f.y-=28*dt;f.t-=dt}compact(G.floats,f=>f.t>0);
  for(const r of G.rings)r.t-=dt;compact(G.rings,r=>r.t>0);
  for(const c of G.corpses){c.x+=c.vx*dt;c.y+=c.vy*dt;c.vy+=900*dt;c.rot+=c.vr*dt;c.t-=dt}compact(G.corpses,c=>c.t>0);
  for(const y of G.says){y.t-=dt;y.y-=10*dt}compact(G.says,y=>y.t>0);
  for(const p of G.pings)p.t-=dt;compact(G.pings,p=>p.t>0);
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null}
  if(NET.mode==='client'){
    const k=Math.min(1,dt*18);
    for(const e of G.enemies){e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k}
    for(const p of G.proj){p.trail.push({x:p.x,y:p.y});if(p.trail.length>8)p.trail.shift();const k2=Math.min(1,dt*25);p.x+=(p.tx-p.x)*k2;p.y+=(p.ty-p.y)*k2}
  }
}
function updTowers(dt,A){
  const fm=G.feast>0?1.6:1;
  for(const t of G.towers)t.buff=1;
  for(const c of G.towers)if(c.type==='cooker'&&c.stun<=0){const R=c.st.range*(c.blind>0?.6:1);for(const t of G.towers)if(t!==c&&dist(t,c)<=R)t.buff=Math.max(t.buff,1+c.st.aura)}
  for(const t of G.towers){
    DSRC=t.type;
    const sp=dt*t.buff*fm;
    t.cd-=sp;t.fx=Math.max(0,t.fx-dt);t.pull-=dt;t.skillCd=Math.max(0,t.skillCd-dt);
    if(t.blind>0)t.blind-=dt;
    t.qt-=dt;if(t.qt<=0){t.qt=rnd(9,20);if(A.length&&G.says.length<5)say(t.x,t.y-44,pick(TQ[t.type]))}
    if(t.type==='oven'&&Math.random()<dt*2.5)fx(t.x+rnd(-8,8),t.y-24,'rgba(200,200,200,.55)',1,{a:-1.57,spread:.4,v0:15,v1:30,g:-10,l0:.8,l1:1.3,r0:4,r1:7,glow:false});
    if(t.stun>0){t.stun-=dt;if(Math.random()<dt*14)fx(t.x,t.y-10,t.stunK==='ice'?'#bfe9ff':'#ff8a1f',1,{a:-1.57,spread:1,v0:20,v1:60,g:-60,l0:.3,l1:.6,r0:2,r1:4});continue}
    if(t.type==='cooker'){if(t.skillCd<=0&&A.length)useSkill(t,()=>{});if(Math.random()<dt*2)fx(t.x+rnd(-18,18),t.y-20,'#fff3a0',1,{a:-1.57,spread:.5,v0:15,v1:35,l0:.5,l1:.9,r0:2,r1:3,g:-5});continue}
    const st=t.st,rng=st.range*(t.blind>0?.6:1);
    const inr=A.filter(e=>!e.dead&&dist(e,t)<=rng+e.r*.4);
    if(!inr.length)continue;
    inr.sort((a,b)=>b.d-a.d);
    t.ang=Math.atan2(inr[0].y-t.y,inr[0].x-t.x);
    if(t.skillCd<=0)useSkill(t,()=>{});
    switch(t.type){
      case 'pan':
        if(t.cd<=0){
          for(const e of inr){damage(e,st.dmg);if(!e.dead)applyStatus(e,t);fx(e.x,e.y,'#ffe27a',6,{line:true,v0:90,v1:220,l0:.15,l1:.3,r0:2,r1:3.5})}
          t.fx=.25;t.cd=st.rate;G.rings.push({x:t.x,y:t.y,r:rng,t:.25,mt:.25,col:'255,230,150'});
          fx(t.x,t.y,'#ffd27a',10,{v0:60,v1:160,l0:.2,l1:.4,line:true,r0:2,r1:3});G.shake=Math.max(G.shake,.06);
          sfx(200,.07,'square',.2,-100);
        }
        break;
      case 'freezer':
        if(t.cd<=0){
          for(const e of inr){damage(e,st.dmg);if(!e.dead)applyStatus(e,t);fx(e.x,e.y,'#e6f7ff',5,{g:-25,v0:20,v1:60,l0:.4,l1:.8,r0:2,r1:4})}
          t.cd=st.rate;G.rings.push({x:t.x,y:t.y,r:rng,t:.4,mt:.4,col:'140,210,255'});
          fx(t.x,t.y,'#bfe9ff',16,{v0:70,v1:150,l0:.3,l1:.6,r0:2,r1:4});sfx(800,.08,'sine',.15,-300);
        }
        break;
      case 'chef':case 'toaster':
        if(t.cd<=0){
          const br=t.type==='toaster';
          for(let k=0;k<st.multi;k++){const tg=inr[Math.min(k,inr.length-1)];G.proj.push({id:G.nid++,x:t.x,y:t.y,tx:tg.x,ty:tg.y,target:tg,sp:br?480:560,dmg:st.dmg,tw:t,ang:0,bread:br,chain:br?2:0,hit:[tg.id]})}
          fx(t.x+Math.cos(t.ang)*30,t.y+Math.sin(t.ang)*30,br?'#e0b070':'#ffffff',5,{a:t.ang,spread:.5,line:true,v0:80,v1:180,l0:.1,l1:.2,r0:2,r1:3});
          t.fx=.25;t.cd=st.rate;sfx(br?700:900,.05,'square',.15,-300);
        }
        break;
      case 'oven':
        if(t.cd<=0){
          const tg=inr[0],rad=65*(t.recipe==='egg_roll'?1.2:1);
          for(const e of G.enemies)if(!e.dead&&Math.hypot(e.x-tg.x,e.y-tg.y)<rad){damage(e,st.dmg);if(!e.dead)applyStatus(e,t)}
          G.rings.push({x:tg.x,y:tg.y,r:rad*.7,t:.3,mt:.3,col:'255,220,80'});G.rings.push({x:tg.x,y:tg.y,r:rad,t:.4,mt:.4,col:'255,90,20'});
          fx(tg.x,tg.y,'#ff8a1f',20,{v0:40,v1:170,g:-80,l0:.4,l1:.8,r0:3,r1:6});
          fx(tg.x,tg.y,'#ffe27a',12,{v0:60,v1:200,l0:.2,l1:.5,r0:2,r1:4});
          fx(tg.x,tg.y,'rgba(70,70,70,.6)',6,{v0:10,v1:50,g:-25,l0:.6,l1:1.1,r0:5,r1:9,glow:false});
          fx(t.x,t.y-10,'#ffb84a',6,{a:t.ang,spread:.4,v0:80,v1:160,l0:.15,l1:.3,line:true,r0:2,r1:3});
          G.shake=Math.max(G.shake,.2);t.cd=st.rate;t.fx=.25;sfx(110,.2,'sawtooth',.3,-50);
        }
        break;
      case 'mixer':
        t.spin+=dt*10;
        if(Math.random()<dt*35){spiral(t.x,t.y,rng*.9);if(Math.random()<.35)emit({k:'sp',x:t.x,y:t.y,R:rng*.9})}
        if(t.cd<=0){for(const e of inr){damage(e,st.dmg);if(!e.dead)applyStatus(e,t);if(Math.random()<.4)fx(e.x,e.y,'#e8445a',2,{v0:30,v1:80,l0:.2,l1:.4})}t.cd=st.rate}
        if(t.pull<=0){
          for(const e of inr)if(!e.dead){fx(e.x,e.y,'#ff8aa0',4,{a:Math.atan2(t.y-e.y,t.x-e.x),spread:.3,line:true,v0:120,v1:220,l0:.15,l1:.3,r0:2,r1:3});e.d=Math.max(0,e.d-(isBoss(e)?10:50));setPos(e)}
          t.pull=3.5;G.rings.push({x:t.x,y:t.y,r:rng,t:.35,mt:.35,col:'232,68,90'});G.shake=Math.max(G.shake,.1);sfx(300,.2,'sine',.2,200);
        }
        break;
      case 'pressure':
        t.charge=Math.min(1,t.charge+sp/st.rate);
        if(t.charge>=1)releasePressure(t,inr);
        break;
    }
  }
  DSRC=null;
}

/* ===== 네트워크 ===== */
function resetNet(){
  try{if(NET.peer)NET.peer.destroy()}catch(e){}
  NET.mode='solo';NET.peer=null;NET.conns={};NET.conn=null;NET.started=false;NET.ev=[];NET.code='';NET.myId=0;NET.ids=[0];NET.busy=false;NET.cur={};NET.acc=0;NET.names={};
}
function genCode(){let s='';for(let i=0;i<4;i++)s+=CODECH[Math.floor(Math.random()*CODECH.length)];return s}
function sendAll(msg){for(const id in NET.conns){try{NET.conns[id].send(msg)}catch(e){}}}
function cleanTag(s,m){return String(s==null?'':s).replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,m)}
function myTag(){let n='';try{if(window.FFAuth&&FFAuth.user())n=FFAuth.nickname()||''}catch(e){}return{n:cleanTag(n,10),ti:save.title||''}}
function tagOf(d){const a=ACH.find(a=>a.id===d.ti);return{n:cleanTag(d.n,10),tt:a?a.t:''}}
function pname(id){const o=NET.names[id];return o&&o.n?o.n:'P'+(id+1)}
function lobbyBroadcast(){NET.ids=[0,...Object.keys(NET.conns).map(Number).sort()];sendAll({t:'lobby',ids:NET.ids,names:NET.names})}
function dropPlayer(id){
  if(!NET.conns[id])return;
  const nm=pname(id);
  delete NET.conns[id];delete NET.cur[id];delete NET.names[id];
  lobbyBroadcast();
  if(scene==='play')toast(nm+' 님이 나갔어요');
}
function createRoom(map,tries=0){
  if(typeof Peer==='undefined'){toast('인터넷 연결이 필요해요');return}
  resetNet();NET.mode='host';NET.map=map;NET.busy=true;
  const code=genCode();let p;
  try{p=new Peer('kdef-'+code)}catch(e){toast('방을 만들지 못했어요');resetNet();return}
  NET.peer=p;
  p.on('open',()=>{NET.code=code;NET.busy=false;NET.ids=[0];NET.names={0:tagOf(myTag())};scene='lobby'});
  p.on('error',err=>{
    if(NET.peer!==p)return;
    if(err&&err.type==='unavailable-id'&&tries<5){createRoom(map,tries+1);return}
    toast('방을 만들지 못했어요');resetNet();scene='mode';
  });
  p.on('connection',c=>{
    const ids=Object.keys(NET.conns).map(Number);
    let id=1;while(ids.includes(id))id++;

  chip(102,5,122,30);coin(120,20,9);txt(String(Math.floor(G.coins)),136,20,20,'#ffe27a','left','');
  chip(232,5,112,30);txt('웨이브 '+G.wave,244,20,18,'#fff','left','');
  if(G.coop)NET.ids.forEach((id,i)=>{const x=372+i*28;g.fillStyle=PCOL[id];g.beginPath();g.arc(x,20,10,0,7);g.fill();g.strokeStyle='#3b1d0a';g.lineWidth=2;g.stroke();txt(String(id+1),x,21,13,'#fff')});
  RES.forEach((k,i)=>{const x=500+i*75;chip(x,5,69,30);icon(k,x+16,20,10);txt(String(G.res[k]),x+32,20,18,'#fff','left','')});
  if(G.feast>0)txt('풍년 잔치! '+Math.ceil(G.feast)+'s',W/2,MY+70,26,'#8dff8d');
  const bs=G.over?null:G.enemies.find(e=>isBoss(e)&&!e.dead);
  if(bs){
    const bw=400,bx=W-bw-22,y0=MY+8;
    panel(bx-12,y0,bw+24,44,12,.72);
    txt((bs.mid?'중간보스 ':'')+ED[bs.type].name,bx,y0+14,15,'#ff9a9a','left','');
    txt(Math.ceil(bs.hp)+' / '+Math.ceil(bs.max),bx+bw,y0+14,13,'#d9c3a0','right','');
    g.fillStyle='#3a0d0d';g.beginPath();g.roundRect(bx,y0+25,bw,9,4.5);g.fill();
    g.fillStyle=lg(bx,0,bx+bw,0,'#ff6b6b','#ffb14a');g.beginPath();g.roundRect(bx,y0+25,Math.max(9,bw*Math.max(0,Math.min(1,bs.hp/bs.max))),9,4.5);g.fill();
    if(bs.smax>0&&bs.shield>0){g.fillStyle='#6cf';g.fillRect(bx,y0+36,bw*Math.min(1,bs.shield/bs.smax),3)}
  }
  if(!G.over&&!G.confirmExit)introCard(dt,bs?50:0);
  const he=hoverEnemy();
  if(he){
    const D=ED[he.type];
    g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=2;g.beginPath();g.arc(he.x,he.y,he.r+6,0,7);g.stroke();
    panel(6,MY+6,250,44,12,.72);
    drawBody(D.kind,30,MY+28,12);
    txt((he.mid?'중간보스 ':'')+ename(he.type),52,MY+20,16,'#fff','left','');
    txt(Math.ceil(he.hp)+' / '+Math.ceil(he.max),244,MY+20,13,'#d9c3a0','right','');
    g.fillStyle='#3a0d0d';g.beginPath();g.roundRect(52,MY+32,192,7,3.5);g.fill();
    g.fillStyle='#5c5';g.beginPath();g.roundRect(52,MY+32,Math.max(7,192*Math.max(0,Math.min(1,he.hp/he.max))),7,3.5);g.fill();
  }
  if(G.selT){
    const t=G.selT;
    panel(6,MY+6,480,56,12,.62);
    txt(TD[t.type].n+(t.recipe?' · '+RCP[t.recipe].n:''),18,MY+22,20,'#fff','left','');
    txt(infoLine(t),18,MY+46,16,'#ffe27a','left','');
  }
  const by=MY+ROWS*TS;
  if(G.over){
    const win=G.over==='win';
    g.fillStyle='rgba(10,5,2,.6)';g.fillRect(0,0,W,H);panel(W/2-320,64,640,494,26,.88);
    txt(win?'주방 수호 성공!':'냉장고가 털렸다...',W/2,128,64,win?'#ffe27a':'#ff9a9a','center','#3b1d0a',11);
    txt('웨이브 '+G.cleared+' 클리어  ·  처치 '+G.kills,W/2,194,24,'#fff',undefined,'');
    txt('획득 PT  +'+G.pt,W/2,236,32,'#ffe27a',undefined,'');
    txt(G.cleared>(G.bestAt||0)?'★ 새 최고 기록!':'최고 웨이브 '+Math.max(save.best,G.cleared),W/2,274,18,G.cleared>(G.bestAt||0)?'#8dff8d':'#d9c3a0',undefined,'');
    g.fillStyle='rgba(255,220,170,.16)';g.fillRect(W/2-240,298,480,1);
    resultStats(322);
    if(NET.mode==='client'){
      txt('방장이 다시 시작하길 기다려요',W/2,446,20,'#fff','center','');
      if(btn(W/2-115,474,230,64,'나가기',{fs:28,col:'#6aa8d8'}))leaveGame();
    }else{
      if(btn(W/2-250,462,230,68,'다시 시작',{fs:30})){if(G.coop)hostStart();else newGame(G.map)}
      if(btn(W/2+20,462,230,68,'메인으로',{fs:30,col:'#6aa8d8'}))leaveGame();
    }
    return;
  }
  if(G.confirmExit){
    g.fillStyle='rgba(10,5,2,.6)';g.fillRect(0,0,W,H);panel(W/2-300,170,600,270,24,.86);
    txt('나가시겠어요?',W/2,225,60,'#fff','center','#3b1d0a',10);
    txt(G.coop?(NET.mode==='host'?'방이 닫혀요':'방에서 나가요'):'클리어한 웨이브만큼 PT는 받아요',W/2,288,24,'#ffe27a',undefined,'');
    if(btn(W/2-230,340,210,70,'나가기',{fs:30,col:'#c9604a'})){endRun(false);leaveGame()}
    if(btn(W/2+20,340,210,70,'계속하기',{fs:30,col:'#6aa8d8'}))G.confirmExit=false;
    return;
  }
  if(!G.selT){
    let x=10;
    for(const id of TORDER){
      if(!G.unl.towers[id])continue;
      const d=TD[id];
      if(btn(x,by+6,88,50,d.n+'\n'+d.cost,{on:G.sel===id,dim:G.coins<d.cost&&G.sel!==id,fs:17}))G.sel=G.sel===id?null:id;
      x+=92;
    }
    const eb=earlyBonus(),wl=G.active?'진행 중…':'웨이브 '+(G.wave+1)+' 바로 시작\n'+Math.ceil(Math.max(0,G.next))+'초 후 자동'+(eb?' · 코인 +'+eb:'');
    if(btn(752,by+6,198,50,wl,{fs:19,col:'#7bbf5a',dim:G.active})){if(G.active)toast('웨이브가 진행 중이에요');else act({k:'start'})}
    if(btn(10,by+70,130,50,'배속 '+G.speed+'x',{fs:22,col:'#6aa8d8',dim:NET.mode==='client'})){if(NET.mode==='client')toast('배속은 방장만 바꿀 수 있어요');else act({k:'speed'})}
    if(btn(146,by+70,110,50,'메뉴',{fs:22,col:'#c9604a'}))G.confirmExit=true;
    if(G.coop){
      if(btn(612,by+70,108,50,'핑 여기',{fs:18,col:'#d9a441',on:G.pingMode===1}))G.pingMode=G.pingMode===1?0:1;
      if(btn(726,by+70,108,50,'핑 도움',{fs:18,col:'#d65a5a',on:G.pingMode===2}))G.pingMode=G.pingMode===2?0:2;
    }
    let hint='';
    if(G.pingMode)hint='핑을 찍을 곳을 누르세요';
    else if(G.sel)hint='설치할 칸을 누르세요 (같은 버튼 = 취소)';
    else if(!G.towers.length)hint='타워를 고르고 칸을 눌러 설치하세요';
    if(hint)txt(hint,270,by+95,18,'#ffe27a','left','');
    else if(G.active)txt('남은 적 '+((NET.mode==='client'?G.rem:G.spawn.length)+G.enemies.length),270,by+95,17,'#d9c3a0','left','');
    else{
      const ts=waveTypes(G.wave+1),st=G.coop?26:34;
      txt('다음',270,by+95,16,'#d9c3a0','left','');
      ts.forEach((t,i)=>{const D=ED[t],b=t.startsWith('boss'),x=326+i*st;if(b){g.fillStyle='rgba(255,90,90,.28)';g.beginPath();g.arc(x,by+95,16,0,7);g.fill()}drawBody(D.kind,x,by+96,b?13:(G.coop?9:11))});
    }
  }else{
    const t=G.selT;
    RES.forEach((k,i)=>{
      const x=10+i*130,mx=k==='cabbage'?2:3,l=t.lv[k],cost=l<mx?UC[k][l]:0;
      const dim=l>=mx||G.res[k]<cost;
      const lab=RN[k]+' '+UEFF[k]+'\n'+(l>=mx?'최대':'Lv'+l+'→'+(l+1)+' · '+cost+'개');
      if(btn(x,by+6,124,50,lab,{dim,fs:(RN[k]+UEFF[k]).length>5?15:17,pad:10}))act({k:'up',c:t.c,r:t.r,res:k});
      icon(k,x+17,by+31,10);
    });
    let x=10;
    for(const id of RORDER){
      if(!G.unl.recipes[id])continue;
      const R=RCP[id],mine=t.recipe===id;
      const lab=R.n+'\n'+(mine?'적용됨':RN[R.a[0]]+R.a[1]+'+'+RN[R.b[0]]+R.b[1]);
      if(btn(x,by+70,138,50,lab,{on:mine,dim:!mine&&(!!t.recipe||G.res[R.a[0]]<R.a[1]||G.res[R.b[0]]<R.b[1]),fs:16}))act({k:'rc',c:t.c,r:t.r,id});
      x+=144;
    }
    if(btn(736,by+70,100,50,'판매\n+'+Math.floor(t.spent*.7),{col:'#c9604a',fs:18})){act({k:'sell',c:t.c,r:t.r});G.selT=null}
    if(btn(842,by+70,108,50,'닫기',{col:'#6aa8d8',fs:20}))G.selT=null;
  }
}
function sPlay(dt){
  sfxN=0;
  if(NET.mode==='client'){
    updateFx(dt);
    NET.curT-=dt;
    if(NET.curT<=0){NET.curT=.12;if(NET.conn&&mouse.y>=MY&&mouse.y<MY+ROWS*TS)try{NET.conn.send({t:'cur',x:q(mouse.x),y:q(mouse.y)})}catch(e){}}
  }else{
    if(!G.over&&!(G.confirmExit&&!G.coop)){for(let i=0;i<G.speed;i++){if(!G.over)updateSim(dt)}}
    updateFx(dt);
    if(netOn()){NET.acc+=dt;if(NET.acc>=.05){NET.acc=0;sendAll({t:'snap',s:snapshot()})}}
  }
  if(G.selT&&!G.towers.includes(G.selT))G.selT=null;
  g.save();if(G.shake>0)g.translate(rnd(-1,1)*G.shake*25,rnd(-1,1)*G.shake*25);drawWorld();g.restore();
  playUI(dt);
  if(click&&!G.over&&!G.confirmExit){
    if(G.pingMode){if(click.y>=MY&&click.y<MY+ROWS*TS){doPing(click.x,click.y,G.pingMode-1);G.pingMode=0}}
    else mapClick(click.x,click.y);
  }
  if(rclick&&!G.over&&!G.confirmExit)doPing(rclick.x,rclick.y,0);
}

/* ===== 메인 루프 ===== */
let last=performance.now(),lastScene='menu',fadeT=0;
function frame(dt){
  hoverAny=false;g.clearRect(0,0,W,H);
  if(scene==='menu')sMenu(dt);
  else if(scene==='mode')sMode();
  else if(scene==='maps')sMaps();
  else if(scene==='lobby')sLobby();
  else if(scene==='join')sJoin();
  else if(scene==='upgrade')sUpgrade();
  else if(scene==='settings')sSettings();
  else if(scene==='ach')sAch();
  else sPlay(dt);
  if(toastT>0){toastT-=dt;if(toastT>0)drawToast()}
  if(scene!==lastScene){lastScene=scene;fadeT=.22}
  if(fadeT>0){fadeT-=dt;g.fillStyle='rgba(20,12,6,'+(Math.max(0,fadeT/.22)*.85)+')';g.fillRect(0,0,W,H)}
  achCheck(dt);drawAch(dt);
  cv.style.cursor=hoverAny?'pointer':'default';
  click=null;rclick=null;
}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  frame(dt);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
<script>setInterval(function(){var f=document.getElementById("ffFoot");if(f)f.style.display=(typeof scene!=="undefined"&&scene==="menu")?"block":"none"},300)</script>
