<style>
:root{--bg:#160f0c;--panel:#2a1d16;--panel2:#352519;--line:#5c4130;--text:#f1e2c6;--dim:#bba486;--ember:#ff9a4a;--gold:#f2c46b;--bad:#e5675a;--good:#8fcf7a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}
.btn{background:linear-gradient(#4a3222,#352417);border:2px solid #7a573b;border-radius:10px;padding:10px 16px;color:var(--text);font-weight:700;box-shadow:0 3px 0 #1d130d;transition:transform .08s,border-color .15s}
.btn:hover{border-color:var(--ember)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1d130d}
.btn.main{background:linear-gradient(#c8682f,#9c4a1f);border-color:#ffb06a;color:#fff6e6}
.btn.small{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
/* title */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 40%,rgba(40,20,10,.25),rgba(10,6,4,.78));z-index:20;padding:16px}
#title h1{margin:0;font-family:'Cinzel',serif;font-size:clamp(38px,8vw,84px);letter-spacing:.06em;color:#ffcf8a;text-shadow:0 0 18px rgba(255,120,40,.65),0 4px 0 #4a2210;line-height:1}
#title .sub{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(20px,4vw,34px);color:#f6e2bf;text-shadow:0 2px 0 #3b1e0e;margin-top:-4px}
#title .tag{color:var(--dim);font-size:14px;text-align:center;max-width:520px}
#title .menu{display:flex;flex-direction:column;gap:10px;width:min(320px,90vw);margin-top:10px}
#title .row{display:flex;gap:8px}
#title .row .btn{flex:1}
#title .top{position:fixed;top:12px;right:14px;display:flex;gap:10px;align-items:center;z-index:21}
#title .back{position:fixed;top:14px;left:14px;color:var(--dim);font-size:14px;text-decoration:none;z-index:21}
#title .back:hover{color:var(--ember)}
[data-ff-account] button,[data-ff-account] a{font-size:14px}
/* hud */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#clock{position:absolute;top:10px;left:10px;background:rgba(26,17,12,.82);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
#clock i{font-style:normal;font-size:18px}
#where{position:absolute;top:50px;left:10px;font-size:13px;color:var(--dim);background:rgba(26,17,12,.6);padding:3px 9px;border-radius:8px}
#mapbox{position:absolute;top:10px;right:10px;background:rgba(26,17,12,.82);border:2px solid var(--line);border-radius:10px;padding:4px}
#mini{display:block;width:150px;height:113px;image-rendering:pixelated}
#hudBtns{position:absolute;top:136px;right:10px;display:flex;gap:6px;pointer-events:auto}
#prompt{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);background:rgba(26,17,12,.9);border:2px solid var(--ember);border-radius:10px;padding:6px 14px;font-weight:700;font-size:15px;white-space:nowrap}
#prompt b{color:var(--ember);margin-right:6px}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(40,26,16,.95);border:2px solid var(--gold);border-radius:12px;padding:8px 16px;font-weight:700;max-width:80vw;text-align:center;transition:opacity .3s;opacity:0}
#toast.on{opacity:1}
#copy{position:fixed;left:0;right:0;bottom:2px;text-align:center;font-size:11px;color:rgba(241,226,198,.55);z-index:30;pointer-events:none}
#copy a{color:inherit;pointer-events:auto}
/* touch */
#touch{position:fixed;inset:0;z-index:6;pointer-events:none}
#joy{position:absolute;left:24px;bottom:40px;width:130px;height:130px;border-radius:50%;background:rgba(255,230,190,.08);border:2px solid rgba(255,230,190,.25);pointer-events:auto}
#joyK{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,190,120,.35);border:2px solid rgba(255,210,160,.6)}
#actBtn{position:absolute;right:26px;bottom:52px;width:88px;height:88px;border-radius:50%;background:rgba(200,104,47,.55);border:3px solid rgba(255,190,120,.8);font-weight:900;font-size:17px;pointer-events:auto;color:#fff4e0}
#bookBtn{position:absolute;right:124px;bottom:44px;width:60px;height:60px;border-radius:50%;background:rgba(60,40,28,.75);border:2px solid rgba(255,210,160,.5);font-size:24px;pointer-events:auto}
/* dialog */
#bubble{position:fixed;z-index:12;max-width:min(440px,86vw);background:#f6ead2;color:#2b1c12;border:3px solid #3b2618;border-radius:14px;padding:10px 14px 12px;font-size:16px;line-height:1.55;box-shadow:0 6px 0 rgba(0,0,0,.35)}
#bubble .who{font-weight:900;color:#9c4a1f;font-size:14px;margin-bottom:2px}
#bubble:after{content:'';position:absolute;left:var(--tail,50%);bottom:-12px;margin-left:-10px;border:10px solid transparent;border-top-color:#3b2618;border-bottom:0}
#bubble.up:after{bottom:auto;top:-12px;border-top:0;border-bottom:10px solid #3b2618}
#choices{position:fixed;z-index:13;left:50%;transform:translateX(-50%);bottom:56px;display:flex;flex-direction:column;gap:6px;width:min(460px,92vw)}
#choices button{text-align:left;background:rgba(36,24,17,.95);border:2px solid #6d4d34;border-radius:10px;padding:9px 12px;font-size:15px;color:var(--text)}
#choices button.sel,#choices button:hover{border-color:var(--ember);background:rgba(70,40,22,.97)}
#choices button small{color:var(--dim);margin-right:8px}
/* modal */
#modalWrap{position:fixed;inset:0;z-index:40;background:rgba(8,5,3,.62);display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:var(--panel);border:3px solid var(--line);border-radius:16px;width:min(560px,96vw);max-height:92vh;overflow:auto;padding:18px;box-shadow:0 10px 0 rgba(0,0,0,.35);position:relative}
.modal.wide{width:min(860px,96vw)}
.modal h2{margin:0 0 10px;font-family:'Noto Serif KR',serif;font-size:22px;color:var(--gold)}
.modal p{margin:6px 0;line-height:1.6}
.modal .x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:22px;color:var(--dim)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.modal .dim{color:var(--dim);font-size:14px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* settings */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #3d2a1e}
.set input[type=range]{width:180px;accent-color:var(--ember)}
.tog{width:56px;height:30px;border-radius:15px;background:#4a3a30;border:2px solid #6d5040;position:relative}
.tog:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#bba486;transition:left .15s}
.tog.on{background:#9c4a1f;border-color:var(--ember)}.tog.on:after{left:29px;background:#fff1dc}
/* lock */
.lock{display:flex;gap:10px;justify-content:center;margin:14px 0}
.dial{display:flex;flex-direction:column;align-items:center;gap:6px}
.dial button{width:66px;height:74px;border-radius:12px;border:3px solid #241710;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.dial span{font-size:13px;color:var(--dim)}
/* letter */
.scraps{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.scrap{display:flex;gap:10px;align-items:center;background:#e9dcc0;color:#3a2716;border-radius:6px;padding:10px 12px;font-family:'Noto Serif KR',serif;font-size:15px;line-height:1.5;clip-path:polygon(0 6%,3% 0,40% 4%,70% 0,100% 5%,98% 50%,100% 94%,60% 100%,30% 96%,0 100%,2% 50%);cursor:pointer;border:0;text-align:left}
.scrap.pick{outline:3px solid var(--ember);background:#fff1cf}
.scrap .num{font-family:'Cinzel',serif;font-size:13px;color:#8b5a35;border:1px dashed #8b5a35;border-radius:4px;padding:0 5px;margin-left:auto;transform:rotate(-8deg)}
.scrap .ord{font-weight:900;color:#9c4a1f;min-width:18px}
/* safe */
.wheels{display:flex;gap:10px;justify-content:center;margin:16px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:4px}
.wheel b{font-family:'Cinzel',serif;font-size:34px;width:56px;height:64px;display:grid;place-items:center;background:#1c130d;border:3px solid #8a6a40;border-radius:10px;color:var(--gold)}
/* bells */
.bellrow{display:flex;gap:14px;justify-content:center;align-items:flex-end;margin:16px 0}
.bellrow button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text)}
.bellrow svg{filter:drop-shadow(0 4px 0 rgba(0,0,0,.4));transition:transform .1s}
.bellrow button.ring svg{transform:rotate(-14deg)}
.dots{display:flex;gap:6px;justify-content:center;min-height:18px}
.dots i{width:14px;height:14px;border-radius:50%;background:#4a3528;border:2px solid #7a5a40}
.dots i.on{background:var(--gold)}
/* notebook */
.book{display:grid;grid-template-columns:180px 1fr;gap:14px;min-height:340px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{background:#3a281c;border:2px solid #5c4130;border-radius:9px;padding:6px 12px;font-weight:700;color:var(--dim)}
.tabs button.on{color:var(--text);border-color:var(--ember);background:#4a3020}
.names{display:flex;flex-direction:column;gap:5px}
.names button{text-align:left;background:#2f2118;border:2px solid #4a3426;border-radius:9px;padding:7px 10px;color:var(--text)}
.names button.on{border-color:var(--gold);background:#43301f}
.names button small{display:block;color:var(--dim);font-size:12px}
.entries{display:flex;flex-direction:column;gap:9px}
.entry{background:#efe1c4;color:#33231a;border-radius:8px;padding:10px 12px;line-height:1.6;font-size:15px}
.entry b{display:block;color:#8b3f17;font-size:13px;margin-bottom:2px}
.entry.new{box-shadow:0 0 0 3px var(--ember)}
.goals li{margin:6px 0;line-height:1.5}.goals li.done{color:var(--dim);text-decoration:line-through}
.items{display:flex;gap:8px;flex-wrap:wrap}.items span{background:#3a281c;border:2px solid #5c4130;border-radius:8px;padding:6px 10px}
.q{margin:12px 0}.q b{display:block;margin-bottom:6px;color:var(--gold)}
.q label{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:8px;background:#2f2118;margin:4px 0;border:2px solid transparent;cursor:pointer}
.q label:hover{border-color:#6d4d34}
.q input{accent-color:var(--ember);margin-top:4px}
.rec{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid #3d2a1e}
.rec small{color:var(--dim)}
.pn h3{margin:14px 0 4px;color:var(--gold);font-size:16px}.pn ul{margin:0;padding-left:20px;line-height:1.7}
#tapStart{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(10,6,4,.55);font-size:22px;font-weight:900;color:#ffe2b8;text-shadow:0 2px 0 #000}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50;transition:opacity .6s}
@media (max-width:640px){
 #mini{width:112px;height:84px}
 #hudBtns{top:104px}
 .book{grid-template-columns:1fr}
 .names{flex-direction:row;flex-wrap:wrap}
 .names button{flex:1 1 30%}
 #prompt{bottom:auto;top:62px;font-size:14px}
 #choices{bottom:200px}
 .dial button{width:58px;height:64px}
 #toast{top:150px;font-size:14px;max-width:88vw}
}
</style>

<script>
/* Emberhollow core: map, puzzles, solvers (no DOM; the self-check runs this in Node too) */
var EHCore = (function () {
  'use strict';
  var W = 64, H = 48;
  var T = { GRASS: 0, DIRT: 1, COBBLE: 2, WALL: 3, WWALL: 4, WOOD: 5, STONE: 6, CFLOOR: 7, WATER: 8, WALK: 9, TREE: 10, RUBBLE: 11, FURN: 12, STAIRS: 13, GRAVE: 14, BURNT: 15, FOUNT: 17, CWALL: 18 };
  var SOLID = {}; [3, 4, 8, 10, 11, 12, 14, 17, 18].forEach(function (t) { SOLID[t] = 1; });

  function rng(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function hashStr(s) { var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function shuffle(a, r) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // cellar mirrors (tile) and sewer lever posts (tile); see the puzzles below
  var MIRRORS = [[46, 9], [46, 11], [49, 11], [52, 11], [52, 4]];
  var BEAM_SRC = [42, 9], BEAM_DIR = 1, SENSOR = [58, 4];
  var LEVERS = [[60, 18], [60, 24], [60, 29], [60, 34]];
  // flooded walkway sections between the lever posts (A, B, C, D)
  var SECTIONS = [[57, 21, 60, 22], [57, 26, 60, 27], [57, 31, 60, 32], [57, 36, 60, 37]];
  // church statues: star plates, and the part of the nave the statues can be pushed in
  var PLATES = [[24, 7], [39, 9], [31, 11]];
  var STATUE_ZONE = [24, 6, 39, 13];
  // clock tower shadow
  var TOWER = [25.5, 28.2];

  /* ---------- map (same for every seed) ---------- */
  function buildMap() {
    var m = new Uint8Array(W * H), under = new Uint8Array(W * H);
    function set(x, y, t) { if (x >= 0 && y >= 0 && x < W && y < H) m[y * W + x] = t; }
    function get(x, y) { return (x < 0 || y < 0 || x >= W || y >= H) ? T.TREE : m[y * W + x]; }
    function rect(x0, y0, x1, y1, t) { for (var y = y0; y <= y1; y++) for (var x = x0; x <= x1; x++) set(x, y, t); }
    function box(x0, y0, x1, y1, wall, floor) { rect(x0, y0, x1, y1, wall); rect(x0 + 1, y0 + 1, x1 - 1, y1 - 1, floor); }
    function put(x, y, t) { under[y * W + x] = get(x, y); set(x, y, t); }

    rect(0, 0, W - 1, H - 1, T.GRASS);
    rect(0, 0, W - 1, 0, T.TREE); rect(0, H - 1, W - 1, H - 1, T.TREE); rect(0, 0, 0, H - 1, T.TREE); rect(W - 1, 0, W - 1, H - 1, T.TREE);
    // town wall + watchtowers
    rect(1, 1, 62, 1, T.WALL); rect(1, 46, 62, 46, T.WALL); rect(1, 1, 1, 46, T.WALL); rect(62, 1, 62, 46, T.WALL);
    rect(1, 1, 3, 3, T.WALL); rect(60, 1, 62, 3, T.WALL); rect(1, 43, 3, 46, T.WALL); rect(60, 43, 62, 46, T.WALL);
    // burned fields
    rect(3, 35, 20, 44, T.BURNT); rect(36, 42, 59, 45, T.BURNT); rect(44, 41, 59, 41, T.BURNT);
    // roads
    rect(30, 16, 33, 45, T.COBBLE);
    rect(22, 18, 41, 30, T.COBBLE);
    rect(3, 24, 21, 25, T.DIRT);
    rect(11, 20, 12, 23, T.DIRT);
    rect(30, 46, 33, 46, T.RUBBLE); // collapsed south gate
    // guard post
    box(22, 38, 28, 44, T.WALL, T.STONE); set(28, 41, T.STONE);
    put(23, 39, T.FURN); put(26, 39, T.FURN); put(23, 43, T.FURN);
    put(35, 41, T.FURN); // campfire
    // plaza
    rect(36, 21, 38, 23, T.FOUNT);
    rect(24, 27, 26, 29, T.WALL); // clock tower
    put(29, 18, T.FURN); put(41, 22, T.FURN); put(34, 30, T.FURN); put(22, 22, T.FURN); // flag poles
    put(38, 28, T.FURN); put(39, 28, T.FURN); put(23, 20, T.FURN); put(24, 20, T.FURN); // stalls
    put(40, 19, T.RUBBLE); put(22, 30, T.RUBBLE);
    // houses
    box(3, 27, 10, 33, T.WWALL, T.WOOD); set(6, 27, T.WOOD); set(10, 30, T.RUBBLE); set(3, 32, T.RUBBLE);
    put(8, 31, T.FURN); put(4, 28, T.FURN); put(4, 29, T.FURN);
    box(12, 27, 20, 33, T.WWALL, T.WOOD); set(15, 27, T.WOOD); set(20, 32, T.RUBBLE);
    put(13, 32, T.FURN); put(17, 30, T.FURN); put(19, 28, T.FURN); put(19, 29, T.FURN);
    box(4, 9, 18, 19, T.WWALL, T.WOOD); // mayor's house, door (11,19) is a gate
    set(11, 19, T.WOOD);
    put(6, 10, T.FURN); put(14, 10, T.FURN); put(15, 10, T.FURN); put(17, 14, T.FURN); put(17, 15, T.FURN); put(5, 17, T.RUBBLE);
    // graveyard

  C.UNDERGROUND.forEach(function (u) { var a = worldToShade(u[0], u[1]), b = worldToShade(u[2] + 1, u[3] + 1); sctx.clearRect(a.x, a.y, b.x - a.x, b.y - a.y); sctx.fillStyle = 'rgba(4,3,10,.93)'; sctx.fillRect(a.x, a.y, b.x - a.x, b.y - a.y); });
  sctx.globalCompositeOperation = 'destination-out';
  var lights = [[35.5, 41.5, 4.6 + Math.sin(now / 120) * 0.2]];
  if (S.items.lit) lights.push([S.px, S.py - 0.4, 4.4]); else lights.push([S.px, S.py - 0.4, 1.6]);
  if (S.flags.cryptGate || C.isUnder(S.px, S.py)) { lights.push([42.5, 9.5, 2.4]); lights.push([43.5, 12.5, 1.6]); }
  if (beam) for (var bi = 1; bi < beam.length; bi += 2) lights.push([beam[bi][0] + 0.5, beam[bi][1] + 0.5, 1.3]);
  lights.push([51.5, 39.5, 1.8]);
  if (S.flags.gas) lights.push([58.5, 4.5, 2]);
  lights.forEach(function (L) { var c = worldToShade(L[0], L[1]), r = L[2] * TS * Z / q; var gr = sctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.55, 'rgba(0,0,0,.75)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); sctx.fillStyle = gr; sctx.beginPath(); sctx.arc(c.x, c.y, r, 0, 6.283); sctx.fill(); });
  ctx.imageSmoothingEnabled = true; ctx.drawImage(shade, 0, 0, shade.width * q, shade.height * q);
  function worldToShade(x, y) { return { x: ((x * TS - camX) * Z + cw / 2) / q, y: ((y * TS - camY) * Z + ch / 2) / q }; }
}
function renderMini(now) {
  mctx.clearRect(0, 0, 128, 96); mctx.drawImage(miniBase, 0, 0);
  NPCS.forEach(function (n) { mctx.fillStyle = '#9fd0ff'; mctx.fillRect(Math.floor(n.x) * 2, Math.floor(n.y) * 2, 2, 2); });
  if (Math.floor(now / 400) % 2 === 0 || true) { mctx.fillStyle = '#ff8a3a'; mctx.fillRect(Math.floor(S.px) * 2 - 1, Math.floor(S.py) * 2 - 1, 4, 4); }
}

/* ---------------- loop ---------------- */
var mode = 'title', last = 0, curTarget = null, hudT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  var dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  if (mode === 'title') { titleRender(now, dt); return; }
  if (!S) return;
  var paused = !!DLG || modalOpen || mode !== 'play';
  if (!paused) {
    var scale = (TEST && window.__ehTimeScale) || 1;
    S.t += dt * 2 * scale; S.playMs += dt * 1000;
    updatePlayer(dt); updateNPCs(dt);
    if (auto) autoStep(dt);
  }
  Object.keys(statueAnim).forEach(function (k) { statueAnim[k].t -= dt; if (statueAnim[k].t <= 0) delete statueAnim[k]; });
  curTarget = paused ? null : nearestTarget();
  render(now, dt);
  hudT -= dt; if (hudT <= 0) { hudT = 0.2; updateHud(now); }
  if (DLG) placeBubble();
  if (saveTimer > 0) { saveTimer -= dt; if (saveTimer <= 0) saveNow(); }
  if (!paused && Math.floor(S.playMs / 5000) !== Math.floor((S.playMs - dt * 1000) / 5000)) saveNow();
}
function updateHud(now) {
  var h = hour();
  $('clockTxt').textContent = day() + '일째 · ' + timeStr();
  $('sunIcon').textContent = h >= 6 && h < 18 ? '☀' : '☾';
  $('where').textContent = regionAt(S.px, S.py);
  renderMini(now);
  var p = $('prompt');
  if (curTarget && !isTouch) { p.innerHTML = '<b>E</b>' + esc(targetLabel(curTarget)); p.classList.remove('hide'); }
  else if (curTarget && isTouch) { p.innerHTML = esc(targetLabel(curTarget)); p.classList.remove('hide'); }
  else p.classList.add('hide');
}
var toastT = null;
function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 2600); }

/* ---------------- title ---------------- */
var titleCam = 0;
function titleRender(now, dt) {
  if (!S) { S = newState('TITLE'); S.t = 17.6 * 60; rebuildGateCache(); npcPlace(); }
  titleCam += dt * 0.6;
  S.px = 30 + Math.sin(titleCam / 9) * 10; S.py = 26 + Math.cos(titleCam / 13) * 6;
  var keepItems = S.items; S.items = {}; render(now, dt); S.items = keepItems;
}
function toTitle() {
  mode = 'title'; S = null; closeDialog(); auto = null;
  $('hud').classList.add('hide'); $('touch').classList.add('hide'); $('title').classList.remove('hide');
  $('tContinue').classList.toggle('hide', !lsGet(LS.save, null));
}
function startGame(seed, saved) {
  if (saved) { S = saved; P = C.makePuzzles(S.seed); }
  else { S = newState(seed); lsDel(LS.save); }
  rebuildGateCache(); npcPlace();
  camX = S.px * TS; camY = S.py * TS;
  $('title').classList.add('hide'); $('hud').classList.remove('hide'); if (isTouch) $('touch').classList.remove('hide');
  mode = 'play'; saveNow();
  if (!saved) setTimeout(function () { say('탐정', null, '30년 전 하룻밤 새 잿더미가 된 마을, 잿불골. 사람들은 용의 저주라고 하지만… 정말 그럴까? 경비 초소부터 살펴보자.', [{ t: '시작하기' }]); }, 400);
  else toast('이어서 해요 · ' + day() + '일째 ' + timeStr());
}
function randomSeed() { var s = ''; var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; for (var i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
function askNew(seed) {
  if (lsGet(LS.save, null)) {
    var m = openModal('<h2>새 사건 시작</h2><p>이어 하던 판이 있어요. 새로 시작하면 그 판은 사라져요.</p><div class="acts"><button class="btn" data-close>취소</button><button class="btn main" id="nwGo">새로 시작</button></div>');
    m.querySelector('#nwGo').onclick = function () { closeModal(); startGame(seed); };
  } else startGame(seed);
}
$('tNew').onclick = function () { SFX.ui(); askNew(randomSeed()); };
$('tContinue').onclick = function () { var sv = lsGet(LS.save, null); if (sv) startGame(null, sv); };
$('tSeed').onclick = function () {
  var m = openModal('<h2>시드 입력</h2><p class="dim">친구와 같은 시드를 넣으면 깃발 색, 멈춘 시각, 종 노래, 거울, 조각상, 수문까지 똑같은 퍼즐이 나와요.</p><input id="seedIn" maxlength="16" style="width:100%;font-size:20px;padding:10px;border-radius:10px;border:2px solid var(--line);background:#1c130d;color:var(--text);text-transform:uppercase" placeholder="예: EMBER7"><div class="acts"><button class="btn" data-close>취소</button><button class="btn main" id="seedGo">이 시드로 시작</button></div>');
  var inp = m.querySelector('#seedIn'); setTimeout(function () { inp.focus(); }, 50);
  function go() { var v = inp.value.trim().toUpperCase(); if (!v) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); return; } closeModal(); askNew(v); }
  m.querySelector('#seedGo').onclick = go; inp.onkeydown = function (e) { if (e.key === 'Enter') go(); };
};
$('tSettings').onclick = openSettings; $('tRecords').onclick = openRecords; $('tNotes').onclick = openPatch;

/* ---------------- test autopilot (only with ?test=1) ---------------- */
function autoStep(dt) {
  var a = auto; if (a.hold) return; if (!a.path || !a.path.length) { a.vec = { x: 0, y: 0 }; if (a.done) { var d = a.done; auto = null; d(); } return; }
  var p = a.path[0], dx = p[0] - S.px, dy = p[1] - S.py, d2 = Math.hypot(dx, dy);
  a.stuck = (a.stuck || 0) + dt;
  if (d2 < 0.12) { a.path.shift(); a.stuck = 0; return; }
  if (a.stuck > 3) { a.fail = 'stuck at ' + S.px.toFixed(2) + ',' + S.py.toFixed(2); a.path = []; return; }
  a.vec = { x: dx / d2, y: dy / d2 };
}
if (TEST) window.EH = {
  get S() { return S; }, get P() { return P; }, C: C, MAP: MAP, get mode() { return mode; }, get dlg() { return DLG; }, get modal() { return modalOpen; },
  start: function (seed) { startGame(seed); }, interact: interact, target: function () { var t = nearestTarget(); return t && { kind: t.kind, id: t.ref && (t.ref.id || t.ref), label: targetLabel(t) }; },
  walkTo: function (x, y) { return new Promise(function (res) { var path = bfsPath(Math.floor(S.px), Math.floor(S.py), x, y); if (!path) return res('no path'); path.push([x + 0.5, y + 0.5]); auto = { path: path, vec: { x: 0, y: 0 } }; auto.done = function () { res('ok'); }; var chk = setInterval(function () { if (auto && auto.fail) { var f = auto.fail; auto = null; clearInterval(chk); res(f); } if (!auto) clearInterval(chk); }, 50); }); },
  hold: function (vx, vy, ms) { return new Promise(function (res) { auto = { hold: true, vec: { x: vx, y: vy } }; var st = performance.now(); (function tick() { if (performance.now() - st > ms) { auto = null; return res(); } auto && (auto.vec = { x: vx, y: vy }); requestAnimationFrame(tick); })(); }); },
  setTime: function (h) { S.t = Math.floor(S.t / 1440) * 1440 + h * 60; npcPlace(); }, timeScale: function (k) { window.__ehTimeScale = k; },
  npcs: NPCS, hour: hour, choose: dialogChoose, closeModal: closeModal, openBook: openBook
};
// the autopilot drives updatePlayer through inputVec; make bfs avoid nothing extra

/* ---------------- boot ---------------- */
bakeBase(); resize(); initBgm();
toTitle();
requestAnimationFrame(loop);
playBgm();
if (window.FFAuth) { try { FFAuth.ready.then(function () { }); } catch (e) { } }
})();
</script>
