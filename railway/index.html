<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>철도 회사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&family=Roboto+Mono:wght@500;700&display=swap">
<style>
/* 노선도 한 장: 지도 캔버스가 화면을 채우고, 오른쪽(좁으면 아래)에 운영 패널 */
:root{
  --paper:#f7f6f2; --sea:#e4ebf0; --land:#ffffff; --north:#eeede8; --coast:#c3c9cf;
  --ink:#1c2228; --ink2:#5d6670; --line:#d9dcdf; --river:#6ea6d8; --ridge:#c9bfae;
  --accent:#0b57a4; --gold:#c99a12; --good:#1f8a4c; --bad:#c2402f; --panel:#ffffff;
  --f-disp:'Do Hyeon','Gothic A1',system-ui,sans-serif;
  --f-body:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-num:'Roboto Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;display:grid;grid-template-rows:auto 1fr;}
header{display:flex;align-items:center;gap:14px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:2px solid var(--ink);flex-wrap:wrap}
.logo{font-family:var(--f-disp);font-size:24px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:18px;height:18px;border-radius:50%;border:4px solid var(--accent);background:#fff}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat small{font-size:10.5px;color:var(--ink2);letter-spacing:.06em}
.stat b{font-family:var(--f-num);font-size:17px;font-variant-numeric:tabular-nums}
.stat b.neg{color:var(--bad)} .stat b.pos{color:var(--good)}
.spacer{flex:1}
.speed{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.speed button{border:0;background:#fff;font:600 13px var(--f-num);padding:6px 10px;cursor:pointer;color:var(--ink)}
.speed button+button{border-left:1.5px solid var(--ink)}
.speed button.on{background:var(--ink);color:#fff}
.hbtn{border:1.5px solid var(--ink);background:#fff;border-radius:8px;padding:6px 11px;font:600 13px var(--f-body);cursor:pointer;color:var(--ink);text-decoration:none}
.hbtn:focus-visible,.btn:focus-visible,.speed button:focus-visible,.tab:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{position:relative;display:grid;grid-template-columns:1fr 340px;min-height:0}
#mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--sea)}
canvas{display:block;touch-action:none;cursor:grab}
aside{background:var(--panel);border-left:2px solid var(--ink);display:flex;flex-direction:column;min-height:0;padding-right:env(safe-area-inset-right,0px)}
.tabs{display:flex;border-bottom:1.5px solid var(--line)}
.tab{flex:1;border:0;background:none;padding:11px 4px;font:600 14px var(--f-body);color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
#panel{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--f-disp);font-weight:400;font-size:26px;margin:0;line-height:1.1}
h3{font-size:12px;letter-spacing:.08em;color:var(--ink2);margin:6px 0 0;font-weight:800}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--ink2)}
.kv span:nth-child(even){font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.card{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--ink)}
.btn{border:0;border-radius:8px;padding:9px 12px;font:600 13.5px var(--f-body);cursor:pointer;background:var(--ink);color:#fff;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.gold{background:var(--gold);color:#1c1606}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn .p{font-family:var(--f-num);font-weight:700}
.muted{color:var(--ink2);font-size:12.5px;line-height:1.5}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:3px 9px;border:1.5px solid var(--line);white-space:nowrap}
.chip.ok{border-color:var(--good);color:var(--good)} .chip.no{border-color:var(--bad);color:var(--bad)}
.sw{display:inline-block;width:22px;height:7px;border-radius:4px}
.ach{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;opacity:.38}
.ach.got{opacity:1}
.ach .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);font-family:var(--f-disp);font-size:16px}
.ach.got .ic{background:var(--gold);border-color:var(--gold)}
.ach b{font-size:13.5px} .ach div div{font-size:12px;color:var(--ink2)}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:5}
.toast{background:var(--ink);color:#fff;padding:9px 14px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 18px rgba(0,0,0,.18);animation:tin .3s ease}
.toast b{color:#ffd65a}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#mini{position:absolute;left:12px;top:12px;width:170px;height:150px;border:1.5px solid var(--ink);border-radius:8px;background:#e4ebf0;cursor:pointer;touch-action:none}
@media (max-width:760px){#mini{width:110px;height:97px}}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom .hbtn{width:40px;height:40px;padding:0;font-size:18px;background:#fff}
.stops{display:flex;flex-direction:column;gap:0;border-left:4px solid var(--line);margin-left:8px}
.stop{display:flex;align-items:center;gap:10px;border:0;background:none;padding:5px 0 5px 0;margin-left:-11px;font:600 14px var(--f-body);color:var(--ink);cursor:pointer;text-align:left}
.stop i{width:14px;height:14px;border-radius:50%;background:#fff;border:3.5px solid;flex:none}
#hint{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);border:1.5px solid var(--ink);border-radius:10px;padding:7px 11px;font-size:12.5px;max-width:min(320px,70%)}
/* 시작 화면 */
#title{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:rgba(247,246,242,.82);backdrop-filter:blur(2px)}
#title .box{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px max(16px,env(safe-area-inset-left,0px))}
#title h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(56px,12vw,120px);margin:0;line-height:.95;letter-spacing:2px}
.tline{display:flex;align-items:center;gap:0;width:min(420px,80vw)}
.tline i{width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid var(--ink);flex:none}
.tline span{flex:1;height:8px;background:var(--accent)}
.tline span.g{background:var(--gold)}
.menu{display:flex;flex-direction:column;gap:10px;width:min(300px,80vw)}
.menu .btn{padding:14px;font-size:17px}
.menu small{font-size:12px;opacity:.8;font-weight:400}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:1fr 42%}
  aside{border-left:0;border-top:2px solid var(--ink);padding-right:0}
  header{gap:10px}
  .logo{font-size:20px}
  .stat b{font-size:14px}
  #hint{display:none}
}
/* 멀티 플레이 */
#lobby{display:flex;flex-direction:column;gap:10px;width:min(320px,86vw)}
#lobby .btn{padding:13px;font-size:16px;text-decoration:none}
.joinrow{display:flex;gap:8px}
.joinrow input{flex:1;min-width:0;border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px;font:700 20px var(--f-num);letter-spacing:.3em;text-transform:uppercase;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.lmsg{margin:0;text-align:center;font-size:13.5px;color:var(--ink2);line-height:1.5}
.rcode{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--ink);border-radius:12px;padding:10px;background:#fff}
.rcode small{font-size:11px;letter-spacing:.1em;color:var(--ink2)}
.rcode b{font:700 38px var(--f-num);letter-spacing:.25em;padding-left:.25em}
.plist{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.prow{display:flex;align-items:center;gap:10px;padding:9px 12px;font-weight:600;font-size:14.5px}
.prow+.prow{border-top:1px solid var(--line)}
.prow i{width:14px;height:14px;border-radius:50%;flex:none}
.prow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow small,.br small{font-size:11px;color:var(--ink2);font-weight:600}
.prow em{font-style:normal;font-size:11px;border:1.5px solid var(--gold);color:#8a6a08;border-radius:999px;padding:1px 7px}
#board{position:absolute;right:12px;top:12px;width:210px;background:rgba(255,255,255,.95);border:1.5px solid var(--ink);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;z-index:4}
#board .bt{font:800 12.5px var(--f-body);display:flex;align-items:center;gap:6px}
.gd{width:12px;height:12px;border-radius:50%;border:3px solid var(--gold);background:#fff;flex:none}
.br{display:grid;grid-template-columns:12px 1fr auto;gap:2px 7px;align-items:center;font-size:12.5px}
.br i{width:10px;height:10px;border-radius:50%}
.br span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.br b{font:700 12px var(--f-num)}
.br u{grid-column:2/4;height:4px;background:var(--line);border-radius:2px;overflow:hidden;display:block}
.br u s{display:block;height:100%}
.br.gone{opacity:.4}
#mpEnd{position:absolute;inset:0;z-index:11;display:grid;place-items:center;background:rgba(247,246,242,.86);backdrop-filter:blur(2px)}
#mpEnd .box{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px max(16px,env(safe-area-inset-left,0px))}
.endh{font-size:clamp(40px,9vw,72px)}
.endp{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.endp .dot{width:16px;height:16px;border-radius:50%}
@media (max-width:760px){#board{width:160px;padding:6px 8px}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
</head>
<body>


<div id="app">
  <header>
    <div class="logo"><i></i>철도 회사</div>
    <div class="stat"><small>자금</small><b id="sMoney">C0</b></div>
    <div class="stat"><small>초당 수익</small><b id="sRate">0</b></div>
    <div class="stat"><small id="lValue">회사 가치</small><b id="sValue">C0</b></div>
    <div class="stat"><small>누적 승객</small><b id="sPax">0</b></div>
    <div class="spacer"></div>
    <div class="speed" id="speed">
      <button data-s="0" aria-label="일시정지">❚❚</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
    </div>
    <button class="hbtn" id="bAcct" hidden>👤</button>
    <a class="hbtn" id="bLogin" hidden href="https://frenchfries777mc.github.io/games/">로그인</a>
    <button class="hbtn" id="bMenu">메뉴</button>
  </header>
  <main>
    <div id="mapwrap">
      <canvas id="map"></canvas>
      <canvas id="mini" aria-label="전체 지도"></canvas>
      <div id="toast"></div>
      <div id="board" hidden></div>
      <div id="hint">노선 끝에 붙은 점선 구간을 눌러 노선을 연장하세요. 두 손가락으로 확대, 끌어서 이동.</div>
      <div class="zoom"><button class="hbtn" id="zIn" aria-label="확대">+</button><button class="hbtn" id="zOut" aria-label="축소">−</button><button class="hbtn" id="zHome" aria-label="회사 위치로">◎</button></div>
    </div>
    <aside>
      <div class="tabs" role="tablist">
        <button class="tab on" data-t="sel" id="tabSel">선택</button>
        <button class="tab" data-t="lines">노선</button>
        <button class="tab" data-t="tech">기술</button>
        <button class="tab" data-t="ach">업적</button>
      </div>
      <div id="panel"></div>
    </aside>
  </main>
  <div id="title">
    <div class="box">
      <div class="tline"><i></i><span></span><i></i><span class="g"></span><i></i></div>
      <h1>철도 회사</h1>
      <div class="menu" id="mMain">
        <button class="btn" id="bSingle">싱글 플레이</button>
        <button class="btn alt" id="bNew" hidden>새 게임</button>
        <button class="btn alt" id="bMulti">멀티 플레이 <small>황금노선 경주</small></button>
      </div>
      <div id="lobby" hidden></div>
    </div>
  </div>
  <div id="mpEnd" hidden><div class="box"></div></div>
</div>

<script>
'use strict';
/* ================= 지도 만들기 (고정 시드라서 누구나 같은 땅) ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rnd=mulberry32(777);
const WW=19000, WH=16800, MCX=9500, MCY=8400;
const COAST=(()=>{
  const H=[[2,.12],[3,.09],[4,.06],[5,.05],[7,.04],[9,.03],[11,.025],[13,.02],[17,.015],[23,.012],[29,.01],[37,.008],[47,.006],[61,.005]].map(([k,a])=>[k,a,rnd()*Math.PI*2]);
  const pts=[];
  for(let i=0;i<1100;i++){
    const t=i/1100*Math.PI*2;let r=1;H.forEach(([k,a,p])=>r+=a*Math.sin(k*t+p));
    r=r*7080+(rnd()-0.5)*60;
    pts.push([Math.max(150,Math.min(WW-150,MCX+Math.cos(t)*r*1.18)),Math.max(150,Math.min(WH-150,MCY+Math.sin(t)*r*0.98))]);
  }
  return pts;
})();
/* 땅 판정: 10km 줄마다 해안선과 만나는 x를 미리 구해 둠 */
const ROWH=10,ROWS=[];
for(let r=0;r*ROWH<WH;r++){const y=(r+0.5)*ROWH,xs=[];
  for(let i=0,j=COAST.length-1;i<COAST.length;j=i++){const [xi,yi]=COAST[i],[xj,yj]=COAST[j];if((yi>y)!==(yj>y))xs.push((xj-xi)*(y-yi)/(yj-yi)+xi);}
  ROWS.push(new Float64Array(xs.sort((a,b)=>a-b)));}
function onLand(x,y){const r=Math.floor(y/ROWH);if(r<0||r>=ROWS.length)return false;const xs=ROWS[r];let lo=0,hi=xs.length;while(lo<hi){const m=(lo+hi)>>1;if(xs[m]<x)lo=m+1;else hi=m;}return (lo&1)===1;}
function landPoint(){for(;;){const x=rnd()*WW,y=rnd()*WH;if(onLand(x,y))return [x,y];}}

/* 이름 */
const PRE=['한','새','솔','청','금','은','별','다','가','해','달','온','윤','서','봄','이슬','단','보','설','진','명','태','백','양','안','평','영','화','누리','아라','미르','나래','구름','하늘','바다','노을','푸른','고요','너울','소담','도담','마루','가람','여울','시내','하람','라온','예솔','초록','다솜','로아','새벽','유리','은솔','청아','한울','해솔','차오','무지','이랑','가온','나린','다린','라라','마중','바름','아름','자람','타래','파랑','하랑','고운','나눔','도란','두리','모아','바투','소리','아토','이든','조은','차미','큰솔','한결','해든','가비','노리','다올','보라','새봄','슬기','아리','여름','우리','진솔','채움','푸름','한빛','해밀','가을','겨울','구슬','금빛','달빛','물빛','별빛','은빛','꽃잎','솔빛','들꽃','늘봄','단비','미리내','비단','산들','시원','온새','이음','자작','참솔','청솔','풀잎','한솔','해랑','흰돌','검돌','너른','깊은','맑은','고른'];
const S1=['가','나','다','라','마','바','사','아','자','차','카','타','파','하','도','소','미','보','서','고','노','모','로','수','우','주','추','후','시','이','지','리'],S2=['온','솔','람','린','결','빛','슬','율','담','윤','봄','별','들','산','내','강','숲','길','샘','실','결','늘'];
const SUF=['포','골','내','뫼','진','원','들','주','천','항','성','나루','실','터','벌','재','고을','마을','숲','언덕','동','리','촌','산','곶','목','못','둔'];
const usedName=new Set();
function rpick(a){return a[Math.floor(rnd()*a.length)];}
function anyPre(){return rnd()<0.55?rpick(PRE):rpick(S1)+rpick(S2);}
function uniqueName(suffixFn){for(;;){const n=anyPre()+suffixFn();if(!usedName.has(n)){usedName.add(n);return n;}}}

/* 산맥 */
const FEATURES=[];
for(let i=0;i<120;i++){
  let [x,y]=landPoint(),a=rnd()*Math.PI*2;const pts=[[x,y]],len=10+Math.floor(rnd()*14);
  for(let k=0;k<len;k++){a+=(rnd()-0.5)*0.6;x+=Math.cos(a)*62;y+=Math.sin(a)*62;if(!onLand(x,y))break;pts.push([x,y]);}
  if(pts.length>=5)FEATURES.push({k:'mtn',lvl:rnd()<0.4?2:1,n:uniqueName(()=>'산맥'),p:pts});
}
/* 강 3줄기: 대륙 한쪽 바다에서 반대쪽 바다까지 */
(()=>{
  const phi=rnd()*Math.PI,dx=Math.cos(phi),dy=Math.sin(phi),nx=-dy,ny=dx,lv=[3,2,2];
  [-0.42,0.02,0.44].forEach((o,ri)=>{
    const cx0=MCX+nx*o*7080,cy0=MCY+ny*o*7080*0.85;
    const edge=sg=>{let x=cx0,y=cy0;for(let k=0;k<4000;k++){const x2=x+dx*sg*10,y2=y+dy*sg*10;if(!onLand(x2,y2))return [x2+dx*sg*60,y2+dy*sg*60];x=x2;y=y2;}return [x,y];};
    const A=edge(-1),B=edge(1),L=Math.hypot(B[0]-A[0],B[1]-A[1]),n=Math.ceil(L/40);
    const W=[[1,0],[2,0],[3,0],[5,0],[7,0],[11,0],[17,0]].map(([k])=>[k,(rnd()-0.5)*2*Math.min(420,1400/k)]);
    const pts=[];
    for(let i=0;i<=n;i++){const t=i/n;let m=0;W.forEach(([k,a])=>m+=a*Math.sin(k*Math.PI*t));
      pts.push([A[0]+(B[0]-A[0])*t+nx*m,A[1]+(B[1]-A[1])*t+ny*m]);}
    FEATURES.push({k:'river',lvl:lv[ri],n:uniqueName(()=>'강'),p:pts});
  });
})();
FEATURES.forEach(f=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;f.p.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);});f.bb=[x0,y0,x1,y1];});

/* 도시: 최소 간격 170km */
const CITIES=[],CG=120,CGRID=new Map();const ckey=(i,j)=>i+','+j;
function cityOK(x,y){if(x<60||y<60||x>WW-60||y>WH-60||!onLand(x,y))return false;
  for(let a=0;a<6;a++)if(!onLand(x+Math.cos(a)*55,y+Math.sin(a)*55))return false;
  const i0=Math.floor(x/CG),j0=Math.floor(y/CG);
  for(let j=j0-2;j<=j0+2;j++)for(let i=i0-2;i<=i0+2;i++){const c=CGRID.get(ckey(i,j));if(c&&Math.hypot(c.x-x,c.y-y)<170)return false;}return true;}
function addCity(x,y){const c={x,y,pop:1.5+Math.pow(rnd(),2)*5};CITIES.push(c);CGRID.set(ckey(Math.floor(x/CG),Math.floor(y/CG)),c);return c;}
(()=>{let s=[MCX,MCY];for(let k=0;k<2000&&!cityOK(s[0],s[1]);k++)s=[MCX+(rnd()-.5)*800,MCY+(rnd()-.5)*800];

  while(act.length){const ai=Math.floor(rnd()*act.length),c=act[ai];let placed=false;
    for(let t=0;t<24;t++){const a=rnd()*Math.PI*2,r=170+rnd()*130,x=c.x+Math.cos(a)*r,y=c.y+Math.sin(a)*r;if(cityOK(x,y)){act.push(addCity(x,y));placed=true;break;}}
    if(!placed){act[ai]=act[act.length-1];act.pop();}}})();

/* 정해진 구간: 가브리엘 그래프 */
function inter(a,b,c,d){
  const r=[b[0]-a[0],b[1]-a[1]],s=[d[0]-c[0],d[1]-c[1]],den=r[0]*s[1]-r[1]*s[0];
  if(Math.abs(den)<1e-9)return null;
  const t=((c[0]-a[0])*s[1]-(c[1]-a[1])*s[0])/den,u=((c[0]-a[0])*r[1]-(c[1]-a[1])*r[0])/den;
  return (t>0.04&&t<0.96&&u>=0&&u<=1)?t:null;
}
const SEGS=[];
CITIES.forEach(A=>{
  const i0=Math.floor(A.x/CG),j0=Math.floor(A.y/CG),nb=[];
  for(let j=j0-3;j<=j0+3;j++)for(let i=i0-3;i<=i0+3;i++){const c=CGRID.get(ckey(i,j));if(c&&c!==A&&Math.hypot(c.x-A.x,c.y-A.y)<=340)nb.push(c);}
  nb.forEach(B=>{if(B.i<A.i)return;const d=Math.hypot(A.x-B.x,A.y-B.y),mx=(A.x+B.x)/2,my=(A.y+B.y)/2;
    if(nb.some(C=>C!==B&&Math.hypot(C.x-mx,C.y-my)<d/2))return;
    for(let k=1;k<10;k++)if(!onLand(A.x+(B.x-A.x)*k/10,A.y+(B.y-A.y)*k/10))return;
    SEGS.push({a:A,b:B,km:d});});
});
/* 강과 산맥이 구간을 가로지르는 곳 */
const FG=new Map(),FGC=250;
FEATURES.forEach((f,fi)=>{for(let k=0;k<f.p.length-1;k++){const [x0,y0]=f.p[k],[x1,y1]=f.p[k+1];
  for(let j=Math.floor(Math.min(y0,y1)/FGC);j<=Math.floor(Math.max(y0,y1)/FGC);j++)for(let i=Math.floor(Math.min(x0,x1)/FGC);i<=Math.floor(Math.max(x0,x1)/FGC);i++){const kk=i+','+j;if(!FG.has(kk))FG.set(kk,[]);FG.get(kk).push([fi,k]);}}});
SEGS.forEach((s,i)=>{
  s.i=i;s.obs=[];const hits=new Map();
  for(let j=Math.floor(Math.min(s.a.y,s.b.y)/FGC);j<=Math.floor(Math.max(s.a.y,s.b.y)/FGC);j++)for(let ii=Math.floor(Math.min(s.a.x,s.b.x)/FGC);ii<=Math.floor(Math.max(s.a.x,s.b.x)/FGC);ii++){
    const l=FG.get(ii+','+j);if(!l)continue;
    l.forEach(([fi,k])=>{const f=FEATURES[fi],t=inter([s.a.x,s.a.y],[s.b.x,s.b.y],f.p[k],f.p[k+1]);if(t!==null&&(!hits.has(fi)||t<hits.get(fi)))hits.set(fi,t);});}
  hits.forEach((t,fi)=>s.obs.push({f:FEATURES[fi],t,x:s.a.x+(s.b.x-s.a.x)*t,y:s.a.y+(s.b.y-s.a.y)*t}));
  s.obs.sort((p,q)=>p.t-q.t);s.name=s.a.n+' — '+s.b.n;
});

function newTrainRT(L,k){const end=k%2===1;return {st:end?L.cities.length-1:0,dir:end?-1:1,moving:false,u:0,t:0.3+k*1.4,load:0,acc:0};}

const obsFixed=(sid,k)=>!!S.fixed[sid+'-'+k];
const unresolved=sid=>SEGS[sid].obs.filter((o,k)=>!obsFixed(sid,k));
function detour(sid){let f=1;unresolved(sid).forEach(o=>f*=o.f.k==='river'?1.5:1.6);return f;}
let CONN=null;
function connected(){if(CONN)return CONN;const set=new Set();Object.keys(S.track).forEach(sid=>{set.add(SEGS[sid].a.i);set.add(SEGS[sid].b.i);});return CONN=set;}
const takenByOther=sid=>inMP()&&MP.own[sid]!==undefined&&MP.own[sid]!==MP.me;
function available(sid){if(S.track[sid])return true;if(takenByOther(sid))return false;const c=connected();return c.has(SEGS[sid].a.i)||c.has(SEGS[sid].b.i);}
function trainSpeed(sid,tr){if(!tr.hs)return 14;if(S.track[sid].hs&&unresolved(sid).length===0)return 36;return 16;}
const capOf=tr=>[2,4,6][tr.cars]*40;
function runCost(){let c=0;Object.keys(S.track).forEach(sid=>{c+=0.25+SEGS[sid].km*0.004+(S.track[sid].hs?0.4:0);});S.lines.forEach(L=>L.trains.forEach(t=>c+=t.hs?2.5:1));return c;}
function trainCount(){let n=0;S.lines.forEach(L=>n+=L.trains.length);return n;}

/* ================= 시뮬레이션 ================= */
let speedMul=1;
function legSeg(L,r){return L.segs[r.dir>0?r.st:r.st-1];}
function step(dt){
  S.stats.time+=dt;let earned=0;
  S.lines.forEach(L=>{
    const n=L.cities.length,pool=RT.pool[L.id],pops=L.cities.map(ci=>S.pop[ci]);
    let tot=pops.reduce((a,b)=>a+b,0),pre=0;
    L.cities.forEach((ci,i)=>{
      const lvl=S.stations[ci],post=tot-pre-pops[i],g=0.3*STATION_GEN[lvl]*dt,cap=STATION_CAP[lvl];
      pool[i][0]+=g*Math.sqrt(pops[i]*post);pool[i][1]+=g*Math.sqrt(pops[i]*pre);
      for(let d=0;d<2;d++)if(pool[i][d]>cap){S.stats.missed+=pool[i][d]-cap;pool[i][d]=cap;}
      pre+=pops[i];
    });
    L.trains.forEach((tr,ti)=>{
      const r=RT.tr[L.id][ti];if(!r)return;const mul=tr.hs?1.4:1;
      if(!r.moving){r.t-=dt;if(r.t>0)return;
        const d=r.dir>0?0:1,take=Math.min(capOf(tr)-r.load,Math.floor(pool[r.st][d]));
        if(take>0){pool[r.st][d]-=take;r.load+=take;earned+=take*2*mul;r.acc+=take*2*mul;}
        r.moving=true;r.u=0;return;}
      const sid=legSeg(L,r),s=SEGS[sid],du=trainSpeed(sid,tr)*dt/(s.km*detour(sid));
      const step=Math.min(du,1-r.u);r.u+=step;const g=r.load*0.06*s.km*step*mul;earned+=g;r.acc+=g;
      if(r.u>=1){
        r.st+=r.dir;r.moving=false;r.t=1.0;const ci=L.cities[r.st];
        const ahead=r.dir>0?n-1-r.st:r.st;
        const off=ahead===0?r.load:Math.round(r.load/(ahead+1));
        r.load-=off;S.stats.pax+=off;S.pop[ci]=Math.min(CITIES[ci].pop*2.6,S.pop[ci]+off*0.00004);
        if(r.acc>=1)RT.floats.push({x:CITIES[ci].x,y:CITIES[ci].y,v:'+'+fmtShort(r.acc),t:0,hs:tr.hs});r.acc=0;
        if(ahead===0)r.dir=-r.dir;
      }
    });
  });
  const cost=runCost()*dt;S.money+=earned-cost;S.stats.earned+=earned;
  RT.acc+=earned-cost;RT.sec+=dt;
  if(RT.sec>=1){RT.income.push(RT.acc/RT.sec);if(RT.income.length>10)RT.income.shift();RT.acc=0;RT.sec=0;checkAch();}
}

function segPath(sid){

  const mx=(s.a.x+s.b.x)/2,my=(s.a.y+s.b.y)/2,dx=s.b.x-s.a.x,dy=s.b.y-s.a.y,off=n*0.2*(sid%2?1:-1);
  return {ax:s.a.x,ay:s.a.y,bx:s.b.x,by:s.b.y,cx:mx-dy*off,cy:my+dx*off};

function bez(p,t){const u=1-t;return [u*u*p.ax+2*u*t*p.cx+t*t*p.bx,u*u*p.ay+2*u*t*p.cy+t*t*p.by];}

function poly(pts,close){cx.beginPath();pts.forEach(([x,y],i)=>i?cx.lineTo(sx(x),sy(y)):cx.moveTo(sx(x),sy(y)));if(close)cx.closePath();}
function bbVis(bb){return sx(bb[2])>-60&&sx(bb[0])<VW+60&&sy(bb[3])>-60&&sy(bb[1])<VH+60;}

  const z=view.s,showLbl=z>0.55;
  cx.lineCap='round';cx.lineJoin='round';
  FEATURES.forEach(f=>{if(!bbVis(f.bb))return;
    if(f.k==='mtn'){poly(f.p);cx.strokeStyle='rgba(185,170,145,.32)';cx.lineWidth=Math.max(3,30*z);cx.stroke();return;}

  const meta={pid:MP.me,name:MP.name,joined:MP.joined,c:MP.creator?1:0};
  if(LOCAL){ // 같은 브라우저 탭끼리 시험용

    bc.onmessage=e=>{const m=e.data;if(m.t==='_hb'){peers[m.meta.pid]={...m.meta,seen:Date.now()};onPeers({...peers});return;}
      if(m.t==='_bye'){delete peers[m.pid];onPeers({...peers});return;}onMsg(m);};
    hb();const iv=setInterval(hb,1000);

    case 'claim':if(inMP()&&isHost()&&!MP.over){const o=MP.own[m.sid];
      if(o!==undefined&&o!==m.pid)MP.T.send({t:'deny',sid:m.sid,pid:m.pid});else{MP.own[m.sid]=m.pid;MP.T.send({t:'grant',sid:m.sid,pid:m.pid});}}break;
    case 'grant':if(inMP())mpGrant(m.sid,m.pid);break;
    case 'deny':if(inMP()&&m.pid===MP.me&&MP.pend&&MP.pend.sid===m.sid)mpDeny();break;
    case 'own':if(inMP())for(const k in m.own)mpGrant(+k,m.own[k]);break;
    case 'st':if(inMP()&&MP.players[m.pid])Object.assign(MP.players[m.pid],{prog:m.prog,n:m.n});break;
    case 'win':if(inMP()&&isHost()&&!MP.over)MP.T.send({t:'over',pid:m.pid});break;
    case 'over':if(inMP()&&!MP.over)mpEnd(m.pid,'');break;
  }
}

/* 황금노선과 출발 구간 고르기 (방장) */
function crossesRiver(a,b){return FEATURES.some(f=>{if(f.k!=='river')return false;for(let i=1;i<f.p.length;i++)if(inter([a.x,a.y],[b.x,b.y],f.p[i-1],f.p[i])!==null)return true;return false;});}
function reach(from){const seen=new Uint8Array(CITIES.length),q=[from];seen[from]=1;while(q.length){const c=q.pop();ADJ[c].forEach(sid=>{const s=SEGS[sid],o=s.a.i===c?s.b.i:s.a.i;if(!seen[o]){seen[o]=1;q.push(o);}});}return seen;}
function mpPlan(n){
  const big=CITIES.filter(c=>c.pop>=3);
  for(let tries=0;tries<300;tries++){
    const A=big[Math.floor(Math.random()*big.length)],ring=big.filter(c=>{const d=Math.hypot(A.x-c.x,A.y-c.y);return d>=1400&&d<=1900;});if(!ring.length)continue;
    const B=ring[Math.floor(Math.random()*ring.length)],d=Math.hypot(A.x-B.x,A.y-B.y);
    if(!crossesRiver(A,B))continue;
    let land=true;for(let k=1;k<12;k++)if(!onLand(A.x+(B.x-A.x)*k/12,A.y+(B.y-A.y)*k/12)){land=false;break;}if(!land)continue;
    const R=reach(A.i);if(!R[B.i])continue;
    const ux=(B.x-A.x)/d,uy=(B.y-A.y)/d,vx=-uy,vy=ux,mx=(A.x+B.x)/2,my=(A.y+B.y)/2,used=new Set([A.i,B.i]),starts=[];
    const SH=[0,0,260,260,-260,-260,480,-480];let ok=true;
    for(let k=0;k<n&&ok;k++){
      const side=k%2?-1:1,tx=mx+vx*side*430+ux*SH[k],ty=my+vy*side*430+uy*SH[k];let best=null;
      SEGS.forEach(s=>{if(used.has(s.a.i)||used.has(s.b.i)||!R[s.a.i])return;const dd=Math.hypot((s.a.x+s.b.x)/2-tx,(s.a.y+s.b.y)/2-ty);if(dd>340)return;
        const sc=dd+s.obs.length*120+Math.abs(s.km-220);if(!best||sc<best.sc)best={sid:s.i,sc};});
      if(!best){ok=false;break;}
      const s=SEGS[best.sid];[s.a.i,s.b.i].forEach(c=>{used.add(c);if(n<=5)ADJ[c].forEach(x=>{used.add(SEGS[x].a.i);used.add(SEGS[x].b.i);});});
      starts.push(best.sid);}
    if(ok)return {a:A.i,b:B.i,starts};
  }
  return null;
}
function mpHostStart(){
  const l=peerList().slice(0,8);if(l.length<2)return;const plan=mpPlan(l.length);
  if(!plan){lobbyMsg='출발 자리를 찾지 못했어요. 다시 눌러 주세요';renderLobby(true);return;}
  const pl={};l.forEach((p,i)=>pl[p.pid]={name:p.name,color:PCOL[i],sid:plan.starts[i]});
  MP.T.send({t:'start',a:plan.a,b:plan.b,pl});
}
function mpStart(m){
  if(!m.pl[MP.me]){mpLeave('이번 경주에 끼지 못했어요');return;}
  MP.state='game';MP.over=false;MP.pend=null;MP.golden={a:m.a,b:m.b};MP.players={};MP.own={};
  for(const pid in m.pl){const p=m.pl[pid];MP.players[pid]={name:p.name,color:p.color,sid:p.sid,prog:0,n:1,gone:0};MP.own[p.sid]=pid;}
  const s=freshState(m.pl[MP.me].sid);s.money=6000;s.lines[0].color=mpColor();S=s;CONN=null;initRuntime();
  MP.d0=goldDist();
  title.hidden=true;hideLobby();running=true;sel=null;
  speedMul=3;document.getElementById("speed").hidden=true;document.getElementById('board').hidden=false;setLabels(true);
  view.user=false;fitView();render();renderBoard();
  toast(`<b>${CITIES[m.a].n}</b>와 <b>${CITIES[m.b].n}</b>를 먼저 잇는 회사가 이겨요`);
}
function setLabels(mp){document.getElementById('lValue').textContent=mp?'황금노선':'회사 가치';}
function goldDist(){const c=[...connected()];let t=0;[MP.golden.a,MP.golden.b].forEach(g=>{const G=CITIES[g];let m=1e9;c.forEach(i=>{const d=Math.hypot(CITIES[i].x-G.x,CITIES[i].y-G.y);if(d<m)m=d;});t+=m;});return t;}
const goldProg=()=>Math.max(0,Math.min(1,1-goldDist()/MP.d0));
function goldLinked(){const {a,b}=MP.golden,adj={};Object.keys(S.track).forEach(k=>{const s=SEGS[k];(adj[s.a.i]=adj[s.a.i]||[]).push(s.b.i);(adj[s.b.i]=adj[s.b.i]||[]).push(s.a.i);});
  const seen=new Set([a]),q=[a];while(q.length){const c=q.pop();if(c===b)return true;(adj[c]||[]).forEach(o=>{if(!seen.has(o)){seen.add(o);q.push(o);}});}return false;}

/* 구간 선점: 돈을 먼저 내고, 방장이 허락하면 깔기 */
function mpClaim(sid,cost,apply){
  if(MP.pend||MP.over)return;const o=MP.own[sid];if(o!==undefined&&o!==MP.me){toast('다른 회사 구간이에요');return;}
  if(!spend(cost))return;MP.pend={sid,cost,apply,at:Date.now(),re:0};MP.T.send({t:'claim',sid,pid:MP.me});render();
}
function mpGrant(sid,pid){
  MP.own[sid]=pid;CONN=null;
  if(pid===MP.me&&MP.pend&&MP.pend.sid===sid){const p=MP.pend;MP.pend=null;p.apply();render();
    if(goldLinked()){MP.T.send({t:'win',pid:MP.me});}}
  else if(pid!==MP.me&&sel&&sel.k==='seg'&&sel.id===sid)render();
}
function mpDeny(){const p=MP.pend;MP.pend=null;S.money+=p.cost;S.invested-=p.cost;toast('다른 회사가 먼저 차지한 구간이에요. 돈은 돌려받았어요');render();}
function mpTick(){
  const now=Date.now();
  if(now-MP.t.st>1500){MP.t.st=now;const pr=goldProg();MP.T.send({t:'st',pid:MP.me,prog:pr,n:Object.keys(S.track).length});renderBoard();}
  if(isHost()&&now-MP.t.own>5000){MP.t.own=now;MP.T.send({t:'own',own:MP.own});}
  if(MP.pend){const a=now-MP.pend.at;if(a>3500&&!MP.pend.re){MP.pend.re=1;MP.T.send({t:'claim',sid:MP.pend.sid,pid:MP.me});}else if(a>10000)mpDeny();}
  if(!MP.over){const others=Object.keys(MP.players).filter(p=>p!==MP.me);
    if(others.length&&others.every(p=>MP.players[p].gone&&now-MP.players[p].gone>6000))mpEnd(MP.me,'다른 회사가 모두 나갔어요');}
}
function renderBoard(){
  const g=MP.golden;if(!g)return;MP.players[MP.me].prog=goldProg();MP.players[MP.me].n=Object.keys(S.track).length;
  const rows=Object.entries(MP.players).sort((a,b)=>b[1].prog-a[1].prog);
  let h=`<div class="bt"><span class="gd"></span>${CITIES[g.a].n} ↔ ${CITIES[g.b].n}</div>`;
  rows.forEach(([pid,p])=>h+=`<div class="br${p.gone?' gone':''}"><i style="background:${p.color}"></i><span>${esc(p.name)}${pid===MP.me?' <small>나</small>':''}</span><b>${Math.round(p.prog*100)}%</b><u><s style="width:${Math.round(p.prog*100)}%;background:${p.color}"></s></u></div>`);
  document.getElementById('board').innerHTML=h;
}
function mpEnd(pid,note){
  MP.over=true;running=false;const p=MP.players[pid]||{name:'?',color:'#999'},me=pid===MP.me;renderBoard();
  const e=document.getElementById('mpEnd');e.hidden=false;
  e.querySelector('.box').innerHTML=`<div class="tline"><i></i><span class="g"></span><i></i></div>
  <h2 class="endh">${me?'황금노선 완공!':'경주 끝'}</h2>
  <p class="endp"><span class="dot" style="background:${p.color}"></span><b>${esc(p.name)}</b> ${me&&!note?'회사가 가장 먼저 이었어요':me?'회사가 이겼어요':'회사가 먼저 이었어요'}</p>
  ${note?`<p class="lmsg">${note}</p>`:''}
  <div class="row" style="justify-content:center;gap:10px"><button class="btn alt" id="bEndLook">지도 보기</button><button class="btn gold" id="bEndMenu">메뉴로</button></div>`;
  document.getElementById('bEndMenu').onclick=()=>mpLeave(null);
  document.getElementById('bEndLook').onclick=()=>{e.hidden=true;toast('메뉴 버튼으로 나갈 수 있어요');};
}

/* 시작 */
S=load()||freshState();initRuntime();
resize();render();showTitle();initAccount();
requestAnimationFrame(frame);

</script>
